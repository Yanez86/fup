        {t:'"L\'ho già letto stanotte"',d:'Arrivi in ufficio con il decreto già evidenziato e un riassunto di una pagina. Nessuno osa chiederti quando dormi.',e:'Nessun effetto',req:()=>ceo().tal.includes('Excel-dipendente')||ceo().tal.includes('Stacanovista'),reqT:'Excel-dipendente o Stacanovista',r:'Al mattino hai già pronto il riassunto, con le tabelle colorate. Nessuno osa chiederti a che ora hai dormito.',f:()=>{}}]},
 {id:'matrimonio',src:'La Gazzetta del Muletto',title:'Matrimonio del figlio del cliente',cond:()=>S.clients.some(c=>c.status==='attivo'&&c.sat>=70),
  text:'Il titolare ti invita al matrimonio del figlio. Trecento invitati, tre giorni di festa.',
  opts:[{t:'Vai con un regalo all\'altezza',d:'Ci vai con l\'abito buono e un regalo all\'altezza. Il titolare ti presenta a mezza sala come «il mio uomo dei camion».',e:'−2.500 €, soddisfazione +15',r:'Il regalo è piaciuto molto: è finito nella foto di gruppo. Il cliente ti ha presentato a tutti i parenti.',f:function(){S.cash-=2500;this.c.sat=clamp(this.c.sat+15,0,100);}},
        {t:'Manda un biglietto',d:'Mandi un biglietto di auguri e un mazzo di fiori. Il titolare lo legge di fretta.',e:'Soddisfazione −5',r:'Il biglietto è arrivato. Al lunedì il cliente ti saluta in modo un po\' più formale.',f:function(){this.c.sat=clamp(this.c.sat-5,0,100);}}],
  setup:ev=>{ev.c=pick(S.clients.filter(c=>c.status==='attivo'&&c.sat>=70));ev.text=`Il titolare di ${ev.c.name} ti ha mandato una partecipazione con i bordi dorati: si sposa il figlio. Trecento invitati, tre giorni di festa e, si dice, un tavolo riservato ai fornitori di fiducia. Un'assenza verrebbe notata.`;}},
 {id:'gestionale',src:'La Gazzetta del Muletto',title:'Il WMS si aggiorna da solo',cond:()=>S.warehouses.some(w=>w.tech.wms),
  text:'Venerdì sera il WMS ha installato da solo un aggiornamento. Lunedì mattina le stampanti non riconoscono più i modelli delle bolle e i camion aspettano in banchina. L\'assistenza risponde con un messaggio registrato.',
  opts:[{t:'Chiama l\'assistenza',d:'Paghi l\'intervento urgente del tecnico. In due giorni le bolle tornano a uscire.',e:'−1.200 €, accuratezza −4 per 2 giorni',r:'Il tecnico ha risolto tutto in un giorno. Ha detto che succede spesso, che non è colpa di nessuno.',f:()=>{S.cash-=1200;mod('all',{A:-4},2);}},
        {t:'Bolle a mano',d:'Tiri fuori i blocchetti e si scrivono le bolle a penna. Qualche numero sarà sbagliato.',e:'Accuratezza −8 per 2 giorni',r:'Le bolle scritte a mano funzionano, più o meno. Un autista non riesce a leggere la calligrafia del capoturno.',f:()=>mod('all',{A:-8},2)}]},
 {id:'neve',src:'Radio Traffico Nord',title:'Neve al Frejus',cond:()=>[11,0,1,2].includes(monthOf(S.day)),
  text:'Una nevicata ha chiuso il traforo del Frejus ai mezzi pesanti. La coda arriva fino a Susa e i camion diretti in Francia sono fermi, con gli autisti che chiamano dall\'autogrill. Nessuno sa dire quando riaprirà.',
  opts:[{t:'Aspetta che riaprano',d:'Fai aspettare i camion in area di sosta finché il traforo riapre. I clienti francesi aspettano con loro.',e:'Puntualità −4 per 5 giorni',r:'I camion aspettano in fila al piazzale del Frejus. Gli autisti finiscono le scorte di panini.',f:()=>mod('all',{P:-4},5)},
        {t:'Devia dal Monte Bianco',d:'Mandi i camion verso il Monte Bianco. Più km e più pedaggi, ma la merce arriva.',e:'−4.000 € di pedaggi, puntualità −1',r:'I camion girano dal Monte Bianco. I pedaggi costano, ma la merce si muove.',f:()=>{S.cash-=4000;mod('all',{P:-1},5);}}]},
 {id:'allerta',src:'Radio Traffico Nord',title:'Allerta rossa in Liguria',cond:()=>[8,9,10].includes(monthOf(S.day)),
  text:'La Protezione civile ha diramato l\'allerta rossa sul genovese. Piove da due giorni, le autostrade chiudono e riaprono a singhiozzo e il porto lavora a metà. Gli autisti diretti in Liguria aspettano istruzioni.',
  opts:[{t:'Ferma i mezzi per due giorni',d:'Tieni i camion in deposito per due giorni. Nessun rischio, ma le consegne slittano.',e:'Puntualità −8 per 4 giorni',r:'I camion restano al coperto. Il giorno dopo le strade sono un disastro, ma i mezzi sono tutti interi.',f:()=>mod('all',{P:-8},4)},
        {t:'Si parte con prudenza',d:'Fai partire i camion con l\'ordine di fermarsi al primo segnale di pericolo. Speri che basti.',e:'Puntualità −3; rischio danni seri',r:'Si parte piano, con un occhio al cielo. L\'ufficio traffico segue ogni camion sulla mappa.',f:()=>{mod('all',{P:-3},4); if(Math.random()<0.25){S.cash-=20000;toast('Un rimorchio allagato: 20.000 € di merce rovinata','bad');}}}]},
 {id:'ztl',src:'Il Mattinale del Ministero',title:'Milano lancia "Zero Camion"',cond:()=>yearOf(S.day)>=2008,once:true,
  text:'Il Comune di Milano ha presentato "Zero Camion": una nuova ZTL in centro dove entrano solo mezzi Euro 5, e solo dalle 10 alle 12. Metà della tua flotta è più vecchia. I clienti in centro vogliono la merce come prima.',
  opts:[{t:'Rinnova parte della flotta',d:'Compri qualche mezzo nuovo in regola con la ZTL. Una spesa grossa, ma in centro si entra.',e:'−25.000 €',r:'I furgoni nuovi entrano in centro senza problemi. Il commerciale li fotografa per il sito.',f:()=>{S.cash-=25000;}},
        {t:'Consegne all\'alba coi furgoni',d:'Consegni all\'alba con i furgoni, prima che la ZTL si accenda. Funziona, ma qualche ritardo scappa.',e:'Puntualità −2 per 3 mesi',r:'Le consegne partono alle cinque del mattino. I furgoni sono puntuali, gli autisti un po\' meno svegli.',f:()=>mod('all',{P:-2},90)}]},
 {id:'elezioni',src:'Il Sole 24 Pallet',title:'Elezioni anticipate',cond:()=>Math.random()<0.4,
  text:'Il governo è caduto e si vota tra due mesi. Tutti i partiti promettono "una grande riforma dell\'autotrasporto", ma nessuno dice quale. L\'associazione di categoria ti chiede se vuoi farti sentire.',
  opts:[{t:'Aspetta e guarda',d:'Lasci che i politici facciano campagna senza di te. Tanto le promesse cambiano ogni settimana.',e:'Nessun effetto',r:'Le elezioni passano, i camion restano. Ne riparliamo alla prossima crisi di governo.',f:()=>{}},
        {t:'Organizza un convegno di categoria',d:'Affitti una sala e inviti candidati e trasportatori a un convegno. Il giornale locale ti dedica mezza pagina.',e:'−3.000 €, reputazione +3',r:'Al convegno sono venuti in tanti, anche due candidati. Il buffet è finito in un quarto d\'ora.',f:()=>{S.cash-=3000;S.rep+=3;}}]},
 {id:'moda',src:'La Gazzetta del Muletto',title:'Settimana della moda',cond:()=>[1,8].includes(monthOf(S.day)),
  text:'È la settimana della moda e Milano è bloccata da fotografi, influencer e monopattini. Ieri un tuo consegnatore, cercando l\'entrata di servizio, è finito per sbaglio in passerella con due colli in mano. Il video gira già.',
  opts:[{t:'Fai finta di niente',d:'Nessun commento, e i furgoni girano alla larga dal centro. Le consegne in città rallentano.',e:'Puntualità −2 per 7 giorni',r:'Le consegne in centro vanno a rilento, tra modelle e transenne. Nessuno se ne accorge, per fortuna.',f:()=>mod('all',{P:-2},7)},
        {t:'Cavalca la notizia sui social',d:'Pubblichi il video sui social: «Le nostre consegne arrivano ovunque». Lo rilanciano anche le riviste di moda.',e:'Reputazione +3',r:'La foto del tuo camion vicino alla sfilata gira sui social. Qualcuno la commenta con «stile».',f:()=>{S.rep+=3;}}]},
 {id:'giro',src:'Radio Traffico Nord',title:'Passa il Giro d\'Italia',cond:()=>monthOf(S.day)===4,
  text:'Il Giro d\'Italia attraversa le Langhe: strade chiuse dalle 11 alle 17 su metà dei percorsi di consegna. Gli autisti hanno già capito che sarà una giornata strana. Qualcuno ha portato la bandiera.',
  opts:[{t:'Anticipa le consegne',d:'Riorganizzi i giri per partire alle 5 e chiudere prima del passaggio della corsa. Gli straordinari si pagano.',e:'Straordinari −1.500 €',r:'Le consegne sono partite all\'alba. Il Giro è passato davanti a un magazzino vuoto e tranquillo.',f:()=>{S.cash-=1500;}},
        {t:'Tutti a bordo strada a fare il tifo',d:'Fermi i camion, porti tutti a bordo strada e applaudi la corsa. Le consegne arrivano il giorno dopo.',e:'Puntualità −3 per 2 giorni, morale +4',r:'Il gruppo è passato in otto secondi. Il magazzino ha urlato, applaudito, poi è tornato al lavoro.',f:()=>mod('all',{P:-3,mor:4},2)}]},
 {id:'derby',src:'La Gazzetta del Muletto',title:'Derby della Madonnina',cond:()=>!hasTal('Tifo sfegatato'),
  text:'Domenica c\'è stato il derby di Milano e il magazzino è diviso in due: interisti da una parte, milanisti dall\'altra. Stamattina nessuno si rivolge la parola e le liste di picking passano di mano senza un saluto. Qualcuno ha appeso una sciarpa sul muletto avversario.',
  opts:[{t:'Vieta le sciarpe in magazzino',d:'Vieti sciarpe e magliette in magazzino. Le tensioni calano, l\'entusiasmo pure.',e:'Morale −2',r:'Le sciarpe restano negli armadietti. Il derby, però, si discute lo stesso, a voce bassa.',f:()=>mod('all',{mor:-2},20)},
        {t:'Organizza la partitella aziendale',d:'Organizzi una partitella tra le due tifoserie, con grigliata finale. Vince il magazzino.',e:'−800 €, morale +4',r:'La partitella finisce in pareggio e senza feriti. Tutti dicono che l\'arbitro era venduto.',f:()=>{S.cash-=800;mod('all',{mor:4},40);}}]},
 {id:'cane',src:'La Gazzetta del Muletto',title:'Il cane del capoturno',cond:()=>true,
  text:'Il capoturno si è presentato con Brutus, un cane di 60 kg che secondo lui è "buonissimo". Brutus gira tra le corsie annusando i bancali e scodinzolando contro gli scaffali. Mezza squadra lo adora, l\'altra metà lavora con un occhio sempre su di lui.',
  opts:[{t:'Brutus diventa la mascotte',d:'Brutus diventa la mascotte del magazzino, con tanto di cuccia in banchina. Qualche collo finisce nel posto sbagliato.',e:'Morale +3, accuratezza −0,5 per 30 giorni',r:'Brutus ha già il suo posto in ufficio. Ogni tanto si porta via un\'etichetta per giocare.',f:()=>mod('all',{mor:3,A:-0.5},30)},
        {t:'Brutus resta a casa',d:'Chiedi gentilmente al capoturno di lasciare Brutus a casa. Lui ci resta male, la squadra respira.',e:'Morale −1',r:'Brutus resta a casa. Il capoturno al mattino arriva un po\' più triste.',f:()=>mod('all',{mor:-1},20)}]},
 {id:'tiktok',src:'La Gazzetta del Muletto',title:'Autista virale su TikTok',cond:()=>yearOf(S.day)>=2020,
  text:'Un tuo autista ha pubblicato un video in cui balla sul cassone durante una sosta in autostrada. In due giorni ha fatto 3 milioni di visualizzazioni, e il logo dell\'azienda si vede benissimo. Ti chiamano giornalisti, clienti e anche la Polstrada.',
  opts:[{t:'Richiamo ufficiale',d:'Lo convochi in ufficio e gli fai un richiamo scritto. Il video sparisce, ma in piazzale si mugugna.',e:'Reputazione −2, morale −2',r:'Il video è stato cancellato. L\'autista ha chiesto scusa, ma i suoi follower no.',f:()=>{S.rep-=2;mod('all',{mor:-2},20);}},
        {t:'Fallo testimonial aziendale',d:'Gli proponi di fare video per l\'azienda. Diventa famoso, ma continua a ballare dove non dovrebbe.',e:'Reputazione +4, ma il rischio resta',r:'L\'autista ora gira con il logo in bella vista. Ha già ricevuto due richieste di autografo in autogrill.',f:()=>{S.rep+=4; if(Math.random()<0.3){S.cash-=5000;toast('Multa della Polstrada: 5.000 €','bad');}}}]},
 {id:'buyer',src:'Il Sole 24 Pallet',title:'Cambio di buyer',cond:()=>S.clients.some(c=>c.status==='attivo'),
  text:'Il nuovo buyer arriva da una multinazionale e vuole "rivedere tutte le condizioni". Alla prima riunione ha detto "benchmark" quattro volte e "saving" sei. Vuole una risposta entro venerdì.',
  opts:[{t:'Concedi uno sconto del 3% per tre mesi',d:'Gli offri uno sconto del 3% per tre mesi. Lui annota tutto e sorride per la prima volta.',e:'Soddisfazione +6, −9% di una mensilità del cliente',r:'Il nuovo buyer ha accettato lo sconto con un sorriso. Sembra che si aspettasse proprio quello.',f:function(){this.c.sat=clamp(this.c.sat+6,0,100);S.cash-=Math.round(clientRev(this.c)*0.09);}},
        {t:'Difendi i prezzi',d:'Gli mostri cosa comprende la tariffa e non molli un euro. Lui scrive «da rivedere» sul suo blocco.',e:'Soddisfazione −8',r:'Il buyer ha preso nota e ha chiuso la cartellina. Non ha detto altro, che è peggio.',f:function(){this.c.sat=clamp(this.c.sat-8,0,100);}},
        {t:'Invitalo a pranzo',d:'Lo porti in trattoria e parli di tutto tranne che di prezzi. Al caffè ti dà del tu.',e:'Soddisfazione +4',req:()=>ceo().st.neg>=13,reqT:'Negoziazione 13',r:'Al pranzo il buyer ha parlato soprattutto di sé. Al caffè però vi davate già del tu.',f:function(){this.c.sat=clamp(this.c.sat+4,0,100);}}],
  setup:ev=>{ev.c=pick(S.clients.filter(c=>c.status==='attivo'));ev.title=`Cambio di buyer da ${ev.c.name}`;}},
 {id:'blackfriday',src:'Il Sole 24 Pallet',title:'Black Friday',cond:()=>yearOf(S.day)>=2015&&monthOf(S.day)===10,
  text:'È arrivato il Black Friday e i clienti hanno triplicato gli ordini per una settimana. Le baie sono piene, il WMS rallenta e i carrellisti saltano la pausa. Il magazzino scricchiola.',
  opts:[{t:'Interinali e turni extra',d:'Chiami gli interinali e allunghi i turni. Costa caro, ma la merce esce.',e:'−6.000 €, morale −2',r:'Gli interinali arrivano alle sei con il badge provvisorio. Alla fine della settimana sanno dove sono gli scaffali.',f:()=>{S.cash-=6000;mod('all',{mor:-2},10);}},
        {t:'Si fa quel che si può',d:'Lavori con la squadra che hai e accetti qualche ritardo e qualche errore.',e:'Puntualità −5, accuratezza −2 per 10 giorni',r:'Si lavora a testa bassa. Qualche pacco parte in ritardo, qualcuno parte nella scatola sbagliata.',f:()=>mod('all',{P:-5,A:-2},10)}]},
 {id:'fallimento',src:'Il Sole 24 Pallet',title:'Un cliente non paga',cond:()=>S.clients.some(c=>c.status==='attivo'),
  text:'Il cliente ha chiesto il concordato preventivo: in pratica non riesce a pagare i suoi debiti. Il suo avvocato ti offre il 40% dell\'ultima fattura, subito e senza discutere. Il tuo, di avvocato, dice che in tribunale potresti avere tutto o niente.',
  opts:[{t:'Accetta il 40% subito',d:'Accetti il 40% e chiudi la pratica. Meglio poco oggi che niente fra tre anni.',e:'Perdi il 60% di una mensilità',r:'Il curatore ha pagato il 40%. Meglio poco che niente, dice il commercialista.',f:function(){S.cash-=Math.round(clientRev(this.c)*0.6);}},
        {t:'Fai causa',d:'Affidi tutto all\'avvocato e vai in tribunale. Testa o croce, con le spese legali in palio.',e:'50%: recuperi tutto o perdi tutto più le spese',r:'La causa è partita. L\'avvocato dice che «ha buone sensazioni». Lo dice sempre.',f:function(){if(Math.random()<0.5)toast('Causa vinta: fattura recuperata','ok');else{S.cash-=Math.round(clientRev(this.c))+3000;toast('Causa persa','bad');}}}],
  setup:ev=>{ev.c=pick(S.clients.filter(c=>c.status==='attivo'));ev.title=`${ev.c.name} non paga una fattura`;}},
 {id:'klaus',src:'La Gazzetta del Muletto',title:'Pranzo con Klaus',cond:()=>true,
  text:'Klaus, direttore logistico di un grande gruppo tedesco, è a Milano per qualche giorno. Vuole pranzare con te per "capire come lavorano gli italiani" e forse, un giorno, affidarvi qualche carico. Ha precisato che ha solo un\'ora.',
  opts:[{t:'Ristorante stellato',d:'Prenoti un ristorante stellato in centro. Klaus apprezza e prende appunti anche sul vino.',e:'−1.200 €, reputazione +3',r:'Klaus ha mangiato tutto e si è lamentato delle porzioni. Però ha lasciato una buona recensione.',f:()=>{S.cash-=1200;S.rep+=3;}},
        {t:'Trattoria del camionista',d:'Lo porti nella trattoria dove mangiano i camionisti. O lo conquisti, o non lo rivedi più.',e:'50%: reputazione +5 o −2',r:'Klaus ha ordinato due piatti di pasta. Chi lo conosce dice che si è divertito, chi no non ne è sicuro.',f:()=>{S.rep+=Math.random()<0.5?5:-2;}}]},
 {id:'brambilla',src:'La Gazzetta del Muletto',title:'Lite col cavalier Brambilla',cond:()=>true,
  text:'Il cavalier Brambilla, il vicino di capannone, si è presentato in ufficio con delle foto. Sostiene che i tuoi camion, in manovra, gli rovinano l\'aiuola all\'ingresso. Se non fai qualcosa chiamerà il sindaco: giocano a bocce insieme.',
  opts:[{t:'Rifai l\'aiuola',d:'Fai rifare l\'aiuola da un giardiniere, con due rose in più. Brambilla torna a salutarti.',e:'−700 €',r:'L\'aiuola è come nuova. Il cavaliere passa ogni mattina a controllarla.',f:()=>{S.cash-=700;}},
        {t:'Ignoralo',d:'Gli rispondi che l\'aiuola è sul suolo comunale e torni al lavoro. Brambilla prende il telefono.',e:'30% di multa comunale da 4.000 €',r:'Il cavaliere ha telefonato in Comune tre volte. Al quarto giorno ha smesso. Forse.',f:()=>{if(Math.random()<0.3){S.cash-=4000;toast('Multa comunale: 4.000 €','bad');}}}]},
 {id:'duore',src:'Il Sole 24 Pallet',title:'Consegne in 2 ore',cond:()=>yearOf(S.day)>=2014,once:true,
  text:'I clienti hanno scoperto la consegna in due ore e ora la vogliono tutti, per tutto, sempre. Le piattaforme online la offrono gratis e i tuoi clienti chiedono perché tu no. La tua flotta, però, è fatta per i bilici, non per le corse in città.',
  opts:[{t:'Investi in furgoni elettrici',d:'Compri una piccola flotta di furgoni elettrici per le consegne veloci in città. Sui giornali ci finisci bene.',e:'−30.000 €, reputazione +4',r:'I furgoni elettrici arrivano a fine mese. Gli autisti li provano in piazzale come bambini.',f:()=>{S.cash-=30000;S.rep+=4;}},
        {t:'Spiega che non è il tuo mestiere',d:'Spieghi ai clienti che il tuo mestiere è un altro: bancali, non pacchetti. Qualcuno ti dà del vecchio.',e:'Reputazione −2',r:'Il cliente ha capito. Il giornale locale un po\' meno.',f:()=>{S.rep-=2;}}]},
 {id:'euro',src:'Il Sole 24 Pallet',title:'Arriva l\'euro',cond:()=>yearOf(S.day)===2002&&monthOf(S.day)<=3,once:true,
  text:'Dal primo gennaio c\'è l\'euro, ma in amministrazione convertono ancora tutto in lire con la calcolatrice. Due fatture sono uscite con un importo mille volte più alto. Un cliente ha chiamato ridendo, l\'altro no.',
  opts:[{t:'Corso di formazione',d:'Paghi un corso di mezza giornata e regali a tutti la calcolatrice convertitrice. Gli errori finiscono.',e:'−1.000 €',r:'Dopo il corso tutti sanno che mille lire sono 52 centesimi. Il caffè costa ancora una lira, per abitudine.',f:()=>{S.cash-=1000;}},
        {t:'"Si abitueranno"',d:'Lasci tempo al tempo. Per un paio di mesi le fatture vanno ricontrollate a mano.',e:'Accuratezza −1 per 60 giorni',r:'In magazzino si parla ancora in lire. Ogni tanto un conto torna sbagliato.',f:()=>mod('all',{A:-1},60)}]},
 {id:'expo',src:'Il Sole 24 Pallet',title:'Expo Milano 2015',cond:()=>yearOf(S.day)===2015&&monthOf(S.day)>=3&&monthOf(S.day)<=9,once:true,
  text:'Milano ospita l\'Expo: sei mesi di padiglioni, ristoranti e mostre da rifornire ogni giorno. Gli organizzatori cercano trasportatori affidabili, disposti a lavorare con orari e permessi complicati. È un\'occasione rara, ma impegnativa.',
  opts:[{t:'Candidati come fornitore',d:'Presenti la candidatura e ottieni un lotto di consegne. Entrano soldi, ma la squadra è tirata.',e:'+40.000 €, puntualità −2 per 60 giorni',r:'Il contratto è firmato. I camion girano attorno al cantiere di Rho più che sulle strade dei clienti.',f:()=>{S.cash+=40000;mod('all',{P:-2},60);}},
        {t:'Lascia perdere',d:'Resti sui tuoi clienti di sempre. L\'Expo lo guarderai in TV.',e:'Nessun effetto',r:'Expo andrà avanti anche senza di voi. Il traffico in tangenziale, intanto, peggiora.',f:()=>{}}]},
 {id:'pandemia',src:'Il Mattinale del Ministero',title:'Lockdown nazionale',cond:()=>yearOf(S.day)===2020&&monthOf(S.day)>=2,once:true,
  text:'Il paese si ferma per il lockdown, ma la logistica no: senza camion i supermercati restano vuoti. Le mascherine sono introvabili, gli autisti hanno paura e le famiglie chiamano preoccupate. Tutti aspettano di capire cosa farai.',
  opts:[{t:'Protocolli, DPI e premio per chi lavora',d:'Compri mascherine e gel a qualunque prezzo, scrivi i protocolli e dai un premio a chi lavora. Tutti si sentono protetti.',e:'−20.000 €, morale +6, reputazione +5',r:'Mascherine, gel e turni sfalsati. Il magazzino resta aperto e nessuno si sente lasciato solo.',f:()=>{S.cash-=20000;mod('all',{mor:6},90);S.rep+=5;}},
        {t:'Avanti con quello che c\'è',d:'Si va avanti con quello che c\'è. I turni si svuotano e chi resta lavora con la paura addosso.',e:'Morale −8, puntualità −4 per 90 giorni',r:'Si lavora con quello che c\'è. Ogni mattina qualcuno non si presenta e nessuno sa bene perché.',f:()=>mod('all',{mor:-8,P:-4},90)}]},
 {id:'gasolio22',src:'Il Sole 24 Pallet',title:'Caro gasolio',cond:()=>yearOf(S.day)===2022,once:true,
  text:'Il gasolio ha superato i 2 euro al litro e un pieno di un bilico costa come una vacanza. I contratti prevedono una clausola di adeguamento, ma i clienti non vogliono sentirne parlare. Il commercialista ti chiede come vuoi coprire la differenza.',
  opts:[{t:'Assorbi il costo',d:'Ti fai carico della differenza senza dire niente ai clienti. Il conto in banca se ne accorge.',e:'−15.000 €',r:'Paghi tu il pieno. Il commercialista guarda il bilancio e sospira.',f:()=>{S.cash-=15000;}},
        {t:'Applica la clausola gasolio',d:'Applichi la clausola a tutti. Sulla carta hai ragione, ma i clienti la prendono male.',e:'Soddisfazione di tutti i clienti −5',r:'La clausola è valida, i clienti lo sanno. Ma nessuno di loro l\'ha presa bene.',f:()=>S.clients.forEach(c=>{if(c.status==='attivo')c.sat=clamp(c.sat-5,0,100);})}]},
 {id:'stagista',src:'La Gazzetta del Muletto',title:'Lo stagista ha cancellato il database',cond:()=>true,
  text:'Lo stagista voleva solo "fare un po\' di pulizia" nel gestionale. Ha cancellato l\'intera anagrafica degli articoli e l\'ultimo backup è di tre settimane fa. Adesso è chiuso in bagno da mezz\'ora.',
  opts:[{t:'Ripristina il backup e reinserisci a mano',d:'Ripristini il backup e l\'ufficio reinserisce a mano gli articoli nuovi. Per due settimane qualche codice salta.',e:'Accuratezza −2 per 15 giorni',r:'Il backup è di due giorni fa. Il magazzino passa la settimana a ricontare i pallet.',f:()=>mod('all',{A:-2},15)},
        {t:'Chiama il tecnico esterno',d:'Chiami un tecnico informatico che recupera i dati dal disco. Costa, ma non si perde nulla.',e:'−4.000 €',r:'Il tecnico ha recuperato quasi tutto in un pomeriggio. Lo stagista è passato all\'ufficio fotocopie.',f:()=>{S.cash-=4000;}},
        {t:'"Ci penso io"',d:'Ti siedi alla tastiera, apri i log del database e alle 4 del mattino è tutto a posto.',e:'Tutto recuperato in una notte',req:()=>ceo().st.inn>=13,reqT:'Innovazione 13',r:'Hai lavorato tutta la notte con il caffè della macchinetta. All\'alba i dati erano tutti al loro posto.',f:()=>{}}]},
 {id:'muletto',src:'La Gazzetta del Muletto',title:'Muletto contro scaffale',cond:()=>true,
  text:'Un carrellista ha preso male una curva e una campata di scaffali è venuta giù come un domino. Per fortuna nessuno si è fatto male, ma 40 pallet sono a terra e un corridoio è bloccato. Il carrellista è seduto su un bancale, bianco in faccia.',
  opts:[{t:'Ripara subito',d:'Chiami subito la ditta delle scaffalature per rimettere tutto in sicurezza.',e:'−7.000 €',r:'Lo scaffale è riparato in giornata. Il carrellista guida per una settimana molto, molto piano.',f:()=>{S.cash-=7000;}},
        {t:'Transenna e lavora intorno',d:'Metti le transenne e si lavora intorno al corridoio bloccato. Si va più piano e si sbaglia di più.',e:'Accuratezza −2, puntualità −2 per 20 giorni',r:'Il magazzino lavora attorno alle transenne. Fare il giro lungo, alla fine, diventa un\'abitudine.',f:()=>mod('all',{A:-2,P:-2},20)}],
  setup:ev=>{if(S.warehouses.some(w=>w.tech.anticoll)){ev.text='Un carrellista ha preso male una curva, ma il sensore anti-collisione ha frenato il muletto a dieci centimetri dallo scaffale. Nessun danno, solo un grande spavento. Il carrellista, ancora pallido, vuole offrire da bere al tecnico che l\'ha installato.';ev.opts=[{t:'Brindisi!',d:'A fine turno offri da bere a tutta la squadra, tecnico compreso. Il sensore si è ripagato in un colpo.',e:'Morale +2',r:'Il carrellista ha offerto il prosecco a tutti. Il tecnico del sensore è diventato un piccolo eroe.',f:()=>mod('all',{mor:2},20)}];}}},
 {id:'pizza',src:'La Gazzetta del Muletto',title:'Pizza per il turno di notte',cond:()=>!hasTal('Mano larga'),
  text:'Il turno di notte ti ha lasciato una lettera firmata da tutti. Chiedono una pizza il venerdì, "come fanno da Brambilla", il vicino di capannone. Sembra poco, ma lo chiedono con molta serietà.',
  opts:[{t:'Pizza per tutti',d:'Ogni venerdì alle 2 di notte arrivano le pizze in banchina. Il turno di notte ti adotta.',e:'−800 € (due mesi di pizze), morale +3 per 2 mesi',r:'Le pizze arrivano ogni notte alle due. Il turno di notte ora ha un motivo in più per esserci.',f:()=>{S.cash-=800;mod('all',{mor:3},60);}},
        {t:'"Non siamo da Brambilla"',d:'Rispondi che ognuno ha il suo stile. Il turno di notte se lo segna.',e:'Morale −2',r:'Il turno di notte mangia panini dal distributore. E ogni tanto guarda la sede con aria offesa.',f:()=>mod('all',{mor:-2},30)}]},
 {id:'telepass',src:'Radio Traffico Nord',title:'Telepass in tilt',cond:()=>true,
  text:'Un guasto al sistema del Telepass ha bloccato i caselli della tangenziale di Milano. Le code sono di chilometri e la radio consiglia di "evitare la zona" per tutto il pomeriggio. I tuoi camion sono già in fila.',
  opts:[{t:'Pazienza',d:'Lasci i camion in coda e avvisi i clienti del ritardo.',e:'Puntualità −3 per 2 giorni',r:'I camion fanno la fila al casello come tutti. Gli autisti scoprono come si paga in contanti.',f:()=>mod('all',{P:-3},2)},
        {t:'Strade provinciali',d:'Fai uscire i camion e li mandi per le provinciali. Più km, ma si arriva.',e:'−600 € di gasolio',r:'I camion girano per le provinciali. Gli autisti scoprono paesi che non conoscevano.',f:()=>{S.cash-=600;}}]},
 {id:'cesto',src:'La Gazzetta del Muletto',title:'Il cesto natalizio',cond:()=>monthOf(S.day)===11,
  text:'Si avvicina Natale e in ufficio si discute del cesto per i dipendenti. C\'è chi propone il panettone artigianale con salumi e vino buono, e chi ricorda che "la solita bottiglia di spumante va benissimo". Tutti aspettano la tua decisione.',
  opts:[{t:'Cesto ricco',d:'Scegli il cesto ricco, con panettone artigianale e una bottiglia di Barbera. In magazzino si fanno le foto.',e:'−2.500 €, morale +4',r:'Il cesto ha il panettone, il salame e una bottiglia buona. In magazzino non si parla d\'altro.',f:()=>{S.cash-=2500;mod('all',{mor:4},45);}},
        {t:'Spumante e auguri',d:'Spumante, auguri e una stretta di mano a tutti. Nessuno si lamenta, nessuno si entusiasma.',e:'−300 €',r:'Spumante e auguri. Qualcuno guarda il cesto dell\'anno scorso nelle foto.',f:()=>{S.cash-=300;}}]},
 {id:'coop_sciopero',src:'La Gazzetta del Muletto',title:'Sciopero dei facchini',cond:()=>S.warehouses.some(w=>w.coop),
  setup:ev=>{const w=S.warehouses.find(w=>w.coop);ev.wh=w.id;ev.text=`A ${w.name} i facchini della cooperativa hanno bloccato il cancello con un presidio. Chiedono il contratto nazionale della logistica, non quello «multiservizi» che la cooperativa applica da anni. Il sindacalista è già in diretta su una TV locale e i camion non entrano.`;},
  text:'',
  opts:[{t:'Paga l\'adeguamento',d:'Paghi tu l\'adeguamento dei contratti. Il presidio si scioglie in un\'ora.',e:'−6.000 € una tantum, morale +4',r:'Il presidio è finito in giornata. I facchini tornano al lavoro e ti salutano per nome.',f:function(){S.cash-=6000;mod('all',{mor:4},60);}},
        {t:'Aspetta che passi',d:'Non tratti: la cooperativa non è affar tuo. Il cancello resta bloccato per giorni.',e:'Puntualità −10 e morale −5 per 10 giorni in quel magazzino',r:'Il presidio dura giorni. I camion aspettano fuori e i clienti chiamano ogni ora.',f:()=>{const w=S.warehouses.find(w=>w.coop);mod(w.id,{P:-10,mor:-5},10);}},
        {t:'Tavolo con sindacato e cooperativa',d:'Metti allo stesso tavolo sindacato e cooperativa e non li fai alzare finché non firmano.',e:'Puntualità −3 per 5 giorni, nessun costo',req:()=>ceo().st.lead>=13,reqT:'Leadership 13',r:'Al tavolo si parla per ore. Alla fine si firma, e qualcuno porta le paste.',f:()=>{const w=S.warehouses.find(w=>w.coop);mod(w.id,{P:-3},5);}}]},
 {id:'coop_ispettorato',src:'Il Sole 24 Pallet',title:'L\'Ispettorato del lavoro in banchina',cond:()=>S.warehouses.some(w=>w.coop),
  text:'Due ispettori del lavoro sono in banchina e controllano i facchini della cooperativa: buste paga, turni, straordinari mai pagati. Il presidente della cooperativa non risponde al telefono da stamattina. Per legge, se mancano dei soldi, li deve mettere chi ha dato l\'appalto: tu.',
  opts:[{t:'Paga la sanzione in solido',d:'Paghi la sanzione e chiudi la faccenda. La notizia, però, gira tra i clienti.',e:'−15.000 €, reputazione −3',r:'La sanzione è pagata. Il giornale locale scrive comunque il nome della tua azienda nel titolo.',f:()=>{S.cash-=15000;S.rep=clamp(S.rep-3,0,100);}},
        {t:'Assumi direttamente i facchini',d:'Assumi i facchini direttamente in azienda. Costa, ma da oggi rispondi tu di loro, e loro lo apprezzano.',e:'Fine della cooperativa in quel magazzino, 600 € a persona, morale +5',r:'I facchini firmano il contratto con te. Uno ha portato la moglie a vedere la firma.',f:()=>{const w=S.warehouses.find(w=>w.coop);const c=600*(w.staff.pick+w.staff.car);w.coop=false;S.cash-=c;mod(w.id,{mor:5},60);}},
        {t:'"Abbiamo verificato tutto noi"',d:'Mostri agli ispettori i controlli che fai ogni mese sulla cooperativa. Non trovano niente da contestarti.',e:'Nessuna multa',req:()=>ceo().st.amm>=13,reqT:'Amministrazione 13',r:'L\'ispettore ha controllato i tuoi registri e non ha trovato niente. Ha chiesto chi te li tiene così bene.',f:()=>{}}]},
 {id:'coop_sparita',src:'La Gazzetta del Muletto',title:'La cooperativa è sparita',cond:()=>S.warehouses.some(w=>w.coop&&w.staff.pick+w.staff.car>=4),
  text:'Stanotte la cooperativa ha chiuso: partita IVA cessata, sede legale in un garage di Rozzano, telefoni muti. Metà dei facchini non si è presentata, l\'altra metà è in banchina e chiede chi li pagherà. I camion da caricare, intanto, arrivano.',
  opts:[{t:'Trova un\'altra cooperativa',d:'Chiami un\'altra cooperativa che manda subito gente. Una parte dei facchini, però, non torna più.',e:'−5.000 €, perdi un quarto dei facchini, morale −5',r:'La nuova cooperativa arriva in tre giorni. Non tutti i facchini si fidano a cambiare.',f:()=>{const w=S.warehouses.find(w=>w.coop&&w.staff.pick+w.staff.car>=4);S.cash-=5000;w.staff.pick-=Math.floor(w.staff.pick/4);w.staff.car-=Math.floor(w.staff.car/4);mod(w.id,{mor:-5},30);}},
        {t:'Assumili tutti tu',d:'Assumi tutti i facchini rimasti con un contratto vero. Ti costa, ma ti seguirebbero ovunque.',e:'Fine della cooperativa, 600 € a persona, morale +8',r:'I facchini ora sono tuoi dipendenti. Il primo cedolino lo leggono due volte.',f:()=>{const w=S.warehouses.find(w=>w.coop&&w.staff.pick+w.staff.car>=4);const c=600*(w.staff.pick+w.staff.car);w.coop=false;S.cash-=c;mod(w.id,{mor:8},60);}}]},
 {id:'concorrente',src:'Il Sole 24 Pallet',title:'Un concorrente ruba un autista',cond:()=>S.warehouses.some(w=>w.staff.autCE>=2),
  text:'Il tuo autista migliore ti confida che un concorrente gli ha offerto 200 € in più al mese. Ha quindici anni di patente CE e non ha mai graffiato un camion. Dice che gli dispiace, ma ha un mutuo.',
  opts:[{t:'Pareggia l\'offerta',d:'Gli alzi lo stipendio e pareggi l\'offerta. Lui resta, e gli altri lo vengono a sapere.',e:'−2.400 € e morale +2',r:'L\'autista resta. Il concorrente ti manda i saluti, per niente sinceri.',f:()=>{S.cash-=2400;mod('all',{mor:2},30);}},
        {t:'Lascialo andare',d:'Gli stringi la mano e gli auguri buona fortuna. Tocca cercare un altro autista.',e:'Perdi un autista con patente CE',r:'L\'autista se ne va con un bilico più nuovo del tuo. Ha lasciato le chiavi e un panino nel cassetto.',f:()=>{const w=S.warehouses.find(w=>w.staff.autCE>=2);w.staff.autCE--;}}]},
 {id:'olimpiadi',src:'Il Sole 24 Pallet',title:'Olimpiadi invernali di Torino',cond:()=>yearOf(S.day)===2006&&monthOf(S.day)<=1,once:true,
  text:'Torino ospita le Olimpiadi invernali e la città è un cantiere a cielo aperto. Impianti, villaggi degli atleti e sponsor cercano trasporti e pagano bene chi garantisce le consegne. Le strade, però, sono piene di transenne.',
  opts:[{t:'Noleggia tre camion extra per i Giochi',d:'Noleggi tre camion in più e ti metti a disposizione dei Giochi. Lavoro extra, e il tuo logo finisce in qualche foto.',e:'+18.000 €, puntualità −2 per un mese, reputazione +3',r:'I camion extra girano tra Torino e le valli. Il commerciale ha messo la foto del pass sul profilo.',f:()=>{S.cash+=18000;mod('all',{P:-2},30);S.rep+=3;}},
        {t:'Resta concentrato sui clienti',d:'Lasci le Olimpiadi ad altri e resti sui clienti di sempre.',e:'Nessun effetto',r:'Le Olimpiadi passano in TV. Il magazzino lavora come sempre.',f:()=>{}}]},
 {id:'crisi',src:'Il Sole 24 Pallet',title:'Crisi finanziaria',cond:()=>yearOf(S.day)===2008&&monthOf(S.day)>=8,once:true,
  text:'Una grande banca americana è fallita e la crisi è arrivata anche in Italia. Le banche non concedono più fidi, i clienti riducono gli ordini e pagano sempre più tardi. Il commercialista ti consiglia di tagliare.',
  opts:[{t:'Taglia i costi',d:'Riduci i costi e non rinnovi i contratti in scadenza. In cassa respiri, ma in paese se ne parla.',e:'Reputazione −6, cassa +15.000 €',r:'I tagli arrivano. In giro si dice che la tua azienda non se la passa bene.',f:()=>{S.rep-=6;S.cash+=15000;}},
        {t:'Resisti senza licenziare',d:'Tieni tutti al loro posto e intacchi le riserve. La squadra non lo dimenticherà.',e:'Cassa −20.000 €, reputazione +5, morale +5',r:'Nessuno perde il posto. In magazzino lo sanno tutti, e lo ricorderanno.',f:()=>{S.cash-=20000;S.rep+=5;mod('all',{mor:5},90);}}]},
 /* --- eventi legati ai talenti del CEO: compaiono solo se il CEO ha quel talento --- */
 {id:'t_scenata',src:'La Gazzetta del Muletto',title:'Scenata in ufficio',cond:()=>hasTal('Stacanovista'),
  setup:ev=>{ev.chi=pick(['la moglie del capoturno','il marito dell\'impiegata del traffico','la moglie di un carrellista','il marito della pianificatrice']);
    ev.text=`Alle 19:40 ${ev.chi} entra in ufficio con la cena in un contenitore di plastica: "Se deve vivere qui, almeno che mangi!". Da tre settimane nessuno esce prima delle otto, perché tu non esci mai. Tutto il turno guarda te.`;},
  opts:[{t:'Chiedi scusa: per un mese si esce alle 18',d:'Chiedi scusa davanti a tutti e per un mese si stacca alle 18, tu compreso. Il lavoro rallenta, l\'aria migliora.',e:'Puntualità −3 per 30 giorni, morale +6',r:'Per un mese si esce alle 18. La sera trovi ancora la luce accesa solo nel tuo ufficio.',f:()=>mod('all',{P:-3,mor:6},30)},
        {t:'"Qui si lavora, gentilmente"',d:'Rispondi che l\'ufficio non è una mensa. Il turno torna a lavorare in silenzio.',e:'Morale −8 per 2 mesi, reputazione −2',r:'In ufficio cala il silenzio. Il giorno dopo nessuno ti offre il caffè.',f:()=>{mod('all',{mor:-8},60);S.rep-=2;}},
        {t:'Offri una cena a tutte le famiglie',d:'Prenoti una pizzeria e inviti tutte le famiglie. Alla fine brinda con te anche chi era venuto a protestare.',e:'−1.500 €, morale +5',req:()=>ceo().st.lead>=12,reqT:'Leadership 12',r:'La cena va bene. Alla fine anche la persona della scenata ride e ti stringe la mano.',f:()=>{S.cash-=1500;mod('all',{mor:5},60);}}]},
 {id:'t_papa',src:'La Gazzetta del Muletto',title:'Papà ha venduto un camion',cond:()=>hasTal('Papà ha sempre ragione')&&S.warehouses[0].motrici>1,
  text:'Il fondatore, tuo padre, ha venduto una motrice a un amico del bar, "a un prezzo d\'affezione". Sul conto sono arrivati 4.000 €, ma il camion ne valeva 25.000. Lui è convinto di aver fatto un affare e lo racconta a tutti.',
  opts:[{t:'Lascia stare, è papà',d:'Lasci correre: è papà, e l\'azienda l\'ha fondata lui.',e:'+4.000 €, una motrice in meno',r:'Il camion è venduto. Papà dice che era il momento giusto, lui se ne intende.',f:()=>{S.cash+=4000;S.warehouses[0].motrici--;}},
        {t:'Annulla la vendita',d:'Chiami l\'amico e annulli la vendita. Al bar non ti salutano più.',e:'Al bar ti tolgono il saluto: reputazione −2',r:'Il camion torna nel piazzale. Papà non ti parla per qualche giorno e al bar ti guardano male.',f:()=>{S.rep-=2;}},
        {t:'Rinegozia con l\'amico del bar',d:'Vai al bar, offri un caffè all\'amico e gli fai capire quanto vale davvero quel camion.',e:'+15.000 €, una motrice in meno',req:()=>ceo().st.neg>=12,reqT:'Negoziazione 12',r:'L\'amico del bar paga di più, borbottando. Papà dice che gli hai rovinato una bella amicizia.',f:()=>{S.cash+=15000;S.warehouses[0].motrici--;}}]},
 {id:'t_derby',src:'La Gazzetta del Muletto',title:'Domenica c\'è il derby',cond:()=>hasTal('Tifo sfegatato'),
  text:'Domenica c\'è il derby e la città non parla d\'altro. Metà del magazzino ha chiesto il turno libero, l\'altra metà guarderà la partita di nascosto sul telefono. Tu hai la sciarpa al collo da venerdì.',
  opts:[{t:'Maxischermo in mensa per tutti',d:'Monti un maxischermo in mensa e la partita si guarda tutti insieme. Per un paio di giorni si lavora con la testa altrove.',e:'−800 €, morale +6, puntualità −3 per 2 giorni',r:'Il maxischermo in mensa fa il pienone. Il giorno dopo metà squadra è senza voce.',f:()=>{S.cash-=800;mod('all',{mor:6},30);mod('all',{P:-3},2);}},
        {t:'Turno normale, telefoni negli armadietti',d:'Turno normale e telefoni chiusi negli armadietti. Il tuo compreso, con grande sofferenza.',e:'Morale −5 per 15 giorni',r:'I telefoni restano negli armadietti. Il risultato si scopre comunque, a fine turno, dalle urla.',f:()=>mod('all',{mor:-5},15)},
        {t:'Sfida di calcetto tra i turni prima della partita',d:'Organizzi un torneo di calcetto tra i turni prima della partita. Tutti arrivano al fischio d\'inizio sudati e contenti.',e:'Morale +4',req:()=>ceo().st.lead>=13,reqT:'Leadership 13',r:'La partita di calcetto finisce prima del derby. Nessuno si ricorda chi ha vinto.',f:()=>mod('all',{mor:4},30)}]},
 {id:'t_dialetto',src:'Ufficio commerciale',title:'Problemi di traduzione',cond:()=>hasTal('Dialetto stretto')&&actC(),
  setup:ev=>{ev.c=actC();ev.text=`In videochiamata con la sede estera di ${ev.c.name} hai detto "va bin, a l'è tut a post". I sottotitoli automatici hanno scritto "il magazzino è in fiamme". Ora ti chiamano dall'ufficio sicurezza.`;},
  opts:[{t:'Spiega tutto con una mail in inglese',d:'Scrivi una mail lunga e precisa in inglese. Si chiarisce tutto, ma resta un po\' di imbarazzo.',e:'Soddisfazione −3',r:'Il cliente risponde con una mail di tre righe in inglese. Formale, ma un po\' freddo.',f:function(){this.c.sat=clamp(this.c.sat-3,0,100);}},
        {t:'Invitali a cena nelle Langhe',d:'Inviti i loro dirigenti a cena nelle Langhe. Dopo il secondo bicchiere il dialetto lo parlano anche loro.',e:'−1.200 €, soddisfazione +8',r:'La cena nelle Langhe va lunga. Alla fine il cliente parla piemontese meglio di te.',f:function(){S.cash-=1200;this.c.sat=clamp(this.c.sat+8,0,100);}}]},
 {id:'t_insonne',src:'Posta elettronica',title:'Mail alle 3:47',cond:()=>hasTal('Insonne'),
  text:'Stanotte non dormivi e hai mandato quattordici mail tra le 2 e le 5. Una è finita al cliente sbagliato, con il listino di un altro cliente in allegato. Te ne sei accorto alle 7, quando hanno risposto.',
  opts:[{t:'Chiedi scusa a tutti',d:'Mandi una mail di scuse a tutti i destinatari. Fa ridere qualcuno e preoccupa altri.',e:'Reputazione −2',r:'Hai scritto a tutti che ti dispiace. Qualcuno risponde, alle 3 di notte.',f:()=>{S.rep-=2;}},
        {t:'"Era un test di trasparenza"',d:'Rispondi che era un esperimento di trasparenza sui prezzi. Il cliente non sa se crederci, ma ti stima.',e:'Reputazione +1',req:()=>ceo().st.neg>=13,reqT:'Negoziazione 13',r:'Nessuno ci crede davvero, ma la frase è piaciuta. Gira già sulle chat dei colleghi.',f:()=>{S.rep+=1;}},
        {t:'Telefono spento dopo le 22, da oggi',d:'Da oggi il telefono si spegne alle 22. Le mail aspettano il mattino, e anche tu ne guadagni.',e:'Puntualità −1 per 15 giorni, morale +3',r:'Il telefono si spegne alle 22. Il sonno migliora, le mail del mattino un po\' meno.',f:()=>mod('all',{P:-1,mor:3},15)}]},
 {id:'t_militare',src:'La Gazzetta del Muletto',title:'L\'appello delle 6:00',cond:()=>hasTal('Ha fatto il militare'),
  text:'Da un mese hai introdotto l\'appello a inizio turno, con tanto di "Presente!" e righe dritte in banchina. I ventenni del turno di notte ne hanno fatto un video con la musica di un film di guerra. Lo hanno visto anche in Regione.',
  opts:[{t:'Smetti subito',d:'Abolisci l\'appello e ci ridi su insieme a loro.',e:'Morale +2',r:'Niente più appello. Il primo giorno qualcuno si mette in fila lo stesso, per abitudine.',f:()=>mod('all',{mor:2},30)},
        {t:'Insisti: disciplina',d:'Tieni l\'appello: si arriva puntuali e lo sanno tutti. Ma l\'umore cala.',e:'Puntualità +3 e morale −6 per un mese',r:'L\'appello continua. I magazzinieri arrivano puntuali, ma con la faccia lunga.',f:()=>mod('all',{P:3,mor:-6},30)},
        {t:'Trasformalo in un rito con caffè e brioche',d:'Trasformi l\'appello in una colazione con caffè e brioche. Diventa il momento più atteso del turno.',e:'−400 €, morale +5, reputazione +2',req:()=>ceo().st.lead>=14,reqT:'Leadership 14',r:'Alle 6 c\'è il caffè con la brioche. L\'appello è diventato il momento più bello della giornata.',f:()=>{S.cash-=400;mod('all',{mor:5},60);S.rep+=2;}}]},
 {id:'t_ombrellone',src:'Radio Traffico Nord',title:'Ferie a Varazze',cond:()=>hasTal('Sempre al telefono')&&monthOf(S.day)===7,
  text:'Sei in ferie a Varazze da un\'ora e hai già fatto undici telefonate dall\'ombrellone. Tuo figlio, stanco di aspettare, ha seppellito il telefono sotto la sabbia, vicino alla torretta del bagnino. Ora ti guarda e aspetta.',
  opts:[{t:'Lascialo lì: ferie vere',d:'Lasci il telefono dove sta e ti fai un bagno. In azienda se la cavano, più o meno.',e:'Puntualità −2 per 7 giorni',r:'L\'ombrellone resta lì. Il magazzino se la cava, più o meno, anche senza di te.',f:()=>mod('all',{P:-2},7)},
        {t:'Scava',d:'Scavi a mani nude davanti a tutta la spiaggia. Il lavoro è salvo, il rapporto con tuo figlio un po\' meno.',e:'Nessun effetto sul lavoro. Tuo figlio non ti parla per una settimana',r:'Hai scavato fino a sera. Hai trovato solo una paletta rossa, e tuo figlio non ti parla.',f:()=>{}}]},
 {id:'t_pizza',src:'La Gazzetta del Muletto',title:'La pizza del venerdì',cond:()=>hasTal('Mano larga'),
  text:'Mesi fa hai promesso la pizza al turno di notte ogni venerdì, e la promessa l\'hai mantenuta. Il pizzaiolo ora ti manda gli auguri a Natale. Insieme agli auguri è arrivata una fattura da 2.400 €.',
  opts:[{t:'Paga e continua',d:'Paghi e ordini anche per questo venerdì. Il turno di notte ti voterebbe sindaco.',e:'−2.400 €, morale +5 per 2 mesi',r:'La pizza del venerdì resta. È la riunione più seguita della settimana.',f:()=>{S.cash-=2400;mod('all',{mor:5},60);}},
        {t:'Basta pizza',d:'Annunci che la pizza del venerdì finisce qui. In banchina cala il gelo.',e:'Morale −6 per un mese',r:'Il venerdì ora c\'è un pacco di cracker sul tavolo. Nessuno li apre.',f:()=>mod('all',{mor:-6},30)}]},
 {id:'t_carta',src:'La Gazzetta del Muletto',title:'La rivolta della carta igienica',cond:()=>hasTal('Braccino corto'),
  text:'Per risparmiare hai fatto comprare la carta igienica del discount. Stamattina la RSU ha appeso un cartello in bagno: "Qui si risparmia anche sulla dignità". Accanto, come prova, un rotolo sottile come la carta velina.',
  opts:[{t:'Torna alla carta di prima',d:'Torni alla carta di prima e la RSU toglie il cartello.',e:'−300 €, morale +3',r:'La carta morbida è tornata. Qualcuno ha attaccato un biglietto di ringraziamento sul distributore.',f:()=>{S.cash-=300;mod('all',{mor:3},30);}},
        {t:'Tieni duro: ogni centesimo conta',d:'Fai togliere il cartello e la carta resta quella. Ogni centesimo conta, ma lo pensi solo tu.',e:'+300 €, morale −5',r:'La carta resta quella ruvida. Sui muri del bagno compaiono i primi commenti.',f:()=>{S.cash+=300;mod('all',{mor:-5},30);}}]},
 {id:'t_treno',src:'Radio Traffico Nord',title:'Regionale soppresso',cond:()=>hasTal('Pendolare della Torino-Milano'),
  text:'Il regionale delle 6:42 per Milano è soppresso. Il successivo è "in ritardo di 90 minuti, ci scusiamo per il disagio". Alle 8 hai una riunione importante con un cliente e sei ancora sul binario.',
  opts:[{t:'Taxi fino in ufficio',d:'Prendi un taxi e arrivi giusto in tempo, un po\' spettinato.',e:'−180 €',r:'Il taxi ti porta in ufficio giusto in tempo. Il tassista ti racconta tutta la sua vita.',f:()=>{S.cash-=180;}},
        {t:'Fai la riunione dal binario',d:'Fai la riunione al telefono, tra un annuncio e l\'altro. Il cliente sente più treni che numeri.',e:'Puntualità −2 per 3 giorni',r:'La riunione si fa dal binario, tra un annuncio e l\'altro. Metà delle decisioni non si sono sentite.',f:()=>mod('all',{P:-2},3)},
        {t:'Organizza un furgone condiviso con i colleghi pendolari',d:'Organizzi un furgone aziendale per te e i colleghi pendolari. Da oggi si viaggia insieme e si arriva puntuali.',e:'Morale +3 per 2 mesi',req:()=>ceo().st.op>=12,reqT:'Operazioni 12',r:'Il furgone condiviso parte ogni mattina alle sette. Ormai è un piccolo club.',f:()=>mod('all',{mor:3},60)}]},
 {id:'t_grigliata',src:'La Gazzetta del Muletto',title:'Grigliata aziendale',cond:()=>hasTal('Vegano convinto')&&[5,6,7,8].includes(monthOf(S.day)),
  text:'Il comitato del personale ha organizzato la grigliata di fine turno nel piazzale. Ci sono tre quintali di salamelle, costine e un unico panetto di tofu: il tuo. Tutti aspettano di vedere cosa fai.',
  opts:[{t:'Partecipa con il tuo tofu',d:'Grigli il tuo tofu accanto alle salamelle e ridi con tutti delle battute.',e:'Morale +3',r:'Il tofu non lo assaggia nessuno, ma tutti apprezzano che sei venuto.',f:()=>mod('all',{mor:3},30)},
        {t:'Proponi una grigliata solo di verdure',d:'Proponi di rifarla l\'anno prossimo solo con le verdure. Il giornale locale ti loda, il piazzale no.',e:'Morale −5, reputazione +1 sul giornale locale',r:'La grigliata di verdure finisce sul giornale locale. Gli autisti, invece, sono andati in trattoria.',f:()=>{mod('all',{mor:-5},30);S.rep+=1;}}]},
 {id:'t_multe',src:'Il Mattinale del Ministero',title:'Patente sospesa',cond:()=>hasTal('Collezionista di multe'),
  text:'L\'autovelox della tangenziale di Novara ti ha fotografato per la quarta volta in un mese. Oggi è arrivata la lettera: patente sospesa per sessanta giorni. E hai appuntamenti con clienti in tutto il Nord-Ovest.',
  opts:[{t:'Fatti accompagnare da un autista',d:'Ti fai accompagnare da un autista ai tuoi appuntamenti. Lui, però, manca alle consegne.',e:'Puntualità −2 per 60 giorni: un autista in meno sulle consegne',r:'L\'autista ti fa da autista. Parla poco e guida benissimo.',f:()=>mod('all',{P:-2},60)},
        {t:'Ricorso dall\'avvocato',d:'Ti affidi a un avvocato specializzato in multe. Ha un sito pieno di recensioni entusiaste.',e:'−1.500 €; una volta su due va bene',r:'L\'avvocato presenta il ricorso. Dice che i tempi sono lunghi, ma che ci sono speranze.',f:()=>{S.cash-=1500;if(Math.random()<0.5)toast('Ricorso accolto: patente restituita','ok');else{mod('all',{P:-2},60);toast('Ricorso respinto','bad');}}}]},
 {id:'t_karaoke',src:'Ufficio commerciale',title:'Serata karaoke con il cliente',cond:()=>hasTal('Re del karaoke')&&actC(),
  setup:ev=>{ev.c=actC();ev.text=`Il buyer di ${ev.c.name} ha prenotato un karaoke a Lodi per la cena di fine anno. Ti guarda e ti porge il microfono.`;},
  opts:[{t:'Duetto su "Azzurro"',d:'Prendi il microfono e attacchi "Azzurro" insieme a lui. Il locale canta con voi, se non sbagli la strofa.',e:'Soddisfazione +10, con un piccolo rischio di figuraccia',r:'«Azzurro» a due voci. Il cliente canta a squarciagola, tu fai del tuo meglio.',f:function(){if(Math.random()<0.8)this.c.sat=clamp(this.c.sat+10,0,100);else{this.c.sat=clamp(this.c.sat-4,0,100);toast('Hai sbagliato la strofa. Due volte.','warn');}}},
        {t:'Lascia cantare lui',d:'Gli lasci la scena e applaudi con convinzione.',e:'Soddisfazione +4',r:'Il cliente canta tre canzoni di fila. Tu applaudi come se fosse la finale di Sanremo.',f:function(){this.c.sat=clamp(this.c.sat+4,0,100);}}]},
 {id:'t_fumo',src:'Il Mattinale del Ministero',title:'Divieto di fumo nel piazzale',cond:()=>hasTal('Fumatore incallito'),
  text:'L\'ASL ha imposto il divieto di fumo in tutto il piazzale, banchine comprese. Il cartello è proprio sotto la tua finestra. Tutti sanno che il primo a dover rinunciare sei tu.',
  opts:[{t:'Dai il buon esempio e smetti',d:'Butti l\'ultimo pacchetto davanti a tutti. Da quel giorno ti guardano con rispetto.',e:'Morale +4: ti rispettano',r:'Hai smesso. I primi giorni sei nervoso, ma in magazzino lo notano e lo apprezzano.',f:()=>mod('all',{mor:4},60)},
        {t:'Area fumatori coperta e a norma',d:'Fai costruire un\'area fumatori coperta e in regola, lontana dalle banchine.',e:'−2.500 €, morale +2',r:'L\'area fumatori è pronta, con la tettoia e il posacenere a norma. È diventata il posto delle riunioni vere.',f:()=>{S.cash-=2500;mod('all',{mor:2},60);}},
        {t:'Fuma di nascosto dietro i bancali',d:'Continui a fumare dietro i bancali del corridoio 9. Prima o poi qualcuno ti vedrà.',e:'Nessun costo… se non ti beccano',r:'Fumi dietro i bancali, come un ragazzino. Qualcuno ha visto il fumo, ma fa finta di niente.',f:()=>{if(Math.random()<0.35){S.cash-=1000;S.rep-=3;toast('Multato dall\'ASL dietro i bancali: −1.000 €','bad');}}}]},
 {id:'t_maratona',src:'La Gazzetta del Muletto',title:'Maratona di Torino',cond:()=>hasTal('Maratoneta')&&[9,10].includes(monthOf(S.day)),
  text:'Domenica c\'è la maratona di Torino e tre magazzinieri si sono iscritti. Ti chiedono di correre con loro, "per fare squadra". Sanno che tu la corri ogni anno.',
  opts:[{t:'Sponsorizza la squadra aziendale',d:'Paghi iscrizione e maglietta con il logo a chiunque voglia correre. Al traguardo c\'è anche il giornale.',e:'−3.000 €, reputazione +4, morale +4',r:'La squadra corre con il logo sul petto. Qualcuno arriva, qualcuno si ferma al ristoro.',f:()=>{S.cash-=3000;S.rep+=4;mod('all',{mor:4},60);}},
        {t:'Corri con loro, maglietta fatta in casa',d:'Corri con loro, con una maglietta scritta a pennarello. Arrivate insieme, stremati.',e:'Morale +3',r:'Corri con la squadra, a passo lento. All\'arrivo vi fate una foto tutti insieme.',f:()=>mod('all',{mor:3},30)},
        {t:'Corri da solo, per il tempo',d:'Corri per conto tuo, per migliorare il tuo tempo. I magazzinieri ti vedono partire e non ti rivedono più.',e:'Nessun effetto',r:'Corri da solo, con il cronometro. Il tempo è buono, ma non lo sa nessuno.',f:()=>{}}]},
 {id:'t_gatto_nero',src:'La Gazzetta del Muletto',title:'Gatto nero nel piazzale',cond:()=>hasTal('Superstizioso')&&actC(),
  setup:ev=>{ev.c=actC();ev.text=`Un gatto nero ha attraversato il piazzale proprio mentre partiva il bilico per ${ev.c.name}. L'autista ti guarda: aspetta un tuo segnale.`;},
  opts:[{t:'Fermi tutti: si parte domani',d:'Fai scaricare il bilico e lo fai partire domani. Il cliente non capisce, tu dormi tranquillo.',e:'Puntualità −6 per 2 giorni',r:'Si parte domani, tutti tranquilli. Il gatto, intanto, dorme sul cofano del bilico.',f:()=>mod('all',{P:-6},2)},
        {t:'Corno rosso sullo specchietto e via',d:'Appendi un cornetto rosso allo specchietto e dai il via. Per sicurezza ne compri una scatola.',e:'−20 € di cornetti',r:'Il cornetto rosso è appeso allo specchietto. Gli autisti partono e nessuno fa domande.',f:()=>{S.cash-=20;}},
        {t:'Adotta il gatto',d:'Prendi in braccio il gatto e lo porti in ufficio. Da oggi è di casa.',e:'Morale +3',r:'Il gatto ha una ciotola e un nome. Ora gira in ufficio come se fosse il direttore.',f:()=>mod('all',{mor:3},60)}]},
 {id:'t_avvocato',src:'Il Mattinale del Ministero',title:'L\'avvocato dell\'ex',cond:()=>hasTal('Divorziato due volte'),
  text:'L\'avvocato del tuo secondo matrimonio sostiene che il magazzino era "bene comune della famiglia". Come prova allega una foto del matrimonio scattata davanti alle baie di carico. La lettera è arrivata in ufficio, e l\'hanno letta tutti.',
  opts:[{t:'Paga e chiudi la questione',d:'Paghi la cifra richiesta pur di non pensarci più.',e:'−15.000 €',r:'Il bonifico è partito. L\'avvocato ti saluta con molto più calore di prima.',f:()=>{S.cash-=15000;}},
        {t:'Vai in causa',d:'Ti affidi al tuo avvocato e vai in tribunale. Le udienze dureranno mesi.',e:'−4.000 € di avvocati; se perdi altri −20.000 €',r:'La causa è partita. Il tuo avvocato dice di stare tranquillo, mentre ti manda la fattura.',f:()=>{S.cash-=4000;if(Math.random()<0.4){S.cash-=20000;toast('Causa persa: −20.000 €','bad');}else toast('Causa vinta','ok');}},
        {t:'Chiedi aiuto alla prima ex, che lo detesta',d:'Chiami la tua prima ex, che detesta quell\'avvocato e sa esattamente come zittirlo.',e:'−2.000 €',req:()=>ceo().st.neg>=12,reqT:'Negoziazione 12',r:'La prima ex ha fatto una telefonata. L\'avvocato ha ritirato tutto in un giorno.',f:()=>{S.cash-=2000;}}]},
 {id:'t_recita',src:'La Gazzetta del Muletto',title:'La recita di Natale',cond:()=>hasTal('Tre figli piccoli')&&monthOf(S.day)===11,
  text:'Giovedì alle 10 c\'è la recita di Natale dei tuoi figli. Alla stessa ora è fissata la riunione sul budget dell\'anno prossimo, con tutti i responsabili. Il più piccolo fa la stella cometa e te lo ricorda ogni sera.',
  opts:[{t:'Vai alla recita',d:'Vai alla recita e sposti la riunione. In ufficio lo vengono a sapere e ti stimano di più.',e:'Puntualità −1 per 3 giorni, morale +3: l\'hanno saputo tutti',r:'Eri in prima fila con il telefono in mano. In ufficio lo sanno già tutti.',f:()=>mod('all',{P:-1,mor:3},3)},
        {t:'Vai in riunione',d:'Vai in riunione e chiedi a qualcuno di filmare la recita. Non è la stessa cosa, per nessuno.',e:'Morale −2 a casa e in ufficio',r:'La riunione è andata bene. A casa e in ufficio, però, qualcuno ti guarda storto.',f:()=>mod('all',{mor:-2},15)}]},
 {id:'t_social',src:'La Gazzetta del Muletto',title:'Il tuo post è virale',cond:()=>hasTal('Guru dei social'),
  text:'Il tuo post "Cosa mi ha insegnato un pallet rotto sulla leadership" ha fatto 40.000 visualizzazioni. Ti scrivono colleghi, clienti e sconosciuti. Un concorrente ha commentato: "E i pallet chi li paga?".',
  opts:[{t:'Pubblica la seconda parte',d:'Pubblichi la seconda parte, ancora più ispirata. Può andare benissimo, o diventare un meme.',e:'Reputazione +5, oppure −4 se esageri',r:'La seconda parte è online. I commenti arrivano a centinaia.',f:()=>{if(Math.random()<0.6){S.rep+=5;toast('Seconda parte: altri 60.000 like','ok');}else{S.rep-=4;toast('Hai pubblicato la foto di un magazzino in disordine','bad');}}},
        {t:'Rispondi a tutti i commenti',d:'Passi la settimana a rispondere ai commenti, uno per uno. In ufficio ti vedono poco.',e:'Reputazione +2, puntualità −2 per 7 giorni',r:'Hai risposto a tutti, uno per uno. Il post è ancora lì, e anche il tuo pomeriggio.',f:()=>{S.rep+=2;mod('all',{P:-2},7);}}]},
 {id:'t_brasato',src:'Ufficio commerciale',title:'Il buyer viene a pranzo',cond:()=>hasTal('Cuoco provetto')&&actC(),
  setup:ev=>{ev.c=actC();ev.text=`Il buyer di ${ev.c.name} viene a vedere il magazzino e si ferma a pranzo. In mensa ti guardano: sanno che hai portato la pentola da casa.`;},
  opts:[{t:'Cucina tu: brasato al Barolo',d:'Cucini tu un brasato al Barolo e lo servi in mensa con tutti. Il buyer chiede la ricetta.',e:'−300 €, soddisfazione +12',r:'Il brasato ha cotto per sei ore. Il buyer ha chiesto la ricetta prima del contratto.',f:function(){S.cash-=300;this.c.sat=clamp(this.c.sat+12,0,100);}},
        {t:'Ristorante stellato in Langa',d:'Prenoti un ristorante stellato in Langa. Elegante, ma meno personale.',e:'−1.500 €, soddisfazione +6',r:'Il ristorante stellato è buonissimo. Il buyer ha fotografato ogni piatto e ha lasciato la verdura.',f:function(){S.cash-=1500;this.c.sat=clamp(this.c.sat+6,0,100);}}]},
 {id:'t_ipocondria',src:'La Gazzetta del Muletto',title:'Sintomi letti su internet',cond:()=>hasTal('Ipocondriaco'),
  text:'Da due giorni hai mal di testa e un formicolio alla mano. Secondo un forum su internet sono i sintomi di tre malattie rare. Hai già prenotato sette visite specialistiche.',
  opts:[{t:'Settimana di esami',d:'Ti prendi una settimana per fare tutti gli esami. Stai benissimo, ma l\'ufficio va avanti senza di te.',e:'Puntualità −3 per 7 giorni (stai benissimo)',r:'Una settimana di esami. Stai benissimo, come sempre.',f:()=>mod('all',{P:-3},7)},
        {t:'Ascolta il medico di base: "È stress"',d:'Vai dal medico di base, che ti guarda e dice: «È stress». Torni al lavoro.',e:'Nessun effetto',r:'Il medico ti guarda, sorride e ti dice di dormire di più. Ci provi.',f:()=>{}}]},
 {id:'t_epoca',src:'La Gazzetta del Muletto',title:'Asta di un camion d\'epoca',cond:()=>hasTal('Collezionista di camion d\'epoca'),
  text:'All\'asta di Alessandria c\'è un autocarro del 1958 perfettamente restaurato, con le cromature lucide e il motore originale. Con il tuo logo sopra farebbe un figurone alle fiere di settore. Il banditore ti ha già notato.',
  opts:[{t:'Compralo',d:'Alzi la paletta e porti a casa il camion. Alle fiere tutti si fermano a fotografarlo.',e:'−18.000 €, reputazione +5',r:'Il camion d\'epoca è nel piazzale, lucido. Lo vengono a vedere anche dai paesi vicini.',f:()=>{S.cash-=18000;S.rep+=5;}},
        {t:'Fai solo una foto',d:'Fai una foto, sospiri e torni a casa a mani vuote.',e:'Nessun effetto, un po\' di malinconia',r:'Hai fatto la foto. Ogni tanto la guardi sul telefono.',f:()=>{}}]},
 {id:'t_rotonda',src:'Il Mattinale del Ministero',title:'La rotonda davanti al magazzino',cond:()=>hasTal('Consigliere comunale'),
  text:'In consiglio comunale si vota una rotonda proprio davanti al tuo magazzino. I bilici entrerebbero molto più in fretta. L\'opposizione ha già pronta la parola "conflitto d\'interessi".',
  opts:[{t:'Vota a favore',d:'Voti sì. I bilici entreranno più in fretta, ma l\'opposizione ti attacca sul giornale.',e:'Puntualità +3 per 6 mesi, reputazione −3',r:'La rotonda si farà. I camion gireranno meglio, i vicini un po\' meno contenti.',f:()=>{mod('all',{P:3},180);S.rep-=3;}},
        {t:'Astieniti',d:'Esci dall\'aula al momento del voto. Nessuno può dirti niente, e qualcuno ti loda.',e:'Reputazione +2',r:'Ti sei astenuto. I vicini lo hanno notato e ti salutano con più calore.',f:()=>{S.rep+=2;}}]},
 {id:'t_caccia',src:'La Gazzetta del Muletto',title:'Apertura della caccia',cond:()=>hasTal('Cacciatore')&&monthOf(S.day)===8&&actC(),
  setup:ev=>{ev.c=actC();ev.text=`Domenica apre la caccia. Hai chiuso l'ufficio il venerdì pomeriggio. Il buyer di ${ev.c.name} ha chiamato sei volte e adesso chiede se può venire anche lui.`;},
  opts:[{t:'Portalo a caccia',d:'Gli presti un fucile e lo porti con te all\'alba. Speri che la caccia gli piaccia.',e:'Soddisfazione +8, oppure −8 se scopri che è animalista',r:'La giornata nei boschi va lunga. Tornate stanchi e con molte storie da raccontare.',f:function(){if(Math.random()<0.7)this.c.sat=clamp(this.c.sat+8,0,100);else{this.c.sat=clamp(this.c.sat-8,0,100);toast('Era animalista. Lo hai scoperto al primo sparo.','bad');}}},
        {t:'Torna in ufficio a richiamarlo',d:'Torni in ufficio di domenica mattina e lo richiami. La caccia aspetterà.',e:'Nessun effetto',r:'Hai richiamato il cliente. Lui era già a caccia, ti richiamerà lunedì.',f:()=>{}}]},
 {id:'t_calcio',src:'Ufficio commerciale',title:'Partita contro il cliente',cond:()=>hasTal('Ex calciatore di serie C')&&actC(),
  setup:ev=>{ev.c=actC();ev.text=`Torneo di calcetto aziendale: in finale c'è ${ev.c.name}. Il loro centravanti è il responsabile acquisti. Tu hai ancora le scarpe del 1987.`;},
  opts:[{t:'Gioca per vincere',d:'Giochi come ai tempi della serie C e segni tre gol. I tuoi esultano, il cliente no.',e:'Morale +5, soddisfazione −4',r:'Avete vinto voi. Il cliente stringe la mano ma non sorride.',f:function(){mod('all',{mor:5},30);this.c.sat=clamp(this.c.sat-4,0,100);}},
        {t:'Sbaglia un rigore, con classe',d:'Al momento del rigore calci piano e centrale. Il loro portiere para e il cliente ti offre da bere.',e:'Soddisfazione +8, morale −3',r:'Il rigore finisce in curva, con eleganza. Il cliente festeggia, i tuoi un po\' meno.',f:function(){this.c.sat=clamp(this.c.sat+8,0,100);mod('all',{mor:-3},30);}}]},
 {id:'t_cugino',src:'La Gazzetta del Muletto',title:'Il nipote del cugino',cond:()=>hasTal('Ha un cugino per tutto'),
  text:'Tuo cugino, quello che ti ha trovato il gommista e l\'elettricista, ti chiede di assumere il nipote. "È bravo, ha solo bisogno di una possibilità". Il nipote ha 19 anni e un motorino truccato.',
  opts:[{t:'Assumilo come magazziniere',d:'Lo assumi in magazzino e gli dai una possibilità. La squadra lo guarda con sospetto.',e:'Un magazziniere in più nel primo magazzino, morale −2',r:'Il nipote del cugino inizia lunedì. Non sa guidare il transpallet, ma è molto simpatico.',f:()=>{S.warehouses[0].staff.pick++;mod('all',{mor:-2},30);}},
        {t:'Di\' di no',d:'Dici di no, con gentilezza. Tuo cugino ci resta male, e lo fa sapere al gommista.',e:'Il gommista non ti fa più lo sconto: −1.500 €',r:'Hai detto di no. Il gommista ti cambia le gomme, ma a prezzo pieno.',f:()=>{S.cash-=1500;}}]},
 {id:'t_pollini',src:'Radio Traffico Nord',title:'Primavera in tangenziale',cond:()=>hasTal('Allergico ai pollini')&&[3,4].includes(monthOf(S.day)),
  text:'È primavera e starnutisci da dieci giorni. Ieri hai firmato un\'offerta per un cliente con uno starnuto a metà, e ci è finito uno zero in più. Per fortuna non è ancora partita.',
  opts:[{t:'Ricontrolla tutto tu',d:'Ricontrolli di persona ogni documento in uscita, tra un fazzoletto e l\'altro.',e:'Puntualità −2 per 7 giorni',r:'Hai ricontrollato tutto tu, starnutendo. Ci hai messo il doppio, ma è tutto giusto.',f:()=>mod('all',{P:-2},7)},
        {t:'Fai controllare all\'impiegata',d:'Chiedi all\'impiegata di controllare al posto tuo. È brava, ma ha già mille cose da fare.',e:'Accuratezza −2 per 7 giorni',r:'L\'impiegata controlla tutto, ma anche lei starnutisce. Qualche numero sfugge.',f:()=>mod('all',{A:-2},7)}]},
 {id:'t_scadenza',src:'Ufficio amministrazione',title:'Una scadenza dimenticata',cond:()=>hasTal('Smemorato'),
  text:'Oggi scadeva l\'assicurazione di tutta la flotta. Te ne sei ricordato alle 23:58, guardando un camion dalla finestra. Domattina i mezzi devono partire.',
  opts:[{t:'Paga la mora',d:'Rinnovi domattina e paghi la mora. I camion partono comunque.',e:'−2.500 €',r:'La mora è pagata. L\'assicurazione ti ringrazia, a modo suo.',f:()=>{S.cash-=2500;}},
        {t:'Chiama l\'assicuratore a casa',d:'Chiami l\'assicuratore a casa, a mezzanotte, e lo convinci a fare la pratica subito.',e:'−500 €',req:()=>ceo().st.amm>=12,reqT:'Amministrazione 12',r:'L\'assicuratore risponde dal divano. Sistema tutto con una telefonata e una fetta di torta.',f:()=>{S.cash-=500;}}]},
 {id:'t_golf',src:'Ufficio commerciale',title:'Torneo di golf',cond:()=>hasTal('Golfista')&&actC(),
  setup:ev=>{ev.c=actC();ev.text=`Il direttore logistico di ${ev.c.name} ti invita al torneo del suo circolo. Ha un handicap terribile e un ego enorme.`;},
  opts:[{t:'Perdi apposta',d:'Sbagli tre buche apposta e gli lasci vincere il torneo. Lui ti racconta ogni colpo a cena.',e:'−1.200 € di iscrizione, soddisfazione +10',r:'Hai perso con stile. Il cliente ti spiega come tenere la mazza, contento.',f:function(){S.cash-=1200;this.c.sat=clamp(this.c.sat+10,0,100);}},
        {t:'Gioca per vincere',d:'Giochi al massimo. Se perde, potrebbe ammirarti o non perdonarti.',e:'−1.200 €; soddisfazione +15 se ti ammira, −5 se se la lega al dito',r:'Hai giocato per vincere. Alla buca 18 il cliente ti guarda in modo strano.',f:function(){S.cash-=1200;if(Math.random()<0.5)this.c.sat=clamp(this.c.sat+15,0,100);else this.c.sat=clamp(this.c.sat-5,0,100);}},
        {t:'Declina: c\'è da lavorare',d:'Ringrazi e declini: c\'è un magazzino da mandare avanti.',e:'Nessun effetto',r:'Hai lavorato tutto il giorno. Il torneo lo vedi solo nelle foto.',f:()=>{}}]},
 {id:'t_guanto',src:'La Gazzetta del Muletto',title:'Ispezione col guanto bianco',cond:()=>hasTal('Maniaco dell\'ordine'),
  text:'Hai passato il guanto bianco sulle scaffalature del corridoio 4. Era grigio. Il capoturno finge di essere al telefono.',
  opts:[{t:'Pulizia straordinaria nel weekend',d:'Organizzi una pulizia straordinaria nel weekend. Gli scaffali brillano, la squadra sbuffa.',e:'−2.000 €, accuratezza +2 per un mese, morale −3',r:'Il weekend di pulizie è finito. Il magazzino brilla, la squadra è stanca.',f:()=>{S.cash-=2000;mod('all',{A:2,mor:-3},30);}},
        {t:'Impresa di pulizie fissa',d:'Prendi un\'impresa di pulizie fissa. Il magazzino resta in ordine e nessuno rinuncia al sabato.',e:'−4.000 €, accuratezza +3 per 3 mesi',r:'L\'impresa di pulizie arriva ogni sera. Il guanto bianco ora resta bianco.',f:()=>{S.cash-=4000;mod('all',{A:3},90);}},
        {t:'Fai finta di niente (soffri in silenzio)',d:'Ti togli il guanto, sorridi e vai avanti. Ci pensi tutta la notte.',e:'Nessun effetto',r:'Il guanto resta grigio. Il cliente non dice niente, ma se lo ricorda.',f:()=>{}}]},
 {id:'t_moto',src:'Radio Traffico Nord',title:'Caduta sul Turchino',cond:()=>hasTal('Motociclista'),
  text:'Domenica sei scivolato con la moto su una curva del passo del Turchino. Niente di grave, ma hai il braccio ingessato per due settimane. Il medico ti consiglia riposo.',
  opts:[{t:'Lavora da casa',d:'Lavori da casa, con il portatile sul cuscino.',e:'Puntualità −2 per 14 giorni',r:'Lavori da casa con la gamba sul cuscino. Le riunioni si fanno in videochiamata, con tanti silenzi.',f:()=>mod('all',{P:-2},14)},
        {t:'In ufficio col gesso',d:'Torni in ufficio con il gesso. Tutti vogliono firmartelo.',e:'Puntualità −1 e morale +3 per 14 giorni: sei un eroe',r:'Arrivi in ufficio con le stampelle. Tutti ti firmano il gesso.',f:()=>mod('all',{P:-1,mor:3},14)}]},
 {id:'t_complotto',src:'La Gazzetta del Muletto',title:'I codici a barre ci schedano',cond:()=>hasTal('Complottista'),
  text:'In riunione hai spiegato che i codici a barre servono a schedare i magazzinieri. Hai stampato le prove da un forum. Gli impiegati si scambiano occhiate.',
  opts:[{t:'Ritratta: era una battuta',d:'Dici che era una battuta e cambi argomento. Non tutti ci credono.',e:'Reputazione −1',r:'Hai detto che era una battuta. Qualcuno ci crede, qualcuno no.',f:()=>{S.rep-=1;}},
        {t:'Vieta le pistole barcode per un mese',d:'Fai mettere via le pistole barcode per un mese. Si torna alla carta, e agli errori.',e:'Accuratezza −3 per 30 giorni, morale +2 tra i diffidenti',r:'Per un mese si lavora a mano. I diffidenti sono contenti, gli errori aumentano.',f:()=>mod('all',{A:-3,mor:2},30)},
        {t:'Scrivi una lettera al giornale locale',d:'Scrivi al giornale locale per denunciare la schedatura. La lettera viene pubblicata, purtroppo.',e:'Reputazione −4',r:'La lettera esce sul giornale. In paese ora ti guardano con curiosità.',f:()=>{S.rep-=4;}}]},
 {id:'t_lira',src:'Ufficio commerciale',title:'Preventivo in lire',cond:()=>hasTal('Nostalgico della lira')&&yearOf(S.day)<=2004&&actC(),
  setup:ev=>{ev.c=actC();ev.text=`Hai mandato a ${ev.c.name} il preventivo per il nuovo anno in lire. Il buyer ha creduto per un'ora di pagare 1.936 volte di più.`;},
  opts:[{t:'Correggi e chiedi scusa',d:'Mandi subito il preventivo in euro con una mail di scuse.',e:'Soddisfazione −3',r:'Hai corretto il preventivo e chiesto scusa. Il cliente ride, ma non troppo.',f:function(){this.c.sat=clamp(this.c.sat-3,0,100);}},
        {t:'"Era uno sconto per i nostalgici"',d:'Richiami il buyer: era uno scherzo per i nostalgici, e c\'è anche uno sconto vero. Ride, e firma.',e:'Soddisfazione +5',req:()=>ceo().st.neg>=12,reqT:'Negoziazione 12',r:'Il cliente ride di gusto. Dice che non vedeva un preventivo in lire dal 2001.',f:function(){this.c.sat=clamp(this.c.sat+5,0,100);}}]},
 {id:'t_inno',src:'La Gazzetta del Muletto',title:'L\'inno aziendale',cond:()=>hasTal('Cantautore incompreso'),
  text:'Hai scritto l\'inno aziendale: "Pallet d\'amore". Il turno di notte lo canta con un tono che non riesci a decifrare.',
  opts:[{t:'Registralo in uno studio vero',d:'Prenoti uno studio di registrazione e lo incidi con il coro del turno di notte.',e:'−1.500 €, morale +4, reputazione +1',r:'L\'inno è registrato in uno studio vero. Al magazzino lo cantano, in modo stonato.',f:()=>{S.cash-=1500;mod('all',{mor:4},60);S.rep+=1;}},
        {t:'Tienilo nel cassetto',d:'Lo rimetti nel cassetto, insieme alle altre canzoni.',e:'Nessun effetto',r:'L\'inno resta nel cassetto. Ogni tanto lo canticchi in macchina.',f:()=>{}}]},
 {id:'t_gatto',src:'Ufficio acquisti',title:'Il gatto ha premuto Invio',cond:()=>hasTal('Gatto in ufficio'),
  text:'Bancale, il gatto dell\'ufficio, ha passeggiato sulla tastiera del computer degli acquisti. È partito un ordine di 4.000 rotoli di film estensibile, già confermato dal fornitore. Bancale dorme sul monitor, soddisfatto.',
  opts:[{t:'Tieni il film: prima o poi serve',d:'Tieni tutti i rotoli e li impili in un angolo. Basteranno per anni.',e:'−3.000 €',r:'Il film resta in magazzino. Prima o poi qualcuno lo userà, dicono.',f:()=>{S.cash-=3000;}},
        {t:'Annulla e paga la penale',d:'Chiami il fornitore e annulli l\'ordine, pagando la penale.',e:'−800 €',r:'La penale è pagata. Il gatto non sembra pentito.',f:()=>{S.cash-=800;}},
        {t:'Nomina Bancale responsabile acquisti',d:'Annulli l\'ordine e appendi in ufficio la foto di Bancale con la targhetta «Responsabile acquisti».',e:'−800 €, morale +4',r:'Bancale ha il suo badge. Durante le riunioni dorme sul tavolo, come certi responsabili veri.',f:()=>{S.cash-=800;mod('all',{mor:4},60);}}]},
 {id:'t_budget',src:'La Gazzetta del Muletto',title:'"Quest\'anno raddoppiamo"',cond:()=>hasTal('Ottimista patologico')&&monthOf(S.day)===0,
  text:'L\'hai detto all\'assemblea di inizio anno, davanti a tutti. Qualcuno ha applaudito, qualcuno ha cercato il curriculum.',
  opts:[{t:'Assumi subito un magazziniere in più',d:'Per dimostrare che fai sul serio, assumi subito un magazziniere in più.',e:'Un magazziniere in più nel primo magazzino, morale +3',r:'Il nuovo magazziniere arriva lunedì. Il resto della squadra lo accoglie con un applauso.',f:()=>{S.warehouses[0].staff.pick++;mod('all',{mor:3},60);}},
        {t:'Ridimensiona: "intendevo i sorrisi"',d:'Alla riunione successiva spieghi che intendevi raddoppiare i sorrisi. Qualcuno sospira.',e:'Morale −2',r:'Nessuno ci crede, ma tutti sorridono per educazione.',f:()=>mod('all',{mor:-2},30)}]},
 {id:'t_scatola',src:'Ufficio amministrazione',title:'La scatola delle scarpe',cond:()=>hasTal('Pessimista cosmico')&&S.cash<0,once:true,
  text:'Da anni tieni 10.000 € in una scatola di scarpe nell\'armadio, "per quando andrà male". Il conto in banca è in rosso. È andata male.',
  opts:[{t:'Versali in cassa',d:'Prendi la scatola dall\'armadio e porti i soldi in banca.',e:'+10.000 €',r:'I soldi sono in cassa. Il commercialista fa finta di non sapere da dove vengono.',f:()=>{S.cash+=10000;}},
        {t:'No: può andare ancora peggio',d:'Rimetti la scatola al suo posto: il peggio deve ancora venire.',e:'Nessun effetto',r:'La scatola torna nell\'armadio. Speriamo non serva.',f:()=>{S.seen.t_scatola=undefined;}}]},
 {id:'t_virgola',src:'Ufficio commerciale',title:'Una virgola fuori posto',cond:()=>hasTal('Pignolo sulle virgole')&&actC(),
  setup:ev=>{ev.c=actC();ev.text=`Rileggendo per la quinta volta il contratto di ${ev.c.name} hai trovato una virgola fuori posto. Vale 6.000 € l'anno, a tuo favore.`;},
  opts:[{t:'Faglielo notare',d:'Telefoni al cliente e gli segnali l\'errore. Apprezza l\'onestà e lo racconta in giro.',e:'Soddisfazione +8, reputazione +2',r:'Il cliente ringrazia e lo racconta in giro. Una virgola onesta vale più di tanti spot.',f:function(){this.c.sat=clamp(this.c.sat+8,0,100);S.rep+=2;}},
        {t:'Taci e incassa',d:'Non dici niente e lasci il contratto com\'è. Speri che nessuno lo rilegga.',e:'+6.000 €; se se ne accorgono, soddisfazione −15',r:'La virgola resta dov\'è. Ogni volta che il cliente chiama, ti prende un piccolo spavento.',f:function(){S.cash+=6000;if(Math.random()<0.3){this.c.sat=clamp(this.c.sat-15,0,100);toast('Se ne sono accorti','bad');}}}]},
 {id:'t_gratta',src:'La Gazzetta del Muletto',title:'Gratta e vinci all\'autogrill',cond:()=>hasTal('Fortunato al gratta e vinci'),
  text:'All\'autogrill di Novara il resto del caffè è un gratta e vinci. Senti un formicolio nelle dita.',
  opts:[{t:'Gratta',d:'Prendi una moneta e gratti, lì al bancone.',e:'Chissà',r:'Hai grattato con una moneta da 20 centesimi, lì al bancone.',f:()=>{const r=Math.random();if(r<0.1){S.cash+=50000;toast('Hai vinto 50.000 €!','ok');}else if(r<0.5){S.cash+=500;toast('Hai vinto 500 €','ok');}else toast('Ritenta, sarai più fortunato','warn');}},
        {t:'Regalalo all\'autista di turno',d:'Lo regali all\'autista che sta pagando il caffè. Se vince, almeno sarà contento lui.',e:'Morale +2',r:'L\'autista gratta subito. Comunque vada, la storia gira in magazzino per giorni.',f:()=>mod('all',{mor:2},30)}]},
 {id:'t_anticipo',src:'Ufficio del personale',title:'Un anticipo per la caldaia',cond:()=>hasTal('Cuore d\'oro'),
  text:'Un carrellista ti chiede 3.000 € di anticipo: la caldaia di casa si è rotta e ha due bambini piccoli. Lo dice guardando per terra.',
  opts:[{t:'Dagli l\'anticipo',d:'Gli dai l\'anticipo in busta paga, senza fare domande.',e:'−3.000 €, morale +5 per 2 mesi',r:'Il carrellista ti ringrazia con una stretta di mano. La caldaia è nuova.',f:()=>{S.cash-=3000;mod('all',{mor:5},60);}},
        {t:'Prestito aziendale a rate',d:'Gli proponi un prestito aziendale da restituire a piccole rate. Lui ringrazia, sollevato.',e:'Morale +3',req:()=>ceo().st.amm>=11,reqT:'Amministrazione 11',r:'Il prestito è firmato. Il carrellista paga la prima rata con un sorriso.',f:()=>mod('all',{mor:3},60)},
        {t:'"Mi dispiace, non possiamo"',d:'Gli spieghi che l\'azienda non può. Se ne va senza dire niente.',e:'Morale −3',r:'Il carrellista torna al lavoro senza dire niente. La caldaia, forse, aspetta.',f:()=>mod('all',{mor:-3},30)}]},
 // richiesta di aumento: un manager o dirigente assunto da più di un anno ha un'offerta di un concorrente

  s.warehouses.forEach((w,i)=>{const o=w.staff;

}

const view={s:1,x:0,y:0}, MW=1520, MH=800; // mappa: 760x400 in pixel art mostrata a 2x (da Nizza a Trieste)
function fitMap(){
  const W=innerWidth,H=innerHeight; const s0=Math.max(W/MW,H/MH);
  view.min=s0; if(view.s<s0||!view.init){view.s=s0;view.x=(W-MW*s0)/2;view.y=(H-MH*s0)/2;view.init=1;}
  clampView(); applyView();
}
function clampView(){const W=innerWidth,H=innerHeight;view.x=clamp(view.x,W-MW*view.s,0);view.y=clamp(view.y,H-MH*view.s,0);}
function applyView(){$('#map').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;}
// zoom tenendo fermo il punto (mx,my) dello schermo
function zoomAt(mx,my,ns){ns=clamp(ns,view.min,view.min*3.2);view.x=mx-(mx-view.x)*ns/view.s;view.y=my-(my-view.y)*ns/view.s;view.s=ns;clampView();applyView();}
function initMapControls(){
  // un dito (o il mouse) trascina, due dita allargano e stringono; il trascinamento parte solo dopo qualche pixel, così i tocchi restano clic
  const mw=$('#mapwrap'), pts=new Map(); let drag=null, pinch=null;
  const mid=()=>{const [a,b]=[...pts.values()];return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)||1};};
  const begin=()=>{ drag=null; pinch=null;
    if(pts.size===1){const [p]=pts.values(); drag={x:p.x,y:p.y,vx:view.x,vy:view.y,on:false};}
    else if(pts.size===2){const m=mid(); pinch={...m,s:view.s,vx:view.x,vy:view.y}; mw.classList.add('drag');} };
  mw.addEventListener('pointerdown',e=>{ if(e.target.closest('.mk')||pts.size>=2) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); begin(); });
  mw.addEventListener('pointermove',e=>{ const p=pts.get(e.pointerId); if(!p) return; p.x=e.clientX; p.y=e.clientY;
    if(pinch){const m=mid(), ns=clamp(pinch.s*m.d/pinch.d,view.min,view.min*3.2); view.s=ns;
      view.x=m.x-(pinch.x-pinch.vx)*ns/pinch.s; view.y=m.y-(pinch.y-pinch.vy)*ns/pinch.s; clampView(); applyView(); return;}
    if(!drag) return;
    if(!drag.on){ if(Math.hypot(p.x-drag.x,p.y-drag.y)<6) return; drag.on=true; mw.classList.add('drag'); try{mw.setPointerCapture(e.pointerId);}catch(_){} }
    view.x=drag.vx+p.x-drag.x; view.y=drag.vy+p.y-drag.y; clampView(); applyView(); });
  const up=e=>{ if(!pts.delete(e.pointerId)) return; mw.classList.remove('drag'); begin(); };
  mw.addEventListener('pointerup',up); mw.addEventListener('pointercancel',up);
  mw.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,view.s*(e.deltaY<0?1.15:1/1.15));},{passive:false});
  addEventListener('resize',()=>{setMobile();fitMap();fitAllWins();});
}

let trucks=[], lastT=0;
const TRUCK=c=>`<rect x="0" y="0" width="13" height="8" fill="#16202e"/><rect x="1" y="1" width="11" height="6" fill="${c}"/><rect x="13" y="2" width="6" height="6" fill="#16202e"/><rect x="14" y="3" width="4" height="2" fill="#bfe6ff"/><rect x="2" y="8" width="3" height="3" fill="#16202e"/><rect x="13" y="8" width="3" height="3" fill="#16202e"/>`;
function syncTrucks(){
  const want=[]; S.warehouses.forEach(w=>{const n=Math.min(w.kpi&&w.kpi.viaggi?w.staff.autB+w.staff.autCE:0,6);for(let i=0;i<n;i++)want.push(w.id+'_'+i);});
  trucks=trucks.filter(t=>want.includes(t.id));
  want.forEach(id=>{ if(trucks.find(t=>t.id===id)) return; const w=whById(id.split('_')[0]); const s=SITES[w.site];
    trucks.push({id,wh:w.id,from:pt(s.lon,s.lat),to:null,t:Math.random(),back:false});});
  const g=$('#trucks'); if(!g) return;
  g.innerHTML=trucks.map(t=>`<g id="tk_${t.id}">${TRUCK(getComputedStyle(document.documentElement).getPropertyValue('--accent'))}</g>`).join('');
}
// meta di un camion: una città della zona di un cliente del suo magazzino (se non ce ne sono, una del Nord)
function truckDest(whId){
  const zs=S.clients.filter(c=>c.wh===whId&&c.status==='attivo').flatMap(c=>(ZONES[c.zone]||ZONES.nordovest).cities);
  const cs=zs.length?zs.map(n=>CITIES.find(x=>x[0]===n)).filter(Boolean):CITIES.filter(c=>!c[4]);
  return pick(cs.length?cs:CITIES);
}
function animTrucks(ts){
  const dt=Math.min(0.1,(ts-lastT)/1000||0); lastT=ts;
  const mv=S&&!S.over&&S.speed>0 && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  trucks.forEach(t=>{
    if(!t.to){const c=truckDest(t.wh);t.to=pt(c[1],c[2]);t.t=0;t.back=false;}
    const dx=t.to[0]-t.from[0],dy=t.to[1]-t.from[1],len=Math.hypot(dx,dy)||1;
    if(mv) t.t+=dt*(25+S.speed*20)/len;
    if(t.t>=1){ if(!t.back){t.back=true;t.t=0;[t.from,t.to]=[t.to,t.from];} else {t.from=t.to;t.to=null;} }
    if(!t.to) return;
    const x=t.from[0]+(t.to[0]-t.from[0])*clamp(t.t,0,1), y=t.from[1]+(t.to[1]-t.from[1])*clamp(t.t,0,1);
    const el=document.getElementById('tk_'+t.id); if(el) el.setAttribute('transform',`translate(${Math.round(x-9)},${Math.round(y-5)})${t.to[0]<t.from[0]?' scale(-1,1) translate(-19,0)':''}`);
  });
  requestAnimationFrame(animTrucks);
}

  if(sm.obj<=sm.nat) return `<div class="sm ok" data-tip="${tip}">Obiettivo già raggiunto senza sforzo: i camion partono al ${Math.round(sm.val)}%.</div>`;
