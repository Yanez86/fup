function rpCols(title,labels,vals,emptyTxt){
  const n=vals.length; if(n<1) return `<div class="lc lc-empty"><b>${esc(title)}</b><span class="sm">${esc(emptyTxt)}</span></div>`;
  const W=440,H=220,ml=58,mr=10,mt=24,mb=30,pw=W-ml-mr,ph=H-mt-mb;
  let lo=Math.min(0,...vals),hi=Math.max(0,...vals); const r=(hi-lo)/4||1,m=Math.pow(10,Math.floor(Math.log10(r))),st=[1,2,5,10].find(x=>x*m>=r)*m; lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st; if(hi===lo)hi=lo+st;
  const Y=v=>mt+ph-(v-lo)/(hi-lo)*ph, bw=pw/n; let g='';
  for(let v=lo;v<=hi+1e-9;v+=st) g+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3e9ef"/><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end" class="lc-ax">${euK(v)}</text>`;
  vals.forEach((v,i)=>{const y0=Y(Math.max(0,v)),h=Math.max(1,Math.abs(Y(v)-Y(0)));
    g+=`<rect x="${(ml+i*bw+bw*0.15).toFixed(1)}" y="${y0.toFixed(1)}" width="${Math.max(1,bw*0.7).toFixed(1)}" height="${h.toFixed(1)}" fill="${v>=0?'#2e9e48':'#e0393e'}" data-tip="<div class='tt'>${esc(labels[i])}</div>Utile: ${eur(v)}"/>`;});
  g+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(0)}" y2="${Y(0)}" stroke="#16202e"/>`;
  const every=Math.ceil(n/6); labels.forEach((l,i)=>{if(i%every===0) g+=`<text x="${ml+i*bw+bw/2}" y="${H-10}" text-anchor="middle" class="lc-ax">${esc(l)}</text>`;});
  return `<figure class="lc"><figcaption><b>${esc(title)}</b><span class="lc-leg"><span class="lc-key"><svg width="10" height="10" aria-hidden="true"><rect width="10" height="10" fill="#2e9e48"/></svg>Utile</span><span class="lc-key"><svg width="10" height="10" aria-hidden="true"><rect width="10" height="10" fill="#e0393e"/></svg>Perdita</span></span></figcaption><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}" shape-rendering="crispEdges">${g}</svg></figure>`;}

let touchT=0, tipFor=null, lpTimer=0, lpAt=null, lpDone=false;
function showTipAt(t){
  tip.innerHTML=t.dataset.tip; tip.hidden=false; tipFor=t;
  const r=t.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight; let y=r.bottom+8; if(y+h>innerHeight-8) y=Math.max(8,r.top-h-8);
  tip.style.left=clamp(r.left+r.width/2-w/2,8,innerWidth-w-8)+'px'; tip.style.top=y+'px';
}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse') return; touchT=Date.now(); clearTimeout(lpTimer); lpDone=false;
  const t=e.target.closest('[data-tip]'); if(tipFor&&t!==tipFor) hideTip();
  if(t){ lpAt={x:e.clientX,y:e.clientY}; lpTimer=setTimeout(()=>{lpDone=true;showTipAt(t);},450); }
},true);
document.addEventListener('pointermove',e=>{if(lpAt&&Math.hypot(e.clientX-lpAt.x,e.clientY-lpAt.y)>10){clearTimeout(lpTimer);lpAt=null;}},true);
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>{clearTimeout(lpTimer);lpAt=null;},true));
document.addEventListener('contextmenu',e=>{if(Date.now()-touchT<1500)e.preventDefault();});
document.addEventListener('click',e=>{
  if(Date.now()-touchT>1000) return;  // clic del mouse: niente da fare
  const stop=()=>{e.preventDefault();e.stopPropagation();};
  if(lpDone){lpDone=false;stop();return;}
  const t=e.target.closest('[data-tip]');
  const info=t&&(!t.dataset.act||t.dataset.act==='wiki')&&!t.closest('#win-enciclopedia');
  if(info&&tipFor!==t){stop();showTipAt(t);return;}
  if(info&&!t.dataset.act){stop();hideTip();return;}
  hideTip();
},true);
document.addEventListener('mouseover',e=>{if(Date.now()-touchT<1000)return;const t=e.target.closest('[data-tip]');if(!t){if(!e.target.closest('svg[data-chart]'))tip.hidden=true;return;}tip.innerHTML=t.dataset.tip;tip.hidden=false;});
document.addEventListener('mousemove',e=>{if(tip.hidden||Date.now()-touchT<1000)return;const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(e.clientX+14,innerWidth-w-8)+'px';tip.style.top=Math.min(e.clientY+16,innerHeight-h-8)+'px';});

 {v:'0.19',t:'Ognuno al suo posto',x:['Niente più tre cose diverse chiamate «Welfare»: i buoni pasto, l\'assicurazione e il premio ora sono i benefit aziendali; la ricerca che li fa costare meno è la Piattaforma welfare; l\'albero Welfare resta quello dei servizi nei magazzini.','Tolta la Navetta dalla stazione tra i benefit: faceva lo stesso lavoro dei Pulmini per i dipendenti dell\'albero Welfare.','Quanto è pieno un magazzino ora si chiama occupazione, per non confonderla con la saturazione dei mezzi (quanto sono pieni i camion).','I talenti fanno davvero quello che dicono: per esempio Braccino corto e Mano larga cambiano costi e morale del magazzino che il personaggio guida, Parla per acronimi aiuta nelle gare delle committenti S e A, Un milione di km al volante fa trovare prima gli autisti. Tolti gli effetti che non esistevano, come la «tenuta allo stress».','Anche i manager, non solo il CEO, accorciano o allungano l\'apprendimento delle tecnologie con i loro talenti.','Formazione strutturata e Academy aziendale non fanno più la stessa cosa: la Formazione si installa nel magazzino e dà accuratezza +1 e produttività +3%; l\'Academy vale per tutta l\'azienda, accorcia l\'apprendimento delle tecnologie e rende più facile assumere. Nessuna delle due dà più morale.','I soldi spesi o incassati negli eventi compaiono nel conto economico, alla voce Altro; canone e installazione dei servizi di welfare stanno nella voce Welfare e benefit, non più in Tecnologie.','Niente eventi doppi: il derby e la pizza del turno di notte non tornano due volte se il CEO ha il talento con il suo evento; il controllo generico ora è della Guardia di Finanza.','I camion sulla mappa vanno nelle città dei clienti del loro magazzino.','Enciclopedia aggiornata alle regole di oggi, e qualche correzione: i km dei viaggi sono al mese, il «rinnovo a rischio» tiene conto del Key account, la Camera di Commercio è del Nord.','Nuovo carattere per i testi (Rubik): più largo e arrotondato, si legge meglio  {v:'0.17',t:'Chi ripara il portone?',x:['Le novità ora stanno in fondo alla schermata iniziale.','Nuova figura in ogni magazzino: il facility manager. Senza di lui niente manutenzione, il magazzino si rovina e capitano guasti.','Lo stato del magazzino va da 0 a 100: sotto il 70% si perdono posti pallet e produttività.','Manutenzione straordinaria per tornare subito al 100%.','I magazzini si possono ampliare fino a tre volte, con un cantiere di 90 giorni.','11 nuovi servizi di welfare: caffè, sala pausa, spogliatoi, lavanderia, palestra, presidio medico, sportello d\'ascolto, corsi di italiano, raffrescatori, orto, colonnine di ricarica.']},
 {v:'0.16',t:'Tutto il Nord',x:['La mappa arriva fino a Trieste: Emilia-Romagna, Veneto, Trentino-Alto Adige e Friuli-Venezia Giulia sono giocabili, con 22 nuove città e 47 province nella lente.','10 nuovi magazzini in affitto, da Piacenza Le Mose a Trieste Fernetti.','14 nuove committenti: prosciutto, ceramica, motori, piadine, spumanti, occhiali, mele, caffè, cucine, scarponi e altro.','Gare per zona: una provincia, un gruppo di province (Romagna, Pianura Padana, Asse del Brennero…), una regione o più regioni. La stessa committente può aprire più gare per zone diverse e avere più contratti con te.','I volumi di una gara dipendono dagli abitanti della zona.']},
