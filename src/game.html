<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FUP – Fino all'ultimo pallet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- web app: si installa sulla schermata Home del telefono (manifest, icone e sw.js sono accanto a index.html) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16202e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FUP">
<link rel="apple-touch-icon" href="icona_180.png">
<link rel="icon" type="image/png" href="{{ICON}}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: mappa a tutto schermo con pan e zoom, barra risorse in alto, menu a sinistra, finestre fluttuanti trascinabili sopra. Look unico (pixel art chiara su mappa), senza tema scuro alternativo. */
:root{
  --ink:#16202e; --ink2:#0c131d; --ink3:#2a3a50; --ink4:#4a5f7a;
  --panel:#f4f7fa; --panel2:#e6eef3; --line:#c3d0dc; --muted:#4a5768; --hi:#a9b7c8;
  --accent:#ff7a3d; --accent-d:#c8551f; --accent-l:#ffb07a;
  --ok:#2e9e48; --ok-d:#217a36; --ok-t:#23803a; --warn:#e8a317; --warn-d:#b97f0c; --warn-t:#9a6a00; --bad:#e0393e; --bad-d:#a8262a; --bad-t:#c62828;
  --yellow:#ffd23f; --sea:#1b64ad;
  --f-disp:'Pixelify Sans', 'Courier New', monospace;
  --f-body:'Rubik', 'Trebuchet MS', Arial, sans-serif;
  color-scheme: light;
}
/* sfondo scuro come la barra e il menu: su iPhone si vede sotto la barra di stato e sotto il menu, dove la mappa non arriva */
html{background:var(--ink)}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
.px{image-rendering:pixelated}
.disp{font-family:var(--f-disp)}
.num{font-variant-numeric:tabular-nums}

/* Mappa */
#mapwrap{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#mapwrap.drag{cursor:grabbing}
#map{position:absolute;left:0;top:0;width:1520px;height:800px;transform-origin:0 0}
#map img{position:absolute;inset:0;width:1520px;height:800px}
#map svg{position:absolute;inset:0;overflow:visible}
.vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%, rgba(8,20,40,0) 55%, rgba(8,20,40,.4) 100%)}
.lbl{font-family:var(--f-disp);font-weight:600;fill:var(--ink);stroke:#f4f7fa;stroke-width:3px;paint-order:stroke}
.mk{cursor:pointer}
.plbl{font-family:var(--f-disp);font-weight:600;fill:#fff;stroke:var(--ink);stroke-width:3px;paint-order:stroke;pointer-events:none;letter-spacing:1px}
.prov{transition:fill-opacity .12s}
.prov:hover{fill-opacity:.62}
#lenses{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:max(16px, env(safe-area-inset-bottom, 0px));z-index:25;display:flex;align-items:center;gap:6px;padding:6px;background:var(--ink);border:3px solid var(--ink2);box-shadow:inset 0 2px 0 var(--ink3), 5px 5px 0 rgba(12,19,29,.55)}
#lenses .lab{color:var(--hi);font-family:var(--f-disp);font-size:14px;padding:0 4px}
#lenses button{width:44px;height:40px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink4);background:var(--ink3);box-shadow:inset 0 -3px 0 #1d2a3b, inset 0 2px 0 #3b4f6a}
#lenses button[aria-pressed="true"]{background:var(--accent);border-color:#fff;box-shadow:inset 0 -3px 0 var(--accent-d), inset 0 2px 0 var(--accent-l)}
.mk:hover .mk-ring{stroke:var(--yellow)}

/* Barra superiore */
#top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));padding-top:calc(6px + env(safe-area-inset-top, 0px));
  background:var(--ink);color:#fff;border-bottom:3px solid var(--accent);box-shadow:inset 0 -3px 0 var(--ink2), 0 4px 0 rgba(12,19,29,.45)}
#top .logo{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:1px;text-shadow:2px 2px 0 var(--ink2);display:flex;align-items:center;gap:8px}
#top #cologo{display:flex}
#top .logo small{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--hi);letter-spacing:0;text-shadow:none}
.chip{display:flex;flex-direction:column;justify-content:center;line-height:1.1;padding:2px 10px;background:#1d2a3b;border:2px solid #2f4057;min-width:0}
.chip span:first-child{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--hi)}
.chip b{font-family:var(--f-disp);font-size:18px;font-weight:600}
.date{font-family:var(--f-disp);font-size:17px;padding:3px 10px;min-width:calc(12em + 24px);text-align:center;white-space:nowrap;box-sizing:border-box;background:var(--ink3);border:2px solid var(--ink4);box-shadow:inset 0 -2px 0 #1d2a3b}
.spd{display:flex;gap:4px}
.spd button{width:36px;height:34px;border:2px solid var(--ink4);background:var(--ink3);color:#fff;font-family:var(--f-disp);font-weight:700;box-shadow:inset 0 -3px 0 #1d2a3b, inset 0 2px 0 #3b4f6a}
.spd button[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:#fff;box-shadow:inset 0 -3px 0 var(--accent-d), inset 0 2px 0 var(--accent-l)}
.optb{width:36px;height:34px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink4);background:var(--ink3);box-shadow:inset 0 -3px 0 #1d2a3b, inset 0 2px 0 #3b4f6a}
.optb:hover{border-color:#fff}
.spacer{flex:1}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.paused{font-family:var(--f-disp);font-size:15px;padding:3px 8px;background:var(--bad);border:2px solid #fff}

/* Menu laterale */
#dock{position:fixed;left:max(12px, env(safe-area-inset-left, 0px));top:88px;z-index:25;display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--ink);border:3px solid var(--ink2);box-shadow:inset 0 2px 0 var(--ink3), 5px 5px 0 rgba(12,19,29,.55)}
#dock button{width:48px;height:44px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink4);background:var(--ink3);box-shadow:inset 0 -3px 0 #1d2a3b, inset 0 2px 0 #3b4f6a;position:relative}
#dock button.on{background:var(--accent);border-color:#fff;box-shadow:inset 0 -3px 0 var(--accent-d), inset 0 2px 0 var(--accent-l)}
#dock .di{display:flex;align-items:center;justify-content:center}
#dock .dl,#burger,#dockshade{display:none}
#dock .badge{position:absolute;right:-7px;top:-7px;min-width:20px;height:20px;padding:0 4px;background:var(--bad);color:#fff;border:2px solid #fff;font:700 12px/16px var(--f-body)}

/* Finestre */
/* le finestre si ordinano tra loro dentro #wins, senza mai salire sopra barra, modali e tooltip */
#wins{position:relative;z-index:20}
.win{position:fixed;z-index:20;width:440px;max-width:calc(100vw - 32px);max-height:calc(100vh - 110px);display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--ink2);box-shadow:inset 0 0 0 2px #fff, 6px 6px 0 rgba(12,19,29,.55)}
.win.wide{width:640px}
.win.xwide{width:960px}
.stats{display:inline-flex;flex-wrap:wrap;gap:4px}
.stc{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 3px;background:var(--sb);border:2px solid var(--sc);box-shadow:inset 0 -2px 0 rgba(22,32,46,.1);cursor:help;font-size:14px;line-height:1}
.stc b{color:var(--ink);font-variant-numeric:tabular-nums}
.xl{border:2px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column}
.xl-top{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:#2e9e48;color:#fff;font-family:var(--f-disp);font-size:15px}
.xl-top .sm{color:#e6f6e9}
.xl-file{display:inline-flex;align-items:center;gap:6px}
.xl-menu{display:flex;gap:2px;padding:0 6px;background:#eaf6ec;border-bottom:2px solid var(--ink);font-size:13px}
.xl-menu span{padding:4px 9px;color:var(--muted)}
.xl-menu .on{background:#fff;color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 #2e9e48}
.xl-fx{display:flex;align-items:stretch;border-bottom:2px solid var(--ink);font-size:14px}
.xl-ref{width:64px;padding:4px 6px;border-right:2px solid var(--ink);font-family:var(--f-disp);text-align:center}
.xl-fxl{padding:4px 8px;border-right:1px solid #c3d0dc;font-style:italic;color:var(--muted)}
.xl-f{padding:4px 8px;font-family:ui-monospace,monospace;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl-grid{overflow:auto;max-height:420px}
.xl.has-ch .xl-grid{max-height:236px}
.xl-grid table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}
.xl-grid th{background:#dfe7ee;color:var(--muted);font-weight:500;border:1px solid #b5c3d1;padding:2px 6px;font-size:12px;position:sticky;top:0}
.xl-grid tbody th,.xl-h th{width:30px;position:static}
.xl-grid td{border:1px solid #d5dde6;padding:4px 8px;text-align:right;white-space:nowrap;cursor:cell;height:26px}
.xl-h td{background:#f1f5f9;color:var(--ink);font-weight:700;text-align:center;border-bottom:2px solid var(--ink)}
.xl-grid td.ok{background:#e3f4d9;color:#1f6e33}.xl-grid td.warn{background:#fff4c7;color:#7a5a00}.xl-grid td.bad{background:#fde0e0;color:#a32025}
.xl-grid td.sel{outline:3px solid #2e9e48;outline-offset:-2px}
.xl-grid tr.tot td{font-weight:700;border-top:2px solid var(--ink);background:#f7f9fb}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:20px}.spark i{width:6px;display:block}
.xl-tabs{display:flex;gap:2px;padding:0 6px;background:#dfe7ee;border-top:2px solid var(--ink)}
.xl-tabs button{padding:4px 12px;border:0;border-right:1px solid #b5c3d1;background:transparent;font-size:13px;color:var(--muted)}
.xl-tabs button[aria-pressed="true"]{background:#fff;color:#1f6e33;font-weight:700;box-shadow:inset 0 -3px 0 #2e9e48;margin-top:-2px}
.xl-plus{padding:4px 10px;color:var(--muted)}
.xl-charts{padding:12px;background:#f7f9fb;border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:12px}
.lc-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lc{margin:0;background:#fff;border:1px solid #b5c3d1;box-shadow:2px 2px 0 rgba(22,32,46,.18);padding:8px 10px 4px}
.lc figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:14px}
.lc-leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lc-key{display:inline-flex;align-items:center;gap:4px}
.lc-ax{font:12px var(--f-body,sans-serif);fill:#5b6b7f}
.lc-dl{font:600 12px var(--f-body,sans-serif);fill:#16202e}
.lc-empty{display:flex;flex-direction:column;gap:4px;padding:14px}
.lc svg{display:block;cursor:crosshair}
.xl-cli{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border-bottom:2px solid var(--ink);background:#f1f5f9}
.xl-cli button{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:2px solid #b5c3d1;background:#fff;font-size:13px}
.xl-cli button[aria-pressed="true"]{border-color:#2e9e48;box-shadow:inset 0 -3px 0 #2e9e48;font-weight:700}
.rp-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rp-tiles.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.rp-t{display:flex;flex-direction:column;gap:1px;padding:7px 10px;background:#fff;border:2px solid var(--ink);box-shadow:inset 0 -3px 0 var(--panel2),2px 2px 0 var(--ink);min-width:0}
.rp-t[data-act]{cursor:pointer}.rp-t[data-act]:hover{background:#fff8dc}
.rp-t b{font-family:var(--f-disp);font-size:24px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-t.ok b{color:var(--ok-t)}.rp-t.bad b{color:var(--bad-t)}
.rp-sub{font-size:13px;color:var(--muted);line-height:1.25}
.rp-head{display:flex;gap:10px;align-items:center}
.rp-sw{width:28px;height:28px;flex:none;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.rp-hb{display:flex;flex-direction:column;gap:5px}
.rp-hr{display:grid;grid-template-columns:minmax(0,190px) minmax(40px,1fr) auto;gap:8px;align-items:center;font-size:14px}
.rp-hr b{font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.rp-hn{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-hr .bar{height:14px}
.rp-stack{display:flex;height:22px;border:2px solid var(--ink)}.rp-stack i{display:block;height:100%}.rp-stack i+i{border-left:1px solid var(--ink)}
.rp-mod3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rp-mod{font-size:14px;gap:3px}.rp-mod b{font-variant-numeric:tabular-nums;white-space:nowrap}
.rp-tot{border-top:2px solid var(--ink);padding-top:3px;margin-top:2px;font-weight:600}
.rp-whs{border:0;background:none;padding:0}
.rp-pp{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-bottom:1px dashed var(--line)}.rp-pp:last-child{border-bottom:0}
.rp-ppn{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.rp-ppn b{font-size:16px}
.rp-fx{line-height:1.35}
.rp-tr{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed var(--line);font-size:14px}.rp-tr:last-child{border-bottom:0}
.rp-inst{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.rp-inst .pill.ok{background:#e3f4d9}.rp-inst .pill.warn{background:#fff4c7}
.rp-ev{display:flex;flex-direction:column;gap:1px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:14px}
.mob .rp-mod3{grid-template-columns:minmax(0,1fr)}
.rp-scroll{overflow-x:auto}
.lnk{border:0;background:none;padding:0;font:inherit;color:#2f5fa0;text-decoration:underline;cursor:pointer;text-align:left}
.mob .rp-tiles,.mob .rp-tiles.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
.mob .rp-hr{grid-template-columns:minmax(0,120px) minmax(30px,1fr) auto}
.mob .rp-t b{font-size:21px}
.mob .rp-tabs button{flex:1 0 30%;font-size:14px;padding:10px 6px;border-bottom:2px solid var(--ink)}
.treebox{overflow-x:auto;padding:4px 2px 8px}
.tnode{position:absolute;display:flex;align-items:center;gap:7px;padding:4px 6px;text-align:left;border:2px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(22,32,46,.12),2px 2px 0 var(--ink);font-size:13px;line-height:1.2}
.tlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tlist .tnode{position:relative;min-height:64px;min-width:0}
.tlist .tnode b{hyphens:auto;overflow-wrap:anywhere}
.tnode .tn{display:flex;flex-direction:column;gap:2px;min-width:0}
.tnode b{font-size:13.5px;line-height:1.15}
.tnode span{font-size:12px}
.ttxt{font-style:italic;color:var(--ink4)}
.card.polon{background:#f1faf2}
.polreq{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center} .polchip{display:inline-flex;align-items:center;gap:4px}
.tnode[aria-pressed="true"]{outline:3px solid var(--yellow);outline-offset:1px}
.win-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;background:var(--ink);color:#fff;box-shadow:inset 0 -3px 0 var(--ink2), inset 0 2px 0 var(--ink3);cursor:move;user-select:none;touch-action:none}
.win-h h2{flex:1;margin:0;font-family:var(--f-disp);font-size:19px;font-weight:600}
.grip{width:10px;height:14px;background:radial-gradient(circle, #6b7a8e 1px, transparent 1.5px) 0 0/5px 5px}
.xbtn{width:30px;height:30px;border:2px solid var(--ink4);background:var(--ink3);color:#fff;font-family:var(--f-disp);font-size:13px;line-height:1;box-shadow:inset 0 -2px 0 #1d2a3b}
.win-b{padding:14px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;border-bottom:2px solid var(--ink);background:#dfe7ee;flex-wrap:wrap}
.tabs button{flex:1;padding:7px 9px;border:0;border-right:2px solid var(--ink);background:#dfe7ee;color:var(--muted);font-family:var(--f-disp);font-size:15px;max-width:100%;overflow-wrap:break-word}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
.card{padding:8px 10px;background:#fff;border:2px solid var(--ink);box-shadow:inset 0 -3px 0 var(--panel2);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.bad{background:#fff4f4;border-color:var(--bad-t);box-shadow:inset 0 -3px 0 #f6dede}
.card.pend{background:#fff9e3;box-shadow:inset 0 -3px 0 #f3e3a8}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.row > *{min-width:0}
.row > .btn,.row > button{flex:none;max-width:100%}  /* i pulsanti non si stringono sotto il loro testo */
.lab{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.sm{font-size:14px;color:var(--muted)}
.h3{margin:0;font-family:var(--f-disp);font-size:18px;font-weight:600}
.bar{height:10px;background:var(--panel2);border:1px solid var(--ink);flex:1;min-width:40px}
.bar i{display:block;height:100%;max-width:100%}
.btn{max-width:100%;overflow-wrap:break-word;padding:7px 12px;border:2px solid var(--ink);background:#fff;font-family:var(--f-disp);font-size:15px;box-shadow:inset 0 -3px 0 #c9d3dd, 2px 2px 0 var(--ink)}
.btn.pri{background:var(--accent);box-shadow:inset 0 -3px 0 var(--accent-d), inset 0 2px 0 var(--accent-l), 2px 2px 0 var(--ink);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm2{padding:4px 9px;font-size:14px;box-shadow:inset 0 -2px 0 #c9d3dd, 1px 1px 0 var(--ink)}
.pill{display:inline-block;padding:0 6px;font-size:13px;font-weight:600;border:1px solid var(--ink)}
.ok{color:var(--ok-t)} .warn{color:var(--warn-t)} .bad{color:var(--bad-t)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:3px 4px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:500}
table.t td.r,table.t th.r{text-align:right}
/* finestra Magazzini */
.wh-hero{background:var(--ink);color:#fff;border:2px solid var(--ink2);box-shadow:inset 0 -4px 0 var(--accent);padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.wh-hero .lab{color:var(--hi)}
.wh-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.wh-name{font:700 22px var(--f-disp);display:flex;align-items:center;gap:8px;min-width:0}
.wh-prov{font:600 13px var(--f-body);padding:1px 6px;background:var(--accent);color:var(--ink);border:2px solid #fff}
.wh-own{font-size:14px;color:var(--hi)}
.wh-occ{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px;white-space:nowrap}
.wh-occ b{font:700 20px var(--f-disp)}
.wh-occ .num{font-size:14px;color:var(--hi)}
.wh-bar{height:12px}
.wh-hero .wh-bar{flex:none;background:var(--ink3);border-color:var(--ink2)}
.wh-mgr{display:flex;align-items:center;gap:10px;margin-top:4px;padding-top:8px;border-top:2px dashed var(--ink3)}
.wh-mgr img,.wh-st img{width:40px;height:46px;background:#3a6db0;border:2px solid var(--ink);flex:none}
.wh-mgr .lab{flex:1}
.wh-warn{font-size:14px;color:#ff8a8d}
.wh-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

/* Schermata introduttiva: il camioncino porta il pallet dell'icona */
#intro:empty{display:none}
#intro{position:fixed;inset:0;z-index:90;overflow:hidden;cursor:pointer;color:#fff3c4;display:flex;flex-direction:column;align-items:stretch;transition:opacity .5s;background:linear-gradient(#141d2b 0 25%,#1d2a3b 25% 55%,#24344a 55%)}
#intro.out{opacity:0}
#intro .road{position:relative;flex:1 0 30%;background:#2a3a50;border-top:6px solid #16202e;box-shadow:inset 0 6px 0 #4a5f7a;padding:min(26px,4vh) 16px 12px}
#intro .road::after{content:'';position:absolute;left:0;right:0;bottom:22%;height:6px;background:repeating-linear-gradient(90deg,#ffd23f 0 36px,transparent 36px 72px);animation:introRoad .4s linear 6}
#intro .lane::before{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;background:#2a3a50;opacity:.7;clip-path:polygon(0 100%,0 60%,8% 20%,16% 55%,27% 10%,38% 50%,50% 0,61% 45%,72% 15%,84% 55%,93% 25%,100% 50%,100% 100%)}
#intro .ttl{position:relative;flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 16px 18px;text-align:center;opacity:0;animation:introPop .5s 2s forwards}
#intro h1{margin:0;font-family:var(--f-disp);font-size:min(clamp(56px,12vw,110px),14vh);line-height:.9;color:#ffd23f;text-shadow:6px 6px 0 #0c131d;letter-spacing:4px}
#intro .sub{font-family:var(--f-disp);font-size:min(clamp(20px,4vw,30px),6vh);margin-top:6px}
#intro .lane{position:relative;flex:none;width:100%;height:min(clamp(130px,24vw,230px),30vh);margin-bottom:-2px}
#intro .truck{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);animation:introIn 2.2s cubic-bezier(.2,.7,.3,1) forwards}
#intro .truck svg{height:100%;width:auto;display:block;animation:introBump .18s steps(2) 12;filter:drop-shadow(6px 6px 0 rgba(12,19,29,.55))}
#intro .puff{position:absolute;left:-2%;bottom:14%;width:5%;aspect-ratio:1;background:#c3d0dc;opacity:0;animation:introPuff .5s steps(3) 4}
#intro.go .truck{animation:introOut .7s cubic-bezier(.6,0,.9,.4) forwards}
#intro .bot{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:introPop .4s 2.4s forwards}
#intro .bot .btn{font-size:20px;padding:12px 26px}
#intro .ver{font-size:14px;color:#c3d0dc}
.land #intro .bot .btn{padding:8px 22px} .land #intro .ttl{padding-bottom:8px}
@keyframes introIn{from{transform:translateX(calc(-50vw - 110%))}to{transform:translateX(-50%)}}
@keyframes introOut{from{transform:translateX(-50%)}to{transform:translateX(60vw)}}
@keyframes introBump{50%{transform:translateY(-3%)}}
@keyframes introPuff{0%{opacity:.8;transform:translate(0,0)}100%{opacity:0;transform:translate(-120%,-60%) scale(1.6)}}
@keyframes introRoad{to{background-position:-72px 0}}
@keyframes introPop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){#intro *,#intro .truck svg{animation:none!important;opacity:1!important} #intro .truck{transform:translateX(-50%)!important}}

// icona di una policy: foglio del regolamento con bordo scuro e disegno 12x12
function polIcon(P,sz,dim){ let r=`<rect x="0" y="0" width="16" height="16" fill="#16202e"/><rect x="1" y="1" width="14" height="14" fill="#fff3c4"/><rect x="1" y="14" width="14" height="1" fill="#e8d9a0"/>`;
  P.ic.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')r+=`<rect x="${x+2}" y="${y+2}" width="1" height="1" fill="${TPAL[ch]}"/>`;}));
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 16 16" shape-rendering="crispEdges" style="flex:none;${dim?'filter:grayscale(1) opacity(.55)':''}" aria-hidden="true">${r}</svg>`; }
function techIcon(t,sz,dim){
  const F=TFRAME[t.tree], N=16; const cut=r=>{const d=Math.min(r,N-1-r);return F.cut[d]||0;};
  const ins=(x,y)=>y>=0&&y<N&&x>=cut(y)&&x<N-cut(y);
  let r='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ if(!ins(x,y))continue;
    const edge=!ins(x-1,y)||!ins(x+1,y)||!ins(x,y-1)||!ins(x,y+1);
    const ring=!edge&&(!ins(x-2,y)||!ins(x+2,y)||!ins(x,y-2)||!ins(x,y+2)||!ins(x-1,y-1)||!ins(x+1,y-1)||!ins(x-1,y+1)||!ins(x+1,y+1));
    r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${edge?'#16202e':ring?F.c:F.bg}"/>`; }
  (TECH_IC[t.id]||[]).forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')r+=`<rect x="${x+2}" y="${y+2}" width="1" height="1" fill="${TPAL[ch]}"/>`;}));

wk('riepilogo','basi','Riepilogo dell\'azienda',`La finestra con tutti i numeri dell'azienda in un colpo d'occhio: conti, operazioni, clienti, persone e ricerca.`,
`Si apre dal menu a sinistra. È divisa in sei schede:

Panoramica: [[cassa]], utile e [[ricavi]] del mese scorso, [[reputazione]], clienti, magazzini, dipendenti e gare vinte, con l'andamento della cassa e l'utile di ogni mese. Conti: ricavi e [[costi]] mese per mese, dove vanno i soldi, [[penali]] pagate e il [[conto|conto economico]] anno per anno. Operazioni: [[puntualita]], [[accuratezza]], [[saturazione|occupazione]] e [[morale]] medi, i pallet movimentati e una tabella magazzino per magazzino. Clienti: quanto rende ogni cliente, la sua [[soddisfazione]], le soglie dei contratti e le [[gare]] vinte e perse. Persone: chi lavora per te, [[manager]], [[direzione|dirigenti]], [[welfare|benefit]] e [[alberi|alberi delle tecnologie]]. Modificatori: da cosa dipendono oggi [[puntualita]], [[accuratezza]] e [[morale]] di ogni magazzino, voce per voce; i [[talenti]] del CEO, dei manager e dei dirigenti con i loro effetti; le [[tecnologie]] ricercate e dove sono installate; gli effetti degli [[eventi]] ancora in corso, con la data di scadenza.

I grafici si aggiornano alla fine di ogni mese, quando si chiudono i conti: ne servono almeno due per vedere una linea. I numeri di puntualità e accuratezza sono la media dei magazzini, non pesata sui volumi. Ogni riquadro si apre nell'enciclopedia.`);
wk('tempo','basi','Tempo e velocità',`Il gioco avanza un giorno alla volta. Spazio mette in pausa, i tasti 1 e 2 cambiano velocità (normale e veloce).`,
`Ogni giorno il gioco ricalcola tutti i magazzini: [[puntualita]], [[accuratezza]], [[morale]], costi e ricavi. Ogni lunedì arriva il [[report]] della settimana, alla fine di ogni mese si chiudono i conti: [[soddisfazione]] dei clienti, [[penali]], [[conto|conto economico]] e prezzo del [[gasolio]].

Quando compare un [[eventi|evento]] o un messaggio importante il tempo si ferma da solo finché non rispondi.`);
wk('ceo','basi','CEO',`Sei tu: il personaggio scelto all'inizio, con le sue sei abilità e tre talenti.`,
`Il CEO conta in tutta l'azienda con due abilità: la [[st_neg|Negoziazione]] pesa nelle [[gare]] e l'[[st_inn|Innovazione]] accorcia le [[ricerca|ricerche]]. All'inizio guida anche il primo magazzino come [[manager]]: lì contano le sue [[st_op|Operazioni]], [[st_prec|Precisione]] e [[st_lead|Leadership]].

I [[talenti]] del CEO cambiano le abilità e a volte aprono scelte speciali negli [[eventi]]. Il CEO costa 4.000 € al mese di compenso.`);
wk('cassa','basi','Cassa',`I soldi in banca. Se a fine mese sono sotto i −50.000 € l'azienda fallisce.`,
`La cassa sale ogni giorno con i [[ricavi]] e scende con i [[costi]]. Le spese una tantum (assunzioni, ricerche, installazioni, apertura di un magazzino) si pagano subito.

Andare sotto zero è permesso, ma il controllo arriva a fine mese: sotto i −50.000 € i libri vanno in tribunale e la partita finisce.`);
wk('reputazione','basi','Reputazione',`Quanto è stimata l'azienda nel settore, da 0 a 100. Aiuta a vincere le gare e ad assumere più in fretta.`,
`Nelle [[gare]] ogni punto sopra 50 vale +0,4 al punteggio (e sotto 50 toglie). Nelle [[assunzioni]] una reputazione alta accorcia i tempi.

Sale di 0,15 al mese per ogni cliente servito sopra le [[soglie]], quando vinci una [[gare|gara]] (da +6 per una committente S a +1 per una C; una F toglie 1), di 3 punti quando apri un nuovo [[magazzino]] e di 5 con le ricerche [[tech_marketing|Marketing e fiere]] (più 0,2 al mese) e [[tech_iso|Certificazione ISO 9001]]. Scende quando un cliente disdice per servizio scadente, da 1 a 10 punti secondo il suo [[rank]], e quando sei tu a [[recesso|recedere]] da un contratto. Molti [[eventi]] la muovono in un senso o nell'altro.`);
wk('eventi','basi','Eventi',`Imprevisti con una scelta da fare: meteo, politica, clienti, personale. Ne arriva uno ogni 30-55 giorni.`,
`Quando arriva un evento il tempo si ferma: la finestra racconta cosa è successo e, se c'entra un cliente o un magazzino, li mostra in alto. Ogni risposta dice cosa fai e, sotto, quali sono gli effetti sul gioco. Alcune risposte sono disponibili solo con un'abilità alta o con un certo [[talenti|talento]]: il pulsante ti dice cosa serve.

Il risultato della scelta non arriva subito: passa un giorno, poi una finestra racconta com'è andata e applica gli effetti. Se nel frattempo salvi ed esci, la scelta resta in sospeso e arriva quando riprendi.

Gli effetti possono essere immediati (soldi, [[reputazione]], [[soddisfazione]]) oppure durare qualche settimana ([[morale]], [[puntualita]], [[accuratezza]]). Lo stesso evento non torna prima di 240 giorni.`);
wk('giornale','basi','Il giornale',`L'archivio delle notizie: gare, contratti, ricerche concluse, scelte fatte negli eventi.`,
`La Gazzetta del Muletto e Il Sole 24 Pallet raccontano cosa succede alla tua azienda e al mercato. Utile per ricordare chi ha vinto una [[gare|gara]] che hai perso e cosa hai deciso negli [[eventi]].`);
wk('mappa','basi','Mappa',`Il Nord Italia in pixel art, da Nizza a Trieste: magazzini, città servite e camion in viaggio.`,
`Trascina per spostarti e usa la rotellina per lo zoom (sul telefono: un dito per spostarti, due dita per lo zoom). Sono giocabili le otto regioni del Nord: Piemonte, Valle d'Aosta, Lombardia, Liguria, Trentino-Alto Adige, Veneto, Friuli-Venezia Giulia ed Emilia-Romagna. Il resto d'Italia è grigio.

Clicca un [[magazzino]] per aprirlo. Dalla finestra Clienti puoi mostrare sulla mappa la [[zona]] di distribuzione di un cliente e il percorso del [[ritiro]].`);
wk('espansione','basi','Espansione',`Affittare un nuovo magazzino: due mesi di affitto anticipati più 15.000 € di allestimento.`,
`Un nuovo [[magazzino]] parte vuoto: servono il suo [[personale]] (magazzinieri, carrellisti, impiegati, autisti e un [[facility|facility manager]]), un [[manager]] e soprattutto clienti dalle [[gare]]. Aprirlo dà +3 di [[reputazione]]. Puoi anche [[ampliamento|ampliare]] un magazzino che hai già.

Conviene espandersi quando il magazzino attuale supera l'85% di [[saturazione|occupazione]] o quando una gara importante è in una zona lontana.`);
wk('magazzino','basi','Magazzino',`Il capannone dove stanno i pallet dei clienti. Ognuno ha i suoi posti, il suo personale e le sue tecnologie.`,
`Ogni magazzino ha un numero di posti pallet (la capienza), un [[manager]], il suo [[personale]], un [[morale]] e le [[installazione|tecnologie installate]]. Da questi nascono la sua [[puntualita]] e la sua [[accuratezza]], che valgono per tutti i clienti serviti lì.

Il magazzino del CEO è di proprietà, gli altri sono in affitto: in entrambi i casi paghi ogni mese un costo fisso più 1.000 € di utenze e, se c'è il [[facility|facility manager]], la manutenzione ordinaria. Lo [[manutenzione|stato del magazzino]] dice quanto è in salute l'immobile.`);
// KPI
wk('puntualita','kpi','Puntualità',`Percentuale di consegne arrivate in orario. Dipende soprattutto dalle Operazioni del manager e dagli autisti.`,
`Si parte da 92% e poi si somma:
• +0,4 per ogni punto di [[st_op|Operazioni]] del [[manager]] sopra 10 (sotto 10 toglie);
• le [[tecnologie]] installate (GPS, rotte, radiofrequenza…);
• il [[dir_op|direttore operativo]];
• i [[canali]] dei clienti (la GDO toglie, l'industria aggiunge) e i pulmini dei [[welfare_mag|servizi di welfare]];
• gli effetti degli [[eventi]] e di alcuni [[talenti]] di chi guida il magazzino.

Si perde molto se gli [[autisti]] non bastano (−20 punti per ogni 100% di lavoro in eccesso), meno se mancano [[carrellisti]] (−8) o [[magazzinieri]] (−3). Ogni [[impiegati|impiegato]] che manca nel magazzino toglie 1,5 punti, ogni [[pianificatori|pianificatore del traffico]] che manca in sede ne toglie 2 in tutti i magazzini. Con un [[obiettivo_sat|obiettivo di saturazione]] alto i camion aspettano il carico completo e la puntualità scende un po'. Il valore resta tra 50% e 99,9%.

Passa il mouse sul riquadro Puntualità di un magazzino per vedere il calcolo voce per voce.`);
wk('accuratezza','kpi','Accuratezza',`Percentuale di ordini spediti senza errori (articolo giusto, quantità giusta). Dipende dalla Precisione del manager.`,
`Si parte da 96% e poi si somma:
• +0,3 per ogni punto di [[st_prec|Precisione]] del [[manager]] sopra 10;
• +0,04 per ogni punto di [[morale]] sopra 60;
• le [[tecnologie]] installate (barcode, WMS, pick-to-light…) e la [[tech_iso|certificazione ISO]].

Cala quando il magazzino è troppo pieno (oltre l'85% di [[saturazione|occupazione]] gli scaffali diventano un labirinto), quando i [[magazzinieri]] non bastano (meno se mancano i [[carrellisti]]), per ogni [[impiegati|impiegato]] o [[capoturno]] che manca, con la [[cooperativa]], con i [[canali]] a colli e a pezzo (dettaglio, e-commerce) e durante l'inventario di un cliente in [[recesso|uscita]]. Puntualità e accuratezza sono separate apposta: un cliente può chiederne una sola. Vedi [[otif]].`);
wk('soglie','kpi','Soglie KPI',`I livelli minimi di Puntualità e Accuratezza scritti nel contratto di ogni cliente.`,
`Ogni cliente ha la sua soglia di [[puntualita]] e, se gli interessa, di [[accuratezza]] ("non richiesta" vuol dire che non la controlla). La farmaceutica pretende il 99,5% di accuratezza, il pastificio si accontenta di arrivare in tempo.

Nei report i colori dicono come stai: verde sopra la soglia, giallo fino a 2 punti sotto, rosso oltre. In un magazzino con più clienti conta la soglia più severa. A fine mese il confronto decide la [[soddisfazione]].`);
wk('soddisfazione','kpi','Soddisfazione del cliente',`Quanto il cliente è contento di te, da 0 a 100. Sotto 25 disdice il contratto.`,
`Parte da 60. A fine mese si confrontano la puntualità e l'accuratezza medie del mese con le [[soglie]]:
• sopra soglia: +3 (+1 con [[tech_edi|EDI]], +1 con [[tech_kam|Key account]]);
• fino a 2 punti sotto: −4;
• più di 2 punti sotto: −10.

Se il contratto lo prevede, ogni punto sotto soglia costa anche una [[penali|penale]].

Sotto 25 il cliente se ne va e perdi [[reputazione]] (da 1 a 10 punti secondo il [[rank]]). Alla scadenza del [[contratto]] rinnova solo se la soddisfazione è almeno 50 (40 con il [[tech_kam|Key account management]]).`);
wk('penali','kpi','Penali',`Multa prevista da alcuni contratti quando i KPI del mese sono sotto la soglia: una percentuale del fatturato del cliente per ogni punto mancante.`,
`Non tutti i clienti le prevedono: la clausola si legge nella [[gare|gara]] e nella scheda del cliente. Chi le ha chiede dall'1% (piccoli clienti) al 5% (aerospaziale) del fatturato mensile per ogni punto di [[puntualita]] o [[accuratezza]] sotto la [[soglie|soglia]], sommando i due KPI, fino a un massimo del 20%. Le più severe sono quelle dei grandi clienti, della farmaceutica e dei freschi.

Esempio: contratto al 3%, puntualità 1,5 punti sotto e accuratezza 0,5 sotto → 2 punti × 3% = 6% del fatturato del mese.

Si pagano a fine mese e compaiono nel [[conto|conto economico]]. La [[soddisfazione]] cala comunque, penale o no. Diverse dalla penale di [[recesso]], che si paga per uscire prima della scadenza.`);
wk('saturazione','kpi','Occupazione del magazzino',`Quanto è pieno il magazzino: posti pallet occupati diviso posti disponibili.`,
`Un magazzino pieno rende, ma oltre l'85% di occupazione l'[[accuratezza]] cala in fretta: −2,5 punti ogni 10% in più. Le barre diventano gialle dal 70% e rosse dall'85%.

Da non confondere con la [[saturazione_mezzi|saturazione dei mezzi]], che misura quanto sono pieni i camion.

Non puoi fare un'offerta in una [[gare|gara]] se la merce del nuovo cliente non ci sta. Il [[tech_verticale|magazzino verticale]] aggiunge il 20% di posti.`);
wk('saturazione_mezzi','kpi','Saturazione dei mezzi',`Quanto sono pieni in media i camion che escono dal magazzino: pallet caricati diviso capienza (33 pallet).`,
`Si parte dal 48%: ogni cliente ha i suoi camion e spesso partono mezzi vuoti. Il mix dei [[canali]] sposta la base: la GDO riempie i bilici, l'horeca manda in giro furgoni mezzi vuoti. Più alta è la saturazione, meno viaggi servono per gli stessi pallet: meno km, meno gasolio e meno [[autisti]]. Il ricavo invece non cambia, perché il cliente paga a pallet: tutto il risparmio è margine.

Senza sforzo la saturazione sale con il [[tech_gps|GPS]] (+2), la [[tech_rotte|pianificazione rotte]] (+5) e soprattutto con la [[tech_sinergia|sinergia in pianificazione]], che mette sullo stesso camion la merce di clienti diversi: +7 per ogni cliente oltre il primo, fino a +30, moltiplicato per l'**affinità** media tra i clienti (quanta parte dei pallet va sugli stessi [[canali]]). Due fornitori di bar si dividono i giri; un supermercato e un negozio online quasi per niente.

Per andare oltre serve un [[obiettivo_sat|obiettivo minimo]] imposto dalla direzione. Massimo 95%. Per i furgoni la capienza si conta in colli, ma il conto è lo stesso.`);
wk('obiettivo_sat','kpi','Obiettivo minimo di saturazione',`Il livello minimo di saturazione dei mezzi che la direzione impone a un magazzino. Raggiungerlo costa sempre qualcosa.`,
`Lo scegli nella finestra del [[magazzino]], nella parte dei trasporti. Se l'obiettivo è sopra il carico che viene da sé, il personale deve aspettare i carichi completi e incastrare le consegne:

• la [[puntualita]] perde 0,06 punti per ogni punto di saturazione in più (camion che aspettano il carico);
• il personale arriva fin dove glielo permette la **capacità di pianificazione** = saturazione naturale + 1,2·([[st_op|Operazioni]] del [[manager]] − 10) + 0,25·([[morale]] − 60) + 8 per ogni [[impiegati|impiegato]] in più del necessario (fino a 3; tolti 8 per ognuno che manca);
• se la capacità supera l'obiettivo, va anche meglio: si prende il 35% della differenza in più;
• se non basta, la saturazione si ferma alla capacità e il morale obiettivo cala di 0,5 per ogni punto che manca. La finestra ti dice quanti impiegati in più servirebbero.

Un buon manager, un ufficio ben fornito e un morale alto possono portare i camion all'80-90%. Una squadra stanca e sotto organico no, e la direzione lo scopre a fine mese.`);
wk('morale','kpi','Morale',`L'umore del personale di un magazzino, da 0 a 100. Cambia lentamente.`,
`Ogni magazzino ha un morale che si avvicina piano piano a un valore obiettivo. L'obiettivo parte da 58 e sale con la [[st_lead|Leadership]] del [[manager]] (+0,6 per punto sopra 10), i [[welfare|benefit aziendali]], i [[welfare_mag|servizi di welfare]] del magazzino, alcune [[tecnologie]] e il [[dir_hr|direttore HR]]. Scende se il personale è sovraccarico e dopo i [[licenziamenti]].

Il morale alto rende i [[magazzinieri]] più produttivi e alza l'[[accuratezza]]. Verde da 60, giallo da 45, rosso sotto.`);
wk('report','kpi','Report KPI settimanale',`Il foglio di calcolo che arriva ogni lunedì con i numeri della settimana appena chiusa.`,
`Una scheda per il riepilogo, una per ogni [[magazzino]] e una per i clienti. Clicca una cella per vedere nella barra della formula come è calcolata; passa sui grafici per leggere i valori di ogni settimana. Le linee tratteggiate sono le [[soglie]] dei clienti.`);
// Abilità
wk('abilita','abil','Abilità',`Sei numeri che descrivono ogni personaggio. 10 è la media, da 15 in su è ottimo.`,
`Ogni persona ha [[st_op|Operazioni]], [[st_prec|Precisione]], [[st_neg|Negoziazione]], [[st_lead|Leadership]], [[st_amm|Amministrazione]] e [[st_inn|Innovazione]], ognuna con il suo colore e la sua icona. Contano in modo diverso a seconda del posto: un [[manager]] di magazzino usa Operazioni, Precisione e Leadership; un [[direzione|direttore]] usa solo l'abilità del suo ruolo; il [[ceo|CEO]] usa Negoziazione e Innovazione per tutta l'azienda.

I [[talenti]] sono già compresi nei numeri che vedi.`);
const STAT_TXT={
 op:`Nel [[manager]] di un magazzino alza la [[puntualita]]: +0,4 per ogni punto sopra 10, e toglie altrettanto sotto. Nel [[dir_op|direttore operativo]] vale +0,15 di puntualità in tutti i magazzini per ogni punto sopra 10.`,
 prec:`Nel [[manager]] di un magazzino alza l'[[accuratezza]]: +0,3 per ogni punto sopra 10. Utile soprattutto con i clienti esigenti come farmaceutica ed elettronica.`,
 neg:`Quella del [[ceo|CEO]] pesa in ogni [[gare|gara]]: +1 al punteggio per ogni punto sopra 10. Il [[dir_comm|direttore commerciale]] aggiunge +0,8 per punto. Negli [[eventi]] con i clienti apre risposte migliori.`,
 lead:`Nel [[manager]] di un magazzino alza il [[morale]] obiettivo: +0,6 per ogni punto sopra 10. Il [[dir_hr|direttore HR]] lo alza in tutti i magazzini e accorcia le [[assunzioni]]. Negli [[eventi]] con il personale apre risposte migliori.`,
 amm:`Il [[dir_fin|direttore finanziario]] taglia i [[costi]] fissi dello 0,5% per ogni punto sopra 10. Negli [[eventi]] con fisco, banche e burocrazia apre risposte migliori.`,
 inn:`Quella del [[ceo|CEO]] accorcia le [[ricerca|ricerche]]: −3% di tempo per ogni punto sopra 10 (fino a −40%). Se il [[dir_tech|direttore tecnologia]] ne ha di più, si usa la sua. Negli [[eventi]] tecnologici apre risposte migliori.`
};
STATS.forEach(s=>wk('st_'+s.k,'abil',s.n,s.d,STAT_TXT[s.k],sz=>statIcon(s.k,sz)));
// Talenti
wk('talenti','tal','Talenti',`Tratti di carattere, mostrati come icone. Cambiano le abilità e a volte aprono scelte speciali.`,
`Ogni personaggio ha uno o più talenti. Il colore del riquadro dice se è positivo (verde), negativo (rosso) o misto (giallo). Passa il mouse su un'icona per leggere l'effetto e la sua piccola storia.

Gli effetti sulle [[abilita|abilità]] sono già sommati nei numeri. Alcuni talenti hanno anche un effetto proprio:
• «nel magazzino che guida»: vale solo nel [[magazzino]] di cui il personaggio è [[manager]] (anche il CEO, se lo guida lui): [[morale]], [[puntualita]], costi dell'immobile, tempi di [[apprendimento]];
• «da CEO»: vale se il talento è del CEO, per esempio nelle [[gare]] o nelle [[assunzioni]];
• alcuni aprono scelte speciali negli [[eventi]], e quasi tutti i tratti di carattere hanno un evento tutto loro.

Le voci si leggono nella scheda Modificatori del Riepilogo.

Un tipo speciale di talento è il [[titoli|titolo di studio]]: chi [[crea_ceo|crea il proprio CEO]] ne sceglie uno.`);
wk('titoli','tal','Titoli di studio',`Talenti che raccontano la scuola o l'università del personaggio. Il CEO creato dal giocatore ne ha esattamente uno.`,
`Dalla licenza media al dottorato di ricerca, passando per il ragioniere, il perito, l'ingegnere e le lauree umanistiche. Ogni titolo sposta qualche punto tra le [[abilita|abilità]]: chi ha studiato ingegneria guadagna in Innovazione ma perde in Leadership, chi ha fatto lettere tratta meglio ma conosce poco il magazzino.

Alcuni titoli tecnici (perito informatico, ingegnere informatico) accorciano anche l'[[apprendimento]] delle tecnologie nel magazzino che il personaggio guida.

Quando [[crea_ceo|crei il tuo CEO]] il saldo dei punti del titolo (bonus meno malus) si paga con i punti da distribuire.`);
wk('crea_ceo','basi','Creare il proprio CEO',`Nella schermata iniziale puoi creare un CEO tuo, passo per passo: identità, abilità, studi e carattere, poi il curriculum da confermare.`,
`Nella schermata iniziale scegli la quinta scheda, «Crea il tuo CEO». La creazione è divisa in passaggi, e puoi sempre tornare indietro:

1. **Identità**: nome, cognome, età e ritratto; soprannome e motto sono facoltativi. Il pulsante «Suggerisci» propone nome e cognome, un soprannome o un motto. Soprannome e motto compaiono nella finestra dell'azienda.
2. **Abilità**: hai 58 punti. Ogni punto in un'[[abilita|abilità]] costa 1 (minimo 1, massimo 18 prima dei talenti).
3. **Studi e carattere**: il [[titoli|titolo di studio]] è obbligatorio, uno solo; poi fino a 3 [[talenti]] a scelta.
4. **Curriculum**: il riepilogo in formato europeo. Se è tutto vero lo confermi, altrimenti torni a correggere.

I talenti si pagano con gli stessi punti: un talento con Operazioni +3 e Leadership −1 costa 2 punti, un talento con soli malus te ne restituisce. Ogni talento è una scheda con l'icona, gli effetti, il testo di colore e, a destra, il badge del costo: rosso se costa, verde se restituisce punti, grigio se è gratis. Il valore finale di un'abilità va da 0 a 20.

Dopo il curriculum si passa alla [[fondazione]] dell'azienda, dove scegli anche il **punto di partenza**: il magazzino, la cassa e il cliente storico di uno dei quattro CEO già pronti.`);
wk('fondazione','basi','Fondare l\'azienda',`Prima di iniziare scegli nome, logo, claim e colore della tua azienda e la iscrivi alla Camera di Commercio.`,
`Con qualunque CEO, prima della partita c'è la scheda dell'azienda:
• **Nome**: quello che leggono clienti e giornali («Suggerisci» ne propone uno, spesso col cognome del CEO);
• **Logo**: un'icona tra otto, sul colore aziendale; compare nella barra in alto e nella finestra dell'azienda;
• **Claim**: lo slogan sull'insegna, facoltativo (il pulsante «Suggerisci» ne propone uno);
• **Colore**: tinge i pulsanti dell'interfaccia e lo sfondo del logo.

Alla fine arriva la visura della Camera di Commercio, Industria, Artigianato e Bancali del Nord: un timbro e l'azienda è iscritta. Nome, logo e claim sono solo d'immagine: non cambiano i numeri del gioco.`);
const TAL_ID={}; Object.keys(TALENTS).forEach((n,i)=>{TAL_ID[n]='tal_'+i; const t=TALENTS[n];
  wk('tal_'+i,'tal',n,t.fx,`${t.fx.split(' · ').join('\n• ').replace(/^/,'• ')}\n\n*${t.fl}*\n\nTipo: ${TTYPE[t.t][0].toLowerCase()}.${t.edu?' È un [[titoli|titolo di studio]].':''} Vedi [[talenti]].`,sz=>talentSvg(t.ic,sz));});
// Personale
wk('personale','pers','Personale',`Sette figure per ogni magazzino (magazzinieri, carrellisti, capiturno, impiegati, autisti B e CE, facility manager) più i pianificatori del traffico in sede.`,
`Ogni magazzino ha il suo organico, e ogni mestiere fa un lavoro diverso:
• [[magazzinieri]]: preparano gli ordini, pesano sull'[[accuratezza]];
• [[carrellisti]]: muovono i pallet col muletto, pesano sulla [[puntualita]];
• [[capoturno|capiturno]]: uno ogni 10 operai, tengono su morale e accuratezza;
• [[impiegati]]: bolle, inventari e traffico, un po' su entrambi i KPI;
• [[autisti_ce|autisti con patente CE]]: bilici e motrici, tratte lunghe e ritiri;
• [[autisti_b|autisti con patente B]]: furgoni, consegne in città e ultimo miglio;
• [[facility|facility manager]]: uno per magazzino, manutenzione e cantieri.

In sede lavorano i [[pianificatori]] del traffico, che servono a tutti i magazzini. Magazzinieri e carrellisti si possono anche prendere da una [[cooperativa]].

Ogni cliente ha i suoi [[canali]] di distribuzione, che decidono se servono bilici o furgoni, quindi vincere una [[gare|gara]] cambia chi devi [[assunzioni|assumere]]. La finestra Personale mostra l'organico di tutti i magazzini con il [[carico|carico di lavoro]] di ogni reparto.`);
wk('carico','pers','Carico di lavoro',`Quanto è sotto sforzo un reparto: fino all'85% va tranquillo, al 100% è al limite, oltre è in affanno e i KPI scendono. Nessuno ti dice quanti assumere: lo decidi tu.`,
`Il carico confronta il lavoro da fare con quello che le persone riescono a fare in un mese:
• [[magazzinieri]]: pallet da preparare, circa 900 a testa;
• [[carrellisti]]: [[movimenti]], circa 1.800 a testa;
• [[autisti_ce|autisti CE]] e [[autisti_b|autisti B]]: km da guidare, circa 5.200 e 4.000 a testa;
• [[impiegati]]: uno fisso più uno ogni 1.500 pallet consegnati (2.000 con il [[tech_gestionale|gestionale]]);
• [[capoturno|capiturno]]: uno ogni 10 tra magazzinieri e carrellisti, sotto i 10 ci pensa il [[manager]].
La produttività sale e scende con il [[morale]], le [[tecnologie]] e lo [[manutenzione|stato del magazzino]], quindi il carico cambia anche senza nuovi clienti.

Verde fino all'85%, giallo fino al 100%, rosso oltre: in rosso calano [[puntualita]] e [[accuratezza]] e anche il morale. Nella scheda di una [[gare|gara]] vedi il carico che avresti con il personale di oggi se vinci: sta a te decidere se assumere prima, dopo o tenere la squadra un po' tirata per risparmiare. Il punto esclamativo sul menu Magazzini si accende quando un reparto è in affanno o manca il [[facility|facility manager]].`);
wk('magazzinieri','pers','Magazzinieri',`Preparano gli ordini: prelevano i colli e compongono i pallet in uscita. Ognuno ne prepara circa 900 al mese.`,
`Un magazziniere prepara circa 900 pallet al mese con un [[morale]] di 70 (meno con i [[canali]] a colli e a pezzo: dettaglio, horeca, e-commerce), di più con le [[tecnologie]] di produttività (radiofrequenza, pick-to-light, robot).

Se non bastano crolla soprattutto l'[[accuratezza]] (−8 punti per ogni 100% di lavoro in eccesso), un po' la [[puntualita]], e il personale si stanca. Costano 18.000 € lordi l'anno, cioè circa 2.130 € al mese di [[costo_azienda|costo aziendale]].`);
wk('carrellisti','pers','Carrellisti',`Guidano il muletto: scaricano i camion, mettono a scaffale e caricano. Ognuno fa circa 1.800 movimenti al mese.`,
`Ogni pallet consegnato fa due [[movimenti]]: entrata e uscita. Col muletto un carrellista ne fa il doppio di un [[magazzinieri|magazziniere]], circa 1.800 al mese con un [[morale]] di 70, di più con le [[tecnologie]] di produttività.

Se non bastano i camion aspettano in banchina: cala la [[puntualita]] (−8 punti per ogni 100% di lavoro in eccesso) e un po' l'[[accuratezza]] (pallet urtati e messi nel posto sbagliato). Serve il patentino del muletto, per questo costano 19.500 € lordi l'anno.`);
wk('impiegati','pers','Impiegati di magazzino',`L'ufficio del magazzino: bolle, inventari, prenotazione delle consegne, traffico. Ne servono di più con più volume.`,
`In ogni magazzino ne serve uno, più uno ogni 1.500 pallet al mese consegnati (2.000 con il [[tech_gestionale|gestionale]]). Ogni impiegato che manca toglie 1,5 punti di [[puntualita]] e 1 di [[accuratezza]] in quel magazzino.

Costano 22.000 € lordi l'anno.`);
wk('facility','pers','Facility manager',`Si occupa dell'immobile: manutenzione, guasti e cantieri. Ne serve uno per magazzino.`,
`Con un facility manager lo [[manutenzione|stato del magazzino]] risale di circa 3,6 punti al mese fino al 100%, e si paga la manutenzione ordinaria (0,25 € per posto pallet al mese). Senza, lo stato scende ogni giorno e a fine mese c'è il 18% di probabilità di un guasto (−8 punti).

Serve anche per la manutenzione straordinaria e per l'[[ampliamento]]. Stipendio: 30.000 € lordi l'anno.`);
wk('manutenzione','basi','Stato del magazzino',`Da 0 a 100. Sotto il 70% il magazzino perde posti pallet e produttività. Lo tiene alto il facility manager.`,
`Ogni magazzino parte al 100%. Senza [[facility|facility manager]] scende di circa 1,8 punti al mese, di più quando è molto pieno ([[saturazione|occupazione]] oltre il 60%), e capitano guasti. Con il facility manager risale di 3,6 punti al mese.

Sotto il 70% perdi lo 0,6% di posti pallet e di produttività per ogni punto mancante: a 40% sono −18%. Se i posti scendono sotto la merce dei clienti, l'occupazione supera il 100% e l'[[accuratezza]] crolla.

La manutenzione straordinaria riporta subito lo stato al 100%: costa 12 € per posto pallet ogni 100 punti mancanti, e serve il facility manager.`);
wk('ampliamento','basi','Ampliamento',`Il magazzino può crescere di un quarto dei posti iniziali, fino a 3 volte. Serve il facility manager.`,
`Ogni ampliamento aggiunge il 25% dei posti pallet iniziali del sito, costa 120 € per posto nuovo e dura 90 giorni. Durante il cantiere la produttività cala del 5%. Finiti i lavori l'affitto (o il costo fisso, se il magazzino è tuo) sale di un quarto di quello iniziale. Si può ampliare al massimo 3 volte.`);
wk('capoturno','pers','Capoturno',`Coordina la squadra di magazzino: ne serve uno ogni 10 tra magazzinieri e carrellisti.`,
`Sotto i 10 operai il turno lo organizza il [[manager]]. Poi serve un capoturno ogni 10 tra [[magazzinieri]] e [[carrellisti]]. Ognuno che manca toglie 4 punti al [[morale]] obiettivo e 1 punto di [[accuratezza]].

Costano 25.000 € lordi l'anno: di solito è il magazziniere più anziano, quello che sa dov'è tutto senza guardare il [[wms|WMS]].`);
wk('pianificatori','pers','Pianificatori del traffico',`In sede organizzano i giri dei camion di tutti i magazzini. Ne serve uno ogni 80 viaggi al mese.`,
`Finché l'azienda fa meno di 80 viaggi al mese i giri li organizza il [[ceo|CEO]]. Poi serve un pianificatore ogni 80 viaggi (distribuzione più [[ritiro|ritiri]], tutti i magazzini insieme).

Ognuno che manca toglie 2 punti di [[puntualita]] in tutti i magazzini. Con la squadra al completo i giri sono ottimizzati e i km costano il 4% in meno. Costano 26.000 € lordi l'anno.`);
wk('cooperativa','pers','Cooperativa di facchinaggio',`Magazzinieri e carrellisti forniti da una cooperativa: costano meno e arrivano subito, ma lavorano peggio e portano guai.`,
`Si attiva per ogni magazzino con la casella nella sua finestra. Con la cooperativa:
• [[magazzinieri]] e [[carrellisti]] costano il 20% in meno;
• arrivano in 3 giorni, senza costi di ricerca, e si mandano via gratis, senza buonuscita né calo di [[morale]];
• il morale obiettivo scende di 3 punti e l'[[accuratezza]] di 0,5: la squadra cambia di continuo, e con i clienti più esigenti mezzo punto pesa;
• arrivano [[eventi]] a tema: scioperi, controlli dell'Ispettorato del lavoro, cooperative che spariscono nel nulla.

Passare alla cooperativa abbassa il morale di 5 punti per un mese. Tornare ad assumere direttamente costa 600 € a persona e alza il morale di 5. [[capoturno|Capiturno]], [[impiegati]] e autisti restano sempre dipendenti.`);
wk('autisti','pers','Autisti',`Due patenti, due mestieri: la CE per bilici e tratte lunghe, la B per i furgoni in città.`,
`I km da fare dipendono dalla [[zona]] di distribuzione dei clienti e dai viaggi di [[ritiro]]. Le consegne con i furgoni le fanno gli [[autisti_b|autisti con patente B]]; tutto il resto, ritiri compresi, gli [[autisti_ce|autisti con patente CE]].

Se gli autisti non bastano la [[puntualita]] crolla: −20 punti per ogni 100% di lavoro in eccesso.`);
wk('autisti_ce','pers','Autisti patente CE',`Guidano bilici e motrici: ognuno copre circa 5.200 km al mese. Sono i più difficili da trovare.`,
`Servono la patente CE e la carta di qualificazione (CQC). Fanno le distribuzioni dei clienti che vogliono i bilici e tutti i viaggi di [[ritiro]].

Ognuno guida una [[motrici|motrice]]. Costano 23.000 € lordi l'anno più 1.100 € al mese di spese del mezzo. In Italia ne mancano davvero: un'[[assunzioni|assunzione]] richiede 3-6 settimane, quindi assumi appena vinci una gara.`);
wk('autisti_b','pers','Autisti patente B',`Guidano i furgoni fino a 3,5 tonnellate: consegne in città, negozi, farmacie, e-commerce. Ognuno copre circa 4.000 km al mese.`,
`Servono ai [[canali]] con tante consegne piccole: horeca, dettaglio ed e-commerce. Il traffico e le soste fanno meno km al giorno di un bilico.

Costano 19.000 € lordi l'anno più 900 € al mese di furgone in leasing, e il furgone consuma la metà. Si trovano in fretta (2-3 settimane con l'annuncio), ma cambiano lavoro spesso.`);
wk('manager','pers','Manager di magazzino',`Il capo di un magazzino. Le sue Operazioni, Precisione e Leadership decidono i KPI e il morale.`,
`Il manager usa tre [[abilita|abilità]]: [[st_op|Operazioni]] per la [[puntualita]], [[st_prec|Precisione]] per l'[[accuratezza]] e [[st_lead|Leadership]] per il [[morale]]. Anche i suoi [[talenti]] con l'effetto «nel magazzino che guida» contano lì. Senza manager il magazzino va avanti con valori scarsi (7, 7 e 6).

All'inizio il manager è il [[ceo|CEO]]. Gli altri si assumono dalla finestra Personale e si assegnano dal menu a tendina del magazzino. Un manager senza magazzino può diventare un [[direzione|direttore]].`);
wk('welfare_mag','pers','Servizi di welfare',`Servizi per chi lavora in un magazzino: dai boccioni d'acqua alla mensa, dalla palestra all'asilo, fino all'area cani. Si ricercano nell'albero Welfare e si installano sito per sito.`,
`Ogni servizio si ricerca una volta nell'albero Welfare della finestra Tecnologia, poi si [[installazione|installa]] nei magazzini che vuoi, con un costo iniziale e un canone al mese. Funziona da subito, senza [[apprendimento]].

Alza il [[morale]] di quel magazzino e la sua [[attrattivita|attrattività]]: le [[assunzioni]] per quel magazzino sono più veloci. Alcuni danno qualcosa in più: mensa e raffrescatori la produttività, i pulmini la [[puntualita|puntualità]], lavanderia, presidio medico e corsi di italiano l'[[accuratezza]]. Con la [[tech_welfare2|Piattaforma welfare]] il canone costa il 30% in meno. Installazione e canone finiscono nella voce Welfare del [[conto|conto economico]].

È diverso dai [[welfare|benefit aziendali]] (buoni pasto, assicurazione, premio), che valgono per tutti i dipendenti e si pagano a testa.`);
wk('attrattivita','pers','Attrattività',`Quanto l'azienda piace a chi cerca lavoro. Più è alta, più le assunzioni sono rapide.`,
`Parte da 45 e sale con i [[welfare|benefit aziendali]], la [[reputazione]] (metà dei punti sopra 50) e i [[welfare_mag|servizi di welfare]] installati nel magazzino in cui assumi; l'[[tech_academy|Academy aziendale]] aggiunge 5 punti ovunque. A 55 i tempi di [[assunzioni|assunzione]] sono quelli base; ogni punto in più o in meno li cambia del 2,5%, da −40% a +80%.`);
wk('assunzioni','pers','Assunzioni',`Annuncio (economico ma lento) o agenzia interinale (veloce ma cara). Il nuovo arrivato si presenta dopo qualche giorno.`,
`I tempi base con l'annuncio o con l'agenzia: [[magazzinieri]] 20 o 6 giorni, [[carrellisti]] 25 o 8, [[impiegati]] 20 o 7, [[autisti_b|autisti B]] 15 o 6, [[autisti_ce|autisti CE]] 40 o 16, [[capoturno|capiturno]] e [[pianificatori]] 25 o 8. Con la [[cooperativa]] magazzinieri e carrellisti arrivano in 3 giorni, gratis. Si accorciano con i [[welfare|benefit aziendali]], i [[welfare_mag|servizi di welfare del magazzino]], la [[reputazione]], l'[[tech_hr|ufficio del personale]], l'[[tech_academy|Academy aziendale]] e il [[dir_hr|direttore HR]].

Assumi in anticipo: quando vinci una [[gare|gara]] hai 30 giorni prima che il cliente parta.`);
wk('licenziamenti','pers','Licenziamenti',`Costano un mese di stipendio di buonuscita e abbassano il morale del magazzino per 30 giorni.`,
`Il pulsante − toglie una persona subito. Paghi la buonuscita e il [[morale]] del magazzino scende di 4 punti per un mese. Utile quando perdi un cliente e il personale resta senza lavoro. Le persone della [[cooperativa]] si mandano via gratis e senza calo di morale.`);
wk('welfare','pers','Benefit aziendali',`Buoni pasto, assicurazione sanitaria, premio di produzione: costano ogni mese per dipendente ma alzano il morale ovunque e accorciano le assunzioni.`,
`Si attivano dalla finestra Azienda e valgono per tutti i dipendenti, in tutti i magazzini:
• Buoni pasto: 110 € a testa al mese, morale +5, attrattività +6;
• Assicurazione sanitaria: 35 €, morale +4, attrattività +7;
• Premio di produzione: 80 €, morale +6, attrattività +6.

Ogni voce rende l'azienda più [[attrattivita|attraente]] e accorcia le [[assunzioni]]. Con la ricerca [[tech_welfare2|Piattaforma welfare]] costano il 30% in meno.

Sono diversi dai [[welfare_mag|servizi di welfare]] (mensa, pulmini, palestra…), che si ricercano nell'albero Welfare e si installano magazzino per magazzino.`);
wk('motrici','pers','Motrici',`I camion. Quelli di proprietà sono già pagati, ogni autista CE in più guida una motrice in leasing da 2.100 € al mese.`,
`Il numero di motrici di proprietà dipende dal [[ceo|CEO]] scelto. Quando gli [[autisti_ce|autisti con patente CE]] sono più delle motrici, la differenza si prende in leasing e finisce nei costi dei mezzi. I furgoni degli [[autisti_b|autisti B]] sono sempre in leasing (900 € al mese).`);
wk('costo_azienda','pers','Costo aziendale',`Lo stipendio lordo annuo (RAL) moltiplicato per 1,42: contributi, TFR e tredicesima compresi.`,
`Quando vedi una RAL, il costo vero per l'azienda è il 42% in più, diviso per 12 mesi. Vale per tutto il [[personale]], i [[manager]] e i dirigenti.`);
// Clienti e gare
wk('clienti','cli','Clienti',`Le aziende che ti affidano la merce: pagano per i posti occupati, i movimenti e le consegne.`,
`Ogni cliente ha un volume (posti pallet occupati e pallet consegnati al mese), delle [[soglie]] di servizio, una [[zona]] di distribuzione e un modo di farti arrivare la merce ([[ritiro]] o consegna). È servito da un solo [[magazzino]].

Il primo cliente è quello storico del tuo CEO; tutti gli altri arrivano dalle [[gare]].`);
wk('gare','cli','Gare d\'appalto',`Un cliente cerca un fornitore logistico: hai 45 giorni per fare un'offerta. Ci sono sempre almeno tre gare aperte (quattro con l'Ufficio commerciale): quando una si chiude ne arriva un'altra. Escono più spesso i clienti piccoli (rank C, D, F) e le zone piccole, come una sola provincia.`,
`Scegli il [[magazzino]] e il [[prezzo]]. Il gioco stima i KPI che avresti e la probabilità di vincere, che dipende da:
• il prezzo: ogni 1% di sconto vale +1,2 punti;
• i KPI previsti rispetto alle [[soglie]] del cliente;
• la [[reputazione]], la [[st_neg|Negoziazione]] del CEO e il [[dir_comm|direttore commerciale]];
• la [[tech_iso|certificazione ISO]];
• la difficoltà del cliente (i grandi sono più contesi).

Ogni cliente ha un [[rank]] da S a F. Alcuni clienti chiedono [[tech_richieste|tecnologie obbligatorie]]. Se vinci il [[contratto]] parte dopo 30 giorni; se non partecipi, il cliente va a un [[concorrenti|concorrente]]. Con l'[[tech_commerciale|ufficio commerciale]] ci sono più gare aperte insieme.`);
wk('prezzo','cli','Prezzo rispetto al listino',`Lo sconto o il ricarico che offri in gara, da −20% a +20%. Più basso = più probabilità, meno margine.`,
`Il listino è calcolato su stoccaggio, [[movimenti]] e trasporto (vedi [[ricavi]]). Il prezzo scelto resta per tutta la durata del [[contratto]]: uno sconto troppo aggressivo può farti lavorare in perdita.`);
wk('contratto','cli','Contratto',`Dura 12, 24 o 36 mesi (lo dice la gara) e parte 30 giorni dopo la gara vinta. Alla scadenza il cliente rinnova se la soddisfazione è almeno 50.`,
`Nei 30 giorni prima dell'avvio prepara il [[magazzino]]: [[assunzioni|assumi]] il [[personale]] che serve. La durata dipende dal [[rank]]: le committenti S e A firmano per 2-3 anni, quelle D e F spesso per uno solo.

Due mesi prima della scadenza arriva un avviso. Alla scadenza il rinnovo, per la stessa durata, è automatico se la [[soddisfazione]] è almeno 50 (40 con il [[tech_kam|Key account management]]); altrimenti il cliente passa alla concorrenza. Se non ti conviene più, dalla scheda del cliente scegli **Non rinnovare**: alla scadenza se ne va senza penali.

Uscire prima della scadenza si può, ma costa: vedi [[recesso]].`);
wk('recesso','cli','Recesso anticipato',`Uscire da un contratto prima della scadenza: penale, preavviso e qualche rischio il giorno dell'uscita.`,
`Dalla scheda del cliente, **Recedi dal contratto**:
• [[penali|penale]] subito: da 2 a 8 mesi di fatturato del cliente (2 + un quarto di mese per ogni mese di contratto rimasto);
• [[reputazione]]: metà di quella che perderesti se il cliente ti lasciasse (dipende dal [[rank]]);
• preavviso di 60 giorni (90 per le committenti S e A): il cliente resta, paga e pretende i KPI. L'inventario di uscita toglie 1 punto di [[accuratezza]] al magazzino.

Il giorno dell'uscita: 45% tutto liscio; 25% differenze inventariali (da 4 a 10 € per posto pallet, più probabili se l'accuratezza è sotto il 97%); 15% il cliente non paga l'ultima fattura; 10% il nuovo logistico è in ritardo e la merce resta altre tre settimane; 5% causa legale (8.000 € e reputazione −2).

Prima dell'avvio si può **rinunciare** al contratto: 2 mesi di fatturato di penale, nessun preavviso. Il modo gratuito per uscire è non rinnovare alla [[contratto|scadenza]].`);
wk('canali','cli','Canali di distribuzione',`Dove finisce la merce del cliente: supermercati, bar e ristoranti, negozi, case dei clienti online, stabilimenti. Ogni cliente ha il suo mix in percentuale.`,
`Ogni cliente divide i suoi pallet tra cinque canali (la barra colorata nelle gare e nella scheda cliente):

• **GDO**: piattaforme dei supermercati. Bilici pieni (carico ×1,2), appuntamento fisso allo scarico ([[puntualita]] −0,8), tariffa di distribuzione ×0,9, poco [[magazzinieri|picking]] (×0,8).
• **Horeca**: bar, ristoranti e hotel. Furgoni ([[autisti_b|patente B]]) mezzi vuoti (carico ×0,6), consegne all'alba (puntualità −0,4, [[accuratezza]] −0,3), tariffa ×1,3, picking ×1,2.
• **Dettaglio**: negozi, farmacie, ferramenta. Furgoni, carico ×0,8, picking a colli ×1,3, accuratezza −0,6, tariffa ×1,15.
• **E-commerce**: consegne a casa. Furgoni, carico ×0,7, picking a pezzo ×1,6, accuratezza −1, puntualità −0,4, tariffa ×1,25.
• **Industria**: stabilimenti e cantieri. Bilici ([[autisti_ce|patente CE]]), carico ×1,1, orari flessibili (puntualità +0,5, accuratezza +0,3), picking ×0,7, tariffa ×0,9. **Chi lavora per l'industria non ha altri canali.**

Gli effetti si pesano sui pallet di tutti i clienti del magazzino. Il carico dei canali sposta la [[saturazione_mezzi|saturazione dei mezzi]]: il valore del magazzino è la media, e ogni canale viaggia più pieno o più vuoto di così. La [[tech_sinergia|sinergia in pianificazione]] rende solo tra clienti che servono gli stessi canali.`);
wk('zona','cli','Zona di distribuzione',`Dove il cliente vuole le consegne: una provincia, alcune province, una regione, il Nord-Ovest, il Nord-Est o tutto il Nord.`,
`Ogni gara è per una zona. Le zone sono di quattro tipi: una sola provincia (per esempio la Provincia di Bologna), un gruppo di province (Romagna, Lombardia orientale, Pianura Padana, Asse del Brennero…), una regione, oppure più regioni insieme (Nord-Ovest, Nord-Est, Triveneto, Nord Italia).

**La stessa committente può fare più gare**, una per zona: puoi servire Supermercati Carrellone in Lombardia da Pioltello e in Emilia-Romagna da Bologna, con due contratti separati, ognuno con i suoi KPI, la sua soddisfazione e la sua scadenza. Le zone dello stesso cliente non possono sovrapporsi: se hai già la Lombardia, non arriverà una gara per la Provincia di Milano.

I volumi dipendono dagli abitanti della zona: una gara per tutto il Nord vale molto più di una per la sola Provincia di Rimini (crescono un po' meno che in proporzione agli abitanti, da un terzo fino a poco più del doppio dei volumi di base del cliente).

Più è grande la zona, più km per ogni viaggio: si conta la distanza media dal magazzino ai capoluoghi della zona, andata e ritorno, con il 30% in più per le strade vere. Quanti pallet porta ogni viaggio lo dice la [[saturazione_mezzi|saturazione dei mezzi]]. I km decidono quanti [[autisti]] servono e i costi dei mezzi, ma aumentano anche il prezzo del trasporto pagato dal cliente.

Il mezzo dipende dai [[canali]] del cliente: GDO e industria viaggiano con i bilici, guidati dagli [[autisti_ce|autisti con patente CE]]; horeca, dettaglio ed e-commerce con i furgoni, guidati dagli [[autisti_b|autisti con patente B]].`);
wk('ritiro','cli','Ritiro o consegna',`Da dove arriva la merce: la consegna il cliente con i suoi mezzi, oppure la vai a prendere tu.`,
`Con "consegna" la merce arriva al magazzino gratis. Con "ritiro" mandi un bilico da 33 pallet fino allo stabilimento del cliente: servono più [[autisti_ce|autisti CE]] e più gasolio, ma il cliente paga 1,5 € per ogni km di ritiro.`);
wk('concorrenti','cli','Concorrenti',`Gruppo Bartolazzi, Logistix Global, F.lli Brambilla e la Cooperativa La Fatica: si prendono le gare che perdi.`,
`Non li vedi lavorare, ma ci sono: ogni [[gare|gara]] che perdi o a cui non partecipi finisce a uno di loro, di solito con uno sconto aggressivo.`);
wk('tech_richieste','cli','Tecnologie richieste',`Alcuni clienti partecipano solo se hai già una certa ricerca: catena del freddo, EDI, e-commerce.`,
`Freschi e farmaci chiedono la [[tech_freddo|catena del freddo]], la grande distribuzione l'[[tech_edi|EDI]], i negozi online la [[tech_ecom|logistica e-commerce]]. Senza, il pulsante dell'offerta resta spento; le gare dei negozi online non arrivano nemmeno finché non hai la logistica e-commerce.`);
wk('rank','cli','Rank delle committenti',`Il voto di una committente, da S (le migliori) a F (le peggiori): la medaglia colorata accanto al nome.`,
`Il rank è la media di quattro voti da 0 a 100: ricavi promessi (quanti pallet e posti porta), desiderabilità (margini, pignoleria, pagamenti), pubblicità (quanto fa curriculum averla) e solidità (quanto è probabile che rinnovi). Passa il mouse sulla medaglia per vederli.

• S e A: solo per grandi logistiche. Serve la ricerca [[tech_accordi|Accordi quadro nazionali]], almeno 3 magazzini e reputazione 65. Pagano di più (+15% e +8% sul [[prezzo|listino]]) ma hanno [[soglie]] severe e [[concorrenti]] agguerriti.
• B e C: buoni clienti, il pane quotidiano.
• D e F: pagano meno (−3% e −12%) ma le gare sono più facili da vincere.

    dRic+=k.rev/30; dCost+=kc/30;
  });
  const g=globalCosts();
  cur.pers+=g.plan/30; cur.fissi+=g.ceo/30; cur.mgr+=g.mgr/30; cur.welf+=g.welf/30;
  dCost+=(g.plan+g.ceo+g.mgr+g.welf)/30;
  S.cash+=dRic-dCost;

  // gare

  S.tenders.filter(t=>t.deadline===d&&!t.done).forEach(resolveTender);
  // ci sono sempre almeno tre gare aperte
  while(S.tenders.filter(t=>!t.done).length<minTenders() && newTender());
  S.tenders=S.tenders.filter(t=>!t.done||d-t.deadline<30);
  S.mods=S.mods.filter(m=>m.until>d);

  if(dateOf(S.day).getUTCDay()===1) weekEnd();
  if(tomorrow.getUTCDate()===1) monthEnd();

  if(evp && !S.over && !$('#modal').innerHTML){ S.evPend=S.evPend.filter(p=>p!==evp); evResolve(evp); }

}

    else if(S.day>=c.end){

      else {c.status='perso';toast(`${c.name} non rinnova`,'bad');news('Il Sole 24 Pallet',`${c.name} non rinnova`,`Il cliente passa alla concorrenza.`);}
    }
  });
  S.clients.filter(c=>c.status==='attivo'&&!c.exit&&!c.warned&&c.end-S.day<=60).forEach(c=>{c.warned=true;
    toast(`Il contratto con ${c.name} scade il ${shortDate(c.end)}`,'warn');
    news('Il Sole 24 Pallet',`${c.name}: contratto in scadenza`,c.noRenew?`Scade il ${shortDate(c.end)} e non verrà rinnovato.`:`Scade il ${shortDate(c.end)}. Rinnova da solo se la soddisfazione è almeno ${R('kam')?40:50}; altrimenti il cliente va via.`);});
  if(R('marketing')) S.rep+=0.2;
  S.cash-=pen; S.cur.pen+=pen; S.rep=clamp(S.rep,0,100);
  const c=S.cur; c.util=c.ric-c.pers-c.mezzi-c.fissi-c.tech-c.mgr-c.welf-c.pen-c.altro;
  histPush(c);
  S.warehouses.forEach(w=>w.acc={P:0,A:0,n:0});

  if(S.cash<-50000){ gameOver(); return; }

  save();
}
// zone in cui una committente può ancora aprire una gara: non devono sovrapporsi a un suo contratto attivo o a una sua gara aperta
function freeZones(tpl){
  const busy=[...S.clients.filter(c=>c.name===tpl.name&&c.status!=='perso').map(c=>c.zone),...S.tenders.filter(x=>x.name===tpl.name&&!x.done).map(x=>x.zone)];
  return cinfo(tpl).zones.filter(z=>ZONES[z]&&ZONES[z].avail&&!busy.some(b=>zoneOverlap(b,z)));
}
// volumi della gara rispetto a quelli di base (pensati per la prima zona della committente): crescono con gli abitanti serviti
const zoneScale=(tpl,z)=>clamp(Math.pow(zoneW(z)/zoneW(cinfo(tpl).zones[0]),0.6),0.35,2.2);

const TW_RANK={S:0.7,A:0.8,B:1,C:1.4,D:1.7,F:1.7}, TW_ZONE={prov:2.2,grp:1.5,reg:1,macro:0.6};
const wpick=(a,w)=>{let x=Math.random()*a.reduce((s,v)=>s+w(v),0);return a.find(v=>(x-=w(v))<0)||a[a.length-1];};

function bidEstimate(t,whId,mult){
  const w=whById(whId); if(!w) return null;
  const extra={...t,wh:w.id,mult,status:'attivo'};
  const k=computeWH(w,extra), ld=staffLoad(w,k);
  // la committente valuta il progetto: magazzino attrezzato per reggere il carico
  const need=k.need, save=w.staff; w.staff={}; ROLES.forEach(r=>w.staff[r]=Math.max(save[r],need[r])); w.staff.capo=Math.max(save.capo,Math.floor((w.staff.pick+w.staff.car)/10));
  const k2=computeWH(w,extra); w.staff=save;
  const missing=(t.req||[]).filter(r=>!R(r)).map(r=>TECH.find(x=>x.id===r).name), naz=nazMissing(t);
  const fits=k.stock<=k.cap&&!missing.length&&!naz.length;
  const gP=k2.P-t.sP, gA=t.sA?k2.A-t.sA:3; const dC=dirStat('comm');

 {id:'ispettorato',src:'Il Mattinale del Ministero',title:'Verifica della Guardia di Finanza',cond:()=>true,

  opts:[{t:'Collabora',d:'Apri gli archivi e metti tutto a disposizione. Se qualcosa non torna, lo scoprirete insieme.',e:'Multa casuale tra 0 e 8.000 €',r:'I finanzieri hanno sfogliato faldoni fino a sera. Alla fine hanno chiuso il verbale e salutato.',f:()=>{const m=Math.round(rnd(0,8000)/100)*100;S.cash-=m;toast(m?`Multa di ${eur(m)}`:'Nessuna irregolarità',m?'bad':'ok');}},
        {t:'Chiedi un rinvio',d:'Chiedi di tornare la settimana prossima per preparare i documenti. I finanzieri annotano e se ne vanno, poco contenti.',e:'Reputazione −3',r:'Il rinvio è arrivato. In zona però si è già sparsa la voce che avevi qualcosa da nascondere.',f:()=>{S.rep-=3;}},
        {t:'"Abbiamo tutto in ordine"',d:'Consegni i raccoglitori già in ordine, con gli indici colorati. I finanzieri se ne vanno prima di pranzo.',e:'Nessuna multa, reputazione +2',req:()=>ceo().st.amm>=12,reqT:'Amministrazione 12',r:'I finanzieri hanno trovato tutto in ordine e se ne sono andati in un\'ora. Uno ha chiesto il nome del tuo commercialista.',f:()=>{S.rep+=2;}}]},
 {id:'natale',src:'La Gazzetta del Muletto',title:'Cena di Natale finita male',cond:()=>monthOf(S.day)===11,
  text:'Alla cena di Natale il capoturno e l\'impiegata del traffico si sono contesi il microfono del karaoke. È finita a urla su chi stonava di più, davanti a tutti. Da allora non si parlano e i turni si organizzano a bigliettini.',
  opts:[{t:'Organizza un chiarimento',d:'Li porti a pranzo insieme e fai da paciere. Al dolce ridono già della serata.',e:'−300 €, tutto si sistema',r:'Un caffè, due chiacchiere e una stretta di mano. Il traffico e il magazzino tornano a parlarsi.',f:()=>{S.cash-=300;}},
        {t:'Lascia che si arrangino',d:'Non sono affari tuoi. Intanto i messaggi tra magazzino e traffico arrivano tardi, o non arrivano.',e:'Puntualità −2 per 2 mesi',r:'Il traffico e il magazzino ora si parlano solo per mail, in copia al capo.',f:()=>mod('all',{P:-2},60)}]},
 {id:'furto',src:'La Gazzetta del Muletto',title:'Furto di gasolio',cond:()=>true,
  text:'Di notte qualcuno è entrato nel piazzale e ha svuotato i serbatoi di tre camion. Stamattina gli autisti hanno trovato i tappi per terra e nessuna traccia dei ladri. Il guardiano notturno dice di non aver sentito nulla.',
  opts:[{t:'Installa telecamere',d:'Fai montare telecamere e luci nel piazzale. Costa, ma la notte dormi meglio.',e:'−8.000 €',r:'Le telecamere sono montate. Il primo filmato registrato è una volpe che attraversa il piazzale.',f:()=>{S.cash-=8000;}},
        {t:'Fidati del guardiano (74 anni)',d:'Il guardiano giura che non ricapiterà. Ricompri il gasolio e speri che abbia ragione.',e:'−1.500 € di gasolio; può ricapitare',r:'Il guardiano giura che stanotte non è successo niente. Il serbatoio però dice altro.',f:()=>{S.cash-=1500;S.seen.furto=0;}}]},
 {id:'superenalotto',src:'La Gazzetta del Muletto',title:'Vincita al Superenalotto',cond:()=>S.warehouses.some(w=>w.staff.pick>=2),
  text:'Un tuo magazziniere ha vinto 2 milioni al Superenalotto. Lo hai saputo come tutti: dalle dimissioni scritte sul gruppo WhatsApp aziendale, con tre emoji di champagne. In magazzino non si parla d\'altro.',
  opts:[{t:'Fagli gli auguri',d:'Gli fai i complimenti e lo saluti con una pacca sulla spalla. In magazzino si brinda per lui.',e:'Perdi un magazziniere, morale +3',r:'Ha offerto il caffè a tutto il magazzino ed è partito per i Caraibi. Ti ha mandato una cartolina.',f:()=>{const w=S.warehouses.find(w=>w.staff.pick>=2);w.staff.pick--;mod('all',{mor:3},30);}},
        {t:'Chiedigli un investimento',d:'Prima che sparisca gli proponi di investire nell\'azienda. Ci pensa su mentre svuota l\'armadietto.',e:'30% che investa 100.000 € nell\'azienda; perdi comunque il magazziniere',r:'Ha ascoltato con interesse, poi ha chiesto tempo per pensarci. Il suo armadietto, intanto, è già vuoto.',f:()=>{const w=S.warehouses.find(w=>w.staff.pick>=2);w.staff.pick--; if(Math.random()<0.3){S.cash+=100000;toast('Ha detto sì: 100.000 € in cassa','ok');} else toast('Ha detto no e ha comprato una barca','warn');}}]},
 {id:'prete',src:'La Gazzetta del Muletto',title:'Il parroco benedice i camion',cond:()=>true,
  text:'Il parroco del paese passa a trovarti con l\'acqua santa e un gran sorriso. Propone, come ogni anno, la benedizione della flotta nel piazzale, con offerta libera. Gli autisti più anziani ci tengono parecchio.',
  opts:[{t:'Accetta e fai una donazione',d:'Raduni tutti nel piazzale per la benedizione e lasci un\'offerta generosa. Anche i più scettici si fanno il segno della croce.',e:'−500 €, morale +4',r:'I camion sono benedetti uno per uno. Un autista ha chiesto una seconda benedizione per il suo bilico.',f:()=>{S.cash-=500;mod('all',{mor:4},60);}},
        {t:'Rifiuta gentilmente',d:'Ringrazi il parroco, ma quest\'anno non è il momento. Gli autisti più anziani ci restano male.',e:'Morale −2',r:'Il parroco ha capito e se n\'è andato con un sorriso. Qualche autista ci è rimasto male.',f:()=>mod('all',{mor:-2},30)}]},
 {id:'ordine',src:'La Gazzetta del Muletto',title:'Ordine alle 17:58 di venerdì',cond:()=>S.clients.some(c=>c.status==='attivo'),
  text:'Sono le 17:58 di venerdì e il magazzino si sta svuotando. Il cliente è al telefono: "Ci serve tutto per lunedì alle 6, è vitale". Non ha intenzione di riattaccare finché non dici di sì.',
  opts:[{t:'Accetta',d:'Richiami due squadre per il sabato. Il cliente ti ringrazia, le squadre molto meno.',e:'Straordinari −2.000 €, morale −4, soddisfazione +8',r:'Il magazzino ha chiuso alle 23. Il cliente ha scritto «grazie» con tre punti esclamativi.',f:function(){S.cash-=2000;mod('all',{mor:-4},20);const c=this.c;c.sat=clamp(c.sat+8,0,100);}},
        {t:'Rifiuta con cortesia',d:'Gli spieghi che con così poco preavviso non si può fare. Ti saluta in modo freddo.',e:'Soddisfazione −6',r:'Il cliente ha risposto «capisco» e basta. Da un «capisco» così non viene mai niente di buono.',f:function(){const c=this.c;c.sat=clamp(c.sat-6,0,100);}}],
  setup:ev=>{ev.c=pick(S.clients.filter(c=>c.status==='attivo'));ev.title=`Ordine alle 17:58 di venerdì: ${ev.c.name}`;}},
 {id:'afa',src:'Radio Traffico Nord',title:'Afa record',cond:()=>[6,7].includes(monthOf(S.day)),
  text:'Il termometro in magazzino segna 40 °C. I muletti si surriscaldano, le persone pure, e nel pomeriggio il ritmo del picking crolla. Qualcuno ha già portato un ventilatore da casa.',
  opts:[{t:'Ventilatori e acqua per tutti',d:'Compri ventilatori industriali e riempi il frigo di bottiglie d\'acqua. Il magazzino respira.',e:'−3.000 €, morale +5',r:'I ventilatori girano a tutta e la scorta d\'acqua è finita entro mezzogiorno. Ma nessuno si è sentito male.',f:()=>{S.cash-=3000;mod('all',{mor:5},30);}},
        {t:'Turni all\'alba',d:'Sposti i turni alle 5 del mattino per evitare il caldo. Mezzo magazzino lavora a occhi chiusi.',e:'Accuratezza −1 per 15 giorni',r:'Alle cinque del mattino in banchina si sbadiglia parecchio. Qualche collo finisce sullo scaffale sbagliato.',f:()=>mod('all',{A:-1},15)}]},
 {id:'decreto',src:'Il Mattinale del Ministero',title:'Decreto Semplificazione',cond:()=>true,
  text:'È uscito il Decreto Semplificazione: 340 pagine che promettono di rendere più semplici le pratiche di trasporto. L\'associazione di categoria ha mandato una circolare di altre 40 pagine per spiegarlo. Nessuno ha ancora capito cosa cambi.',
  opts:[{t:'Studiatelo con calma',d:'Lo fai leggere all\'ufficio traffico, un capitolo al giorno. Nel frattempo le pratiche rallentano.',e:'Puntualità −2 per un mese',r:'Avete letto il decreto riga per riga. Nel frattempo qualche pratica è rimasta sulla scrivania.',f:()=>mod('all',{P:-2},30)},
        {t:'Assumi un consulente',d:'Chiami un consulente che lo legge al posto vostro e vi dice solo cosa cambia.',e:'−6.000 €',r:'Il consulente ha riassunto il decreto in due pagine. La fattura è di tre.',f:()=>{S.cash-=6000;}},
