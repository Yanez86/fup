<title>FUP – Fino all'ultimo pallet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: mappa a tutto schermo con pan e zoom, barra risorse in alto, menu a sinistra, finestre fluttuanti trascinabili sopra. Look unico (pixel art chiara su mappa), senza tema scuro alternativo. */
:root{
  --ink:#16202e; --ink2:#0c131d; --ink3:#2a3a50; --ink4:#4a5f7a;
  --panel:#f4f7fa; --panel2:#e6eef3; --line:#c3d0dc; --muted:#4a5768; --hi:#a9b7c8;
  --accent:#ff7a3d; --accent-d:#c8551f; --accent-l:#ffb07a;
  --ok:#2e9e48; --ok-d:#217a36; --ok-t:#23803a; --warn:#e8a317; --warn-d:#b97f0c; --warn-t:#9a6a00; --bad:#e0393e; --bad-d:#a8262a; --bad-t:#c62828;
  --yellow:#ffd23f; --sea:#1b64ad;
  --f-disp:'Pixelify Sans', 'Courier New', monospace;
  --f-body:'IBM Plex Sans Condensed', 'Arial Narrow', Arial, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
.px{image-rendering:pixelated}
.disp{font-family:var(--f-disp)}
.num{font-variant-numeric:tabular-nums}

/* Mappa */
#mapwrap{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#mapwrap.drag{cursor:grabbing}
#map{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0}
#map img{position:absolute;inset:0;width:1280px;height:800px}
#map svg{position:absolute;inset:0;overflow:visible}
.vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%, rgba(8,20,40,0) 55%, rgba(8,20,40,.4) 100%)}
.lbl{font-family:var(--f-disp);font-weight:600;fill:var(--ink);stroke:#f4f7fa;stroke-width:3px;paint-order:stroke}
.mk{cursor:pointer}
.mk:hover .mk-ring{stroke:var(--yellow)}

/* Barra superiore */
#top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));padding-top:calc(6px + env(safe-area-inset-top, 0px));
  background:var(--ink);color:#fff;border-bottom:3px solid var(--accent);box-shadow:inset 0 -3px 0 var(--ink2), 0 4px 0 rgba(12,19,29,.45)}
#top .logo{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:1px;text-shadow:2px 2px 0 var(--ink2);display:flex;align-items:center;gap:8px}
#top .logo small{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--hi);letter-spacing:0;text-shadow:none}
.chip{display:flex;flex-direction:column;justify-content:center;line-height:1.1;padding:2px 10px;background:#1d2a3b;border:2px solid #2f4057;min-width:0}
.chip span:first-child{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--hi)}
.chip b{font-family:var(--f-disp);font-size:18px;font-weight:600}
.date{font-family:var(--f-disp);font-size:17px;padding:3px 10px;background:var(--ink3);border:2px solid var(--ink4);box-shadow:inset 0 -2px 0 #1d2a3b}
.spd{display:flex;gap:4px}
.spd button{width:36px;height:34px;border:2px solid var(--ink4);background:var(--ink3);color:#fff;font-family:var(--f-disp);font-weight:700;box-shadow:inset 0 -3px 0 #1d2a3b, inset 0 2px 0 #3b4f6a}
.spd button[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:#fff;box-shadow:inset 0 -3px 0 var(--accent-d), inset 0 2px 0 var(--accent-l)}
.spacer{flex:1}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.paused{font-family:var(--f-disp);font-size:15px;padding:3px 8px;background:var(--bad);border:2px solid #fff}

/* Menu laterale */
#dock{position:fixed;left:max(12px, env(safe-area-inset-left, 0px));top:88px;z-index:25;display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--ink);border:3px solid var(--ink2);box-shadow:inset 0 2px 0 var(--ink3), 5px 5px 0 rgba(12,19,29,.55)}
#dock button{width:48px;height:44px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink4);background:var(--ink3);box-shadow:inset 0 -3px 0 #1d2a3b, inset 0 2px 0 #3b4f6a;position:relative}
#dock button.on{background:var(--accent);border-color:#fff;box-shadow:inset 0 -3px 0 var(--accent-d), inset 0 2px 0 var(--accent-l)}
#dock .badge{position:absolute;right:-7px;top:-7px;min-width:20px;height:20px;padding:0 4px;background:var(--bad);color:#fff;border:2px solid #fff;font:700 12px/16px var(--f-body)}

/* Finestre */
.win{position:fixed;z-index:20;width:440px;max-width:calc(100vw - 32px);max-height:calc(100vh - 110px);display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--ink2);box-shadow:inset 0 0 0 2px #fff, 6px 6px 0 rgba(12,19,29,.55)}
.win.wide{width:640px}
.win.xwide{width:960px}
.stats{display:inline-flex;flex-wrap:wrap;gap:4px}
.stc{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 3px;background:var(--sb);border:2px solid var(--sc);box-shadow:inset 0 -2px 0 rgba(22,32,46,.1);cursor:help;font-size:14px;line-height:1}
.stc b{color:var(--ink);font-variant-numeric:tabular-nums}
.xl{border:2px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column}
.xl-top{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:#2e9e48;color:#fff;font-family:var(--f-disp);font-size:15px}
.xl-top .sm{color:#e6f6e9}
.xl-file{display:inline-flex;align-items:center;gap:6px}
.xl-menu{display:flex;gap:2px;padding:0 6px;background:#eaf6ec;border-bottom:2px solid var(--ink);font-size:13px}
.xl-menu span{padding:4px 9px;color:var(--muted)}
.xl-menu .on{background:#fff;color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 #2e9e48}
.xl-fx{display:flex;align-items:stretch;border-bottom:2px solid var(--ink);font-size:14px}
.xl-ref{width:64px;padding:4px 6px;border-right:2px solid var(--ink);font-family:var(--f-disp);text-align:center}
.xl-fxl{padding:4px 8px;border-right:1px solid #c3d0dc;font-style:italic;color:var(--muted)}
.xl-f{padding:4px 8px;font-family:ui-monospace,monospace;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl-grid{overflow:auto;max-height:420px}
.xl.has-ch .xl-grid{max-height:236px}
.xl-grid table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}
.xl-grid th{background:#dfe7ee;color:var(--muted);font-weight:500;border:1px solid #b5c3d1;padding:2px 6px;font-size:12px;position:sticky;top:0}
.xl-grid tbody th,.xl-h th{width:30px;position:static}
.xl-grid td{border:1px solid #d5dde6;padding:4px 8px;text-align:right;white-space:nowrap;cursor:cell;height:26px}
.xl-h td{background:#f1f5f9;color:var(--ink);font-weight:700;text-align:center;border-bottom:2px solid var(--ink)}
.xl-grid td.ok{background:#e3f4d9;color:#1f6e33}.xl-grid td.warn{background:#fff4c7;color:#7a5a00}.xl-grid td.bad{background:#fde0e0;color:#a32025}
.xl-grid td.sel{outline:3px solid #2e9e48;outline-offset:-2px}
.xl-grid tr.tot td{font-weight:700;border-top:2px solid var(--ink);background:#f7f9fb}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:20px}.spark i{width:6px;display:block}
.xl-tabs{display:flex;gap:2px;padding:0 6px;background:#dfe7ee;border-top:2px solid var(--ink)}
.xl-tabs button{padding:4px 12px;border:0;border-right:1px solid #b5c3d1;background:transparent;font-size:13px;color:var(--muted)}
.xl-tabs button[aria-pressed="true"]{background:#fff;color:#1f6e33;font-weight:700;box-shadow:inset 0 -3px 0 #2e9e48;margin-top:-2px}
.xl-plus{padding:4px 10px;color:var(--muted)}
.xl-charts{padding:12px;background:#f7f9fb;border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:12px}
.lc-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lc{margin:0;background:#fff;border:1px solid #b5c3d1;box-shadow:2px 2px 0 rgba(22,32,46,.18);padding:8px 10px 4px}
.lc figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:14px}
.lc-leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lc-key{display:inline-flex;align-items:center;gap:4px}
.lc-ax{font:12px var(--f-body,sans-serif);fill:#5b6b7f}
.lc-dl{font:600 12px var(--f-body,sans-serif);fill:#16202e}
.lc-empty{display:flex;flex-direction:column;gap:4px;padding:14px}
.lc svg{display:block;cursor:crosshair}
.xl-cli{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border-bottom:2px solid var(--ink);background:#f1f5f9}
.xl-cli button{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:2px solid #b5c3d1;background:#fff;font-size:13px}
.xl-cli button[aria-pressed="true"]{border-color:#2e9e48;box-shadow:inset 0 -3px 0 #2e9e48;font-weight:700}
.treebox{overflow-x:auto;padding:4px 2px 8px}
.tnode{position:absolute;display:flex;align-items:center;gap:7px;padding:4px 6px;text-align:left;border:2px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(22,32,46,.12),2px 2px 0 var(--ink);font-size:13px;line-height:1.2}
.tnode .tn{display:flex;flex-direction:column;gap:2px;min-width:0}
.tnode b{font-size:13.5px;line-height:1.15}
.tnode span{font-size:12px}
.tnode[aria-pressed="true"]{outline:3px solid var(--yellow);outline-offset:1px}
.win-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;background:var(--ink);color:#fff;box-shadow:inset 0 -3px 0 var(--ink2), inset 0 2px 0 var(--ink3);cursor:move;user-select:none;touch-action:none}
.win-h h2{flex:1;margin:0;font-family:var(--f-disp);font-size:19px;font-weight:600}
.grip{width:10px;height:14px;background:radial-gradient(circle, #6b7a8e 1px, transparent 1.5px) 0 0/5px 5px}
.xbtn{width:30px;height:30px;border:2px solid var(--ink4);background:var(--ink3);color:#fff;font-family:var(--f-disp);font-size:13px;line-height:1;box-shadow:inset 0 -2px 0 #1d2a3b}
.win-b{padding:14px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;border-bottom:2px solid var(--ink);background:#dfe7ee;flex-wrap:wrap}
.tabs button{flex:1;padding:7px 9px;border:0;border-right:2px solid var(--ink);background:#dfe7ee;color:var(--muted);font-family:var(--f-disp);font-size:15px;min-width:0}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
.card{padding:8px 10px;background:#fff;border:2px solid var(--ink);box-shadow:inset 0 -3px 0 var(--panel2);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.bad{background:#fff4f4;border-color:var(--bad-t);box-shadow:inset 0 -3px 0 #f6dede}
.card.pend{background:#fff9e3;box-shadow:inset 0 -3px 0 #f3e3a8}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.row > *{min-width:0}
.lab{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.sm{font-size:14px;color:var(--muted)}
.h3{margin:0;font-family:var(--f-disp);font-size:18px;font-weight:600}
.bar{height:10px;background:var(--panel2);border:1px solid var(--ink);flex:1;min-width:40px}
.bar i{display:block;height:100%;max-width:100%}
.btn{padding:7px 12px;border:2px solid var(--ink);background:#fff;font-family:var(--f-disp);font-size:15px;box-shadow:inset 0 -3px 0 #c9d3dd, 2px 2px 0 var(--ink)}
.btn.pri{background:var(--accent);box-shadow:inset 0 -3px 0 var(--accent-d), inset 0 2px 0 var(--accent-l), 2px 2px 0 var(--ink);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm2{padding:4px 9px;font-size:14px;box-shadow:inset 0 -2px 0 #c9d3dd, 1px 1px 0 var(--ink)}
.pill{display:inline-block;padding:0 6px;font-size:13px;font-weight:600;border:1px solid var(--ink)}
.ok{color:var(--ok-t)} .warn{color:var(--warn-t)} .bad{color:var(--bad-t)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:3px 4px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:500}
table.t td.r,table.t th.r{text-align:right}
.staff{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px 10px;align-items:center;font-size:15px}
.mini{width:48px;height:56px;background:#3a6db0;border:2px solid var(--ink)}
.mport{width:96px;height:112px;flex:none;background:repeating-linear-gradient(180deg,#2f5fa0 0 8px,#3a6db0 8px 16px);border:3px solid var(--ink)}
select,input[type=text]{font:inherit;padding:5px 7px;border:2px solid var(--ink);background:#fff;min-width:0;max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{padding:6px 8px;background:#fff;border:2px solid var(--ink);cursor:help}
.kpi b{font-family:var(--f-disp);font-size:26px}
.portrait{background:repeating-linear-gradient(180deg,#2f5fa0 0 8px,#3a6db0 8px 16px);border:3px solid var(--ink);box-shadow:inset 0 0 0 3px var(--accent), inset 0 0 0 6px var(--ink)}
.tal{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(22,32,46,.12);cursor:help}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.skill{padding:6px 8px;background:#fff;border:2px solid var(--ink);font-size:14px}
.skill b{font-family:var(--f-disp);font-size:20px;float:right}

/* Tooltip, notifiche, modali */
#tip{position:fixed;z-index:60;max-width:320px;padding:9px 11px;background:var(--ink);color:#fff;border:2px solid var(--ink2);box-shadow:inset 0 2px 0 var(--ink3), 4px 4px 0 rgba(12,19,29,.5);font-size:14px;line-height:1.45;pointer-events:none}
#tip .tt{font-family:var(--f-disp);font-size:16px;color:var(--yellow)}
#tip .tr{display:flex;justify-content:space-between;gap:12px}
#toasts{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));top:76px;z-index:40;display:flex;flex-direction:column;gap:6px;width:340px;max-width:calc(100vw - 32px);pointer-events:none}
.toast{padding:8px 10px;background:var(--ink);color:#fff;border:2px solid var(--ink2);border-left:6px solid var(--accent);box-shadow:4px 4px 0 rgba(12,19,29,.5);font-size:15px}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
.ovl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(8,16,30,.55);padding:16px}
.modal{width:500px;max-width:100%;max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:3px solid var(--ink2);box-shadow:inset 0 0 0 2px #fff, 8px 8px 0 rgba(12,19,29,.6)}
.modal .win-b{gap:10px}
.src{display:flex;justify-content:space-between;padding:7px 12px;background:var(--ink);color:#fff;font-family:var(--f-disp);font-size:16px}
.opt{text-align:left;padding:9px 12px;border:2px solid var(--ink);background:#fff;box-shadow:inset 0 -3px 0 #c9d3dd, 2px 2px 0 var(--ink);font-size:15px}
.opt small{display:block;color:var(--muted);font-size:14px}

/* Avvio */
#start:empty,#modal:empty{display:none}
#start{position:fixed;inset:0;z-index:70;overflow:auto;background:rgba(8,16,30,.7);padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px))}
#start .box{max-width:1080px;margin:0 auto;background:var(--panel);border:3px solid var(--ink2);box-shadow:inset 0 0 0 2px #fff, 8px 8px 0 rgba(12,19,29,.6)}
#start h1{margin:0;font-family:var(--f-disp);font-size:40px;line-height:1;text-shadow:3px 3px 0 var(--accent)}
.ceos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ceo{display:flex;flex-direction:column;gap:6px;padding:10px;background:#fff;border:3px solid var(--ink);cursor:pointer;text-align:left;box-shadow:inset 0 -3px 0 var(--panel2)}
.ceo[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent), 4px 4px 0 var(--ink)}
.sw{width:30px;height:30px;border:3px solid var(--ink)}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:900px){.ceos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .ceos{grid-template-columns:minmax(0,1fr)}
  #top .stats .chip.opt2{display:none}
  #dock{top:auto;bottom:calc(12px + env(safe-area-inset-bottom, 0px));flex-direction:row;left:50%;transform:translateX(-50%)}
  .win{left:16px !important;right:16px;top:96px !important;width:auto !important}
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>

<div id="mapwrap" aria-label="Mappa del Nord-Ovest">
  <div id="map">
    <img class="px" src="{{MAP}}" alt="Mappa in pixel art del Nord-Ovest italiano con Alpi, laghi, fiumi e autostrade">
    <svg id="ov" width="1280" height="800" viewBox="0 0 1280 800" shape-rendering="crispEdges"></svg>
  </div>
</div>
<div class="vign" aria-hidden="true"></div>

<header id="top">
  <div class="logo">FUP <small id="coname"></small></div>
  <div class="date num" id="date">—</div>
  <div class="spd" role="group" aria-label="Velocità del tempo">
    <button data-act="speed" data-v="0" aria-label="Pausa (spazio)">II</button>
    <button data-act="speed" data-v="1" aria-label="Velocità 1">›</button>
    <button data-act="speed" data-v="2" aria-label="Velocità 2">››</button>
    <button data-act="speed" data-v="3" aria-label="Velocità 3">›››</button>
  </div>
  <span class="paused" id="paused" hidden>In pausa</span>
  <div class="spacer"></div>
  <div class="stats num" id="stats"></div>
</header>

<nav id="dock" aria-label="Menu"></nav>
<div id="wins"></div>
<div id="toasts" aria-live="polite"></div>
<div id="tip" hidden></div>
<div id="modal"></div>
<div id="start"></div>

<script>
(function(){
'use strict';
/* ====================== DATI ====================== */
const IMG={gino:'{{P_gino}}',edoardo:'{{P_edoardo}}',valeria:'{{P_valeria}}',marco:'{{P_marco}}',m_rosa:'{{Q_rosa}}',m_toto:'{{Q_toto}}',m_chiara:'{{Q_chiara}}',m_davide:'{{Q_davide}}',m_luca:'{{Q_luca}}',m_franca:'{{Q_franca}}',mag:'{{Q_magazziniere}}',aut:'{{Q_autista}}',imp:'{{Q_impiegata}}',m_ottavio:'{{Q_ottavio}}',m_giulia:'{{Q_giulia}}',m_roberto:'{{Q_roberto}}'};
const LON0=4.81, LAT1=47.0, KX=78.29*2, KY=111.111*2;
const pt=(lon,lat)=>[ (lon-LON0)*KX, (LAT1-lat)*KY ];

function techIcon(t,sz,dim){
  const F=TFRAME[t.tree], N=16; const cut=r=>{const d=Math.min(r,N-1-r);return F.cut[d]||0;};
  const ins=(x,y)=>y>=0&&y<N&&x>=cut(y)&&x<N-cut(y);
  let r='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ if(!ins(x,y))continue;
    const edge=!ins(x-1,y)||!ins(x+1,y)||!ins(x,y-1)||!ins(x,y+1);
    const ring=!edge&&(!ins(x-2,y)||!ins(x+2,y)||!ins(x,y-2)||!ins(x,y+2)||!ins(x-1,y-1)||!ins(x+1,y-1)||!ins(x-1,y+1)||!ins(x+1,y+1));
    r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${edge?'#16202e':ring?F.c:F.bg}"/>`; }
  (TECH_IC[t.id]||[]).forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')r+=`<rect x="${x+2}" y="${y+2}" width="1" height="1" fill="${TPAL[ch]}"/>`;}));
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 16 16" shape-rendering="crispEdges" style="flex:none;${dim?'filter:grayscale(1) opacity(.55)':''}" aria-hidden="true">${r}</svg>`;
}

  const prod=900*(0.7+0.3*wh.morale/70)*(1+tProd);

  const pP=[['Base',92],['Operazioni di '+m.name.split(' ')[0],0.4*(m.op-10)]];
  if(tP) pP.push(['Tecnologie',tP]); if(mP) pP.push(['Eventi',mP]);
  const dOp=dirStat('op'); if(dOp!=null) pP.push(['Direttore operativo',0.15*(dOp-10)]);
  if(uAut>1) pP.push(['Autisti insufficienti',-20*(uAut-1)]); if(uMag>1.05) pP.push(['Magazzinieri insufficienti',-5*(uMag-1.05)]);

function globalCosts(){
  const emp=S.warehouses.reduce((a,w)=>a+w.staff.mag+w.staff.aut,0)+S.imp;
  return {ceo:4000,imp:S.imp*RAL.imp*COEF/12,mgr:[...S.managers,...S.execs].filter(m=>m.hired).reduce((a,m)=>a+m.ral*COEF/12,0),welf:welfarePts('cost')*emp*(R('welfare2')?0.7:1)};
}
function step(){
  if(S.over) return;
  const d=S.day;
  // assunzioni in arrivo
  S.queue.forEach(q=>q.days--);
  S.queue.filter(q=>q.days<=0).forEach(q=>{
    if(q.role==='imp'){S.imp++;} else {const w=whById(q.wh); if(w) w.staff[q.role]++;}
    toast(`Assunto: 1 ${q.role==='mag'?'magazziniere':q.role==='aut'?'autista':'impiegato'}${q.role!=='imp'?' a '+whById(q.wh).name:''}`,'ok');
  });
  S.queue=S.queue.filter(q=>q.days>0);
  // clienti in avvio
  S.clients.filter(c=>c.status==='avvio'&&d>=c.start).forEach(c=>{c.status='attivo';toast(`${c.name} inizia oggi a ${whById(c.wh).name}`,'ok');news('Il Sole 24 Pallet',`${c.name} affida la logistica a ${S.company.name}`,`Il contratto parte oggi: ${n0(c.pal)} pallet al mese, ${n0(c.stock)} posti occupati.`);});
  // magazzini
  let dRic=0,dCost=0; const cur=S.cur;
  S.warehouses.forEach(w=>{
    const k=computeWH(w); w.kpi=k;
    w.morale+= (k.morT-w.morale)*0.012;
    w.acc.P+=k.P; w.acc.A+=k.A; w.acc.n++;
    const wk=w.wk||(w.wk={n:0,P:0,A:0,sat:0,mor:0,mov:0,trips:0,rev:0,cost:0}); wk.n++; wk.P+=k.P; wk.A+=k.A; wk.sat+=k.sat; wk.mor+=w.morale;
    wk.mov+=k.mov/30; wk.trips+=k.viaggi/30; wk.rev+=k.rev/30; wk.cost+=(k.pers+k.mezzi+k.fissi+k.tCan)/30;
    cur.ric+=k.rev/30; cur.pers+=k.pers/30; cur.mezzi+=k.mezzi/30; cur.fissi+=k.fissi/30; cur.tech+=k.tCan/30;
    dRic+=k.rev/30; dCost+=(k.pers+k.mezzi+k.fissi+k.tCan)/30;
  });
  const g=globalCosts();
  cur.pers+=g.imp/30; cur.fissi+=g.ceo/30; cur.mgr+=g.mgr/30; cur.welf+=g.welf/30;
  dCost+=(g.imp+g.ceo+g.mgr+g.welf)/30;
  S.cash+=dRic-dCost;
  // ricerca in corso
  if(S.project){ S.project.left--; if(S.project.left<=0){ const t=TECH.find(x=>x.id===S.project.tech); S.project=null; S.researched[t.id]=true;
    if(t.id==='iso'||t.id==='marketing') S.rep=clamp(S.rep+5,0,100);
    news('La Gazzetta del Muletto',`Ricerca completata: ${t.name}`,t.tree==='log'?'Ora si può installare nei magazzini dalla finestra Tecnologia.':t.desc);
    if(t.id==='direzione') modalInfo('La Gazzetta del Muletto','Nasce la squadra dei dirigenti','La struttura direzionale è pronta. Dal menu Direzione nomina fino a cinque direttori: ognuno guida un\'area di tutta l\'azienda con la sua abilità principale.');
    else toast(`Ricerca completata: ${t.name}${t.tree==='log'?' · installala nei magazzini':''}`,'ok'); } }
  // gare
  if(d>=S.nextTender){ newTender(); S.nextTender=d+Math.round(R('commerciale')?rnd(20,35):rnd(28,46)); }
  S.tenders.filter(t=>t.deadline===d&&!t.done).forEach(resolveTender);
  S.tenders=S.tenders.filter(t=>!t.done||d-t.deadline<30);
  S.mods=S.mods.filter(m=>m.until>d);
  // fine mese
  const tomorrow=dateOf(d+1);
  S.day++;
  if(dateOf(S.day).getUTCDay()===1) weekEnd();
  if(tomorrow.getUTCDate()===1) monthEnd();
  if(S.day>=S.nextEvent && !S.over){ S.nextEvent=S.day+Math.round(rnd(30,55)); fireEvent(); }
}
function weekEnd(){
  if(!S.weeks) S.weeks=[]; const rows={}; let any=false;
  S.warehouses.forEach(w=>{const k=w.wk; if(!k||!k.n) return; any=true;
    const act=S.clients.filter(c=>c.wh===w.id&&c.status==='attivo'); const sA=act.filter(c=>c.sA).map(c=>c.sA);
    rows[w.id]={P:k.P/k.n,A:k.A/k.n,sat:k.sat/k.n,mor:k.mor/k.n,mov:Math.round(k.mov),trips:Math.round(k.trips),rev:k.rev,cost:k.cost,
      sP:act.length?Math.max(...act.map(c=>c.sP)):null,sA:sA.length?Math.max(...sA):null};
    w.wk=null;});
  const cli={}; S.clients.filter(c=>c.status==='attivo').forEach(c=>{const r=rows[c.wh]; if(r) cli[c.id]={P:r.P,A:r.A,sP:c.sP,sA:c.sA,sat:c.sat,wh:whById(c.wh).name};});
  if(!any) return; S.weeks.push({d:S.day,rows,cli}); if(S.weeks.length>26) S.weeks.shift(); S.repNew=true;
}
function monthEnd(){
  S.months++;

  const y=yearOf(S.day); S.fuel=clamp(0.86+(y-2002)*0.05+rnd(-0.03,0.03),0.8,1.9);
  let pen=0;
  S.clients.filter(c=>c.status==='attivo').forEach(c=>{
    const w=whById(c.wh); const P=w.acc.n?w.acc.P/w.acc.n:w.kpi.P, A=w.acc.n?w.acc.A/w.acc.n:w.kpi.A;
    const wP=P-c.sP, wA=c.sA?A-c.sA:9, wv=Math.min(wP,wA);
    c.lastP=P; c.lastA=A;
    if(wv>=0){c.sat+=3+(R('edi')?1:0)+(R('kam')?1:0); S.rep+=0.15;}
    else if(wv>=-2){c.sat-=4;}
    else {c.sat-=10; const p=0.05*clientRev(c); pen+=p;}
    c.sat=clamp(c.sat,0,100);
    if(c.sat<25){c.status='perso';S.rep-=rankOf(c).lost;toast(`${c.name} ha disdetto il contratto`,'bad');news('Il Sole 24 Pallet',`${c.name} lascia ${S.company.name}`,`"Ritardi ed errori non sono più accettabili", fa sapere il cliente.`);}

    }
  });
  if(R('marketing')) S.rep+=0.2;
  S.cash-=pen; S.cur.pen+=pen; S.rep=clamp(S.rep,0,100);
  S.warehouses.forEach(w=>w.acc={P:0,A:0,n:0});
  const c=S.cur; c.util=c.ric-c.pers-c.mezzi-c.fissi-c.tech-c.mgr-c.welf-c.pen-c.altro;
  S.last=c; S.cur=z();
  if(S.cash<-50000){ gameOver(); return; }
  if(S.cash<0) toast('Cassa sotto zero: sotto i −50.000 € l\'azienda fallisce','bad');
  save();
}
function newTender(){

  if(!tpl) return;
  const k=rnd(0.75,1.25);
  const t={id:nid('t'),...tpl,stock:Math.round(tpl.stock*k/10)*10,pal:Math.round(tpl.pal*k/10)*10,open:S.day,deadline:S.day+21,bid:null,done:false,result:null};
  {const ci=cinfo(tpl); t.zone=pick(ci.zones.filter(z=>ZONES[z].avail)); t.src=ci.src; t.mode=ci.mode;}
  S.tenders.push(t);

function bidEstimate(t,whId,mult){
  const w=whById(whId); if(!w) return null;
  const extra={...t,wh:w.id,mult,status:'attivo'};
  const k=computeWH(w,extra);
  // stima con il personale che servirebbe
  const needMag=Math.ceil(k.mov/k.prod), needAut=Math.ceil(k.km/5200);
  const save={...w.staff}; w.staff={mag:Math.max(w.staff.mag,needMag),aut:Math.max(w.staff.aut,needAut)};
  const k2=computeWH(w,extra); w.staff=save;
  const missing=(t.req||[]).filter(r=>!R(r)).map(r=>TECH.find(x=>x.id===r).name), naz=nazMissing(t);
  const fits=k.stock<=k.cap&&!missing.length&&!naz.length;
  const gP=k2.P-t.sP, gA=t.sA?k2.A-t.sA:3; const dC=dirStat('comm');
  const score=50+(1-mult)*120+clamp(gP*4,-20,10)+clamp(gA*4,-20,10)+(S.rep-50)*0.4+(ceo().st.neg-10)+(dC!=null?0.8*(dC-10):0)+(R('iso')?3:0);
  const comp=55+t.diff+rankOf(t).comp;
  const chance=fits?1/(1+Math.exp(-(score-comp)/6)):0;
  return {P:k2.P,A:k2.A,sat:k.stock/k.cap,cap:k.cap,missing,naz,fits,chance,rev:clientRev(extra),needMag,needAut,staff:w.staff};

function resolveTender(t){
  t.done=true;
  if(!t.bid){t.result={win:false,by:pick(RIVALS)};return;}
  const e=bidEstimate(t,t.bid.wh,t.bid.mult);
  const win=e&&Math.random()<e.chance;
  if(win){
    const c={id:nid('c'),name:t.name,slogan:t.slogan,sector:t.sector,stock:t.stock,pal:t.pal,sP:t.sP,sA:t.sA,zone:t.zone,src:t.src,mode:t.mode,wh:t.bid.wh,mult:t.bid.mult,sat:60,status:'avvio',start:S.day+30,end:S.day+30+24*30};

function fireEvent(){
  const el=EVENTS.filter(e=>(!e.once||!S.seen[e.id])&&(S.seen[e.id]===undefined||S.day-S.seen[e.id]>240)&&e.cond());
  if(!el.length) return;
  const base=pick(el); const ev={...base}; if(ev.setup) ev.setup(ev);
  S.seen[ev.id]=S.day; UI.ev=ev; const wasSpeed=S.speed; UI.evSpeed=wasSpeed; setSpeed(0);
  const opts=ev.opts.map((o,i)=>{const ok=!o.req||o.req();return `<button class="opt" data-act="evopt" data-i="${i}" ${ok?'':'disabled'}>${o.req?`<span class="pill" style="background:var(--yellow)">${esc(o.reqT)}</span> `:''}${esc(o.t)}<small>${esc(o.e)}</small></button>`}).join('');
  showModal(`<div class="src"><span>${esc(ev.src)}</span><span>${shortDate(S.day)}</span></div><div class="win-b"><h3 class="h3" style="font-size:21px">${esc(ev.title)}</h3><p style="margin:0;line-height:1.45">${esc(ev.text)}</p>${opts}</div>`);
}
function modalInfo(src,title,text){
  UI.evSpeed=S.speed; setSpeed(0);
  showModal(`<div class="src"><span>${esc(src)}</span><span>${shortDate(S.day)}</span></div><div class="win-b"><h3 class="h3" style="font-size:20px">${esc(title)}</h3><p style="margin:0;line-height:1.45">${esc(text)}</p><button class="btn pri" data-act="closemodal">Ok</button></div>`);
}

/* ====================== MAPPA ====================== */
const view={s:1,x:0,y:0};
function fitMap(){
  const W=innerWidth,H=innerHeight; const s0=Math.max(W/1280,H/800);
  view.min=s0; if(view.s<s0||!view.init){view.s=s0;view.x=(W-1280*s0)/2;view.y=(H-800*s0)/2;view.init=1;}
  clampView(); applyView();
}
function clampView(){const W=innerWidth,H=innerHeight;view.x=clamp(view.x,W-1280*view.s,0);view.y=clamp(view.y,H-800*view.s,0);}
function applyView(){$('#map').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;}
function initMapControls(){
  const mw=$('#mapwrap'); let drag=null;
  mw.addEventListener('pointerdown',e=>{ if(e.target.closest('.mk')) return; drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};mw.classList.add('drag');mw.setPointerCapture(e.pointerId);});
  mw.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;clampView();applyView();});
  const up=()=>{drag=null;mw.classList.remove('drag');}; mw.addEventListener('pointerup',up); mw.addEventListener('pointercancel',up);
  mw.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.15:1/1.15;const ns=clamp(view.s*f,view.min,view.min*3.2);
    const mx=e.clientX,my=e.clientY;view.x=mx-(mx-view.x)*ns/view.s;view.y=my-(my-view.y)*ns/view.s;view.s=ns;clampView();applyView();},{passive:false});
  addEventListener('resize',fitMap);
}
function renderMap(){
  const g=[];
  CITIES.forEach(([n,lo,la,big,out])=>{const [x,y]=pt(lo,la);const s=big?10:7;
    g.push(`<rect x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" fill="${out?'#6b7a8e':'#16202e'}"/><rect x="${x-s/2+2}" y="${y-s/2+2}" width="${s-4}" height="${s-4}" fill="#fff"/>`);
    g.push(`<text class="lbl" x="${x+7}" y="${y+4}" font-size="${big?16:13}" ${out?'fill-opacity=".7"':''}>${big?n.toUpperCase():n}</text>`);});
  // siti di espansione
  Object.entries(SITES).forEach(([id,s])=>{ if(S.warehouses.some(w=>w.site===id)) return; const [x,y]=pt(s.lon,s.lat);
    g.push(`<g class="mk" data-act="site" data-id="${id}" data-tip="<div class='tt'>${esc(s.name)} (${s.prov})</div>Magazzino in affitto: ${n0(s.cap)} posti pallet, ${eur(s.rent)} al mese. Clic per i dettagli."><rect class="mk-ring" x="${x-9}" y="${y-9}" width="18" height="18" fill="none" stroke="#16202e" stroke-width="2" stroke-dasharray="3 2"/><rect x="${x-5}" y="${y-5}" width="10" height="10" fill="#ffffff" fill-opacity=".6"/></g>`);});
  // contratto evidenziato: zona di distribuzione e provenienza della merce
  const mc=UI.mapCli&&S.clients.find(c=>c.id===UI.mapCli&&c.status!=='perso');
  if(mc){ const w=whById(mc.wh), s=SITES[w.site], [wx,wy]=pt(s.lon,s.lat), col=TPAL[(LOGO[mc.name]||{bg:'O'}).bg], z=ZONES[mc.zone]||ZONES.nordovest;
    z.cities.forEach(n=>{const c=CITIES.find(x=>x[0]===n); const [x,y]=pt(c[1],c[2]);
      g.push(`<line x1="${wx}" y1="${wy}" x2="${x}" y2="${y}" stroke="#16202e" stroke-width="5" opacity=".5"/><line x1="${wx}" y1="${wy}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="3" stroke-dasharray="8 5"/><rect x="${x-9}" y="${y-9}" width="18" height="18" fill="none" stroke="${col}" stroke-width="3"/>`);});
    const o=ORIGINS[mc.src]||ORIGINS.fornitori; let [ox,oy]=pt(o.lon,o.lat); let off=false;
    if(ox<20||ox>1260||oy<20||oy>780){off=true; const dx=ox-wx,dy=oy-wy; const t=Math.min(dx>0?(1240-wx)/dx:dx<0?(40-wx)/dx:1e9, dy>0?(740-wy)/dy:dy<0?(40-wy)/dy:1e9); ox=wx+dx*t; oy=wy+dy*t;}
    g.push(`<line x1="${ox}" y1="${oy}" x2="${wx}" y2="${wy}" stroke="#16202e" stroke-width="7" opacity=".5"/><line x1="${ox}" y1="${oy}" x2="${wx}" y2="${wy}" stroke="${mc.mode==='ritiro'?'#ff7a3d':'#ffffff'}" stroke-width="4"/>`);
    g.push(`<g transform="translate(${Math.round(ox-12)},${Math.round(oy-12)})">${logoSvg(mc.name,24)}</g><text class="lbl" x="${ox+(ox>700?-16:16)}" y="${oy+(oy<60?28:-16)}" font-size="14" text-anchor="${ox>700?'end':'start'}">${off?'↗ ':''}${esc(o.n)} · ${mc.mode==='ritiro'?'ritiro nostro':'consegna il cliente'}</text>`);
  }

let trucks=[], lastT=0;
const TRUCK=c=>`<rect x="0" y="0" width="13" height="8" fill="#16202e"/><rect x="1" y="1" width="11" height="6" fill="${c}"/><rect x="13" y="2" width="6" height="6" fill="#16202e"/><rect x="14" y="3" width="4" height="2" fill="#bfe6ff"/><rect x="2" y="8" width="3" height="3" fill="#16202e"/><rect x="13" y="8" width="3" height="3" fill="#16202e"/>`;
function syncTrucks(){
  const want=[]; S.warehouses.forEach(w=>{const n=Math.min(w.kpi&&w.kpi.viaggi?w.staff.aut:0,6);for(let i=0;i<n;i++)want.push(w.id+'_'+i);});
  trucks=trucks.filter(t=>want.includes(t.id));
  want.forEach(id=>{ if(trucks.find(t=>t.id===id)) return; const w=whById(id.split('_')[0]); const s=SITES[w.site];
    trucks.push({id,from:pt(s.lon,s.lat),to:null,t:Math.random(),back:false});});
  const g=$('#trucks'); if(!g) return;
  g.innerHTML=trucks.map(t=>`<g id="tk_${t.id}">${TRUCK(getComputedStyle(document.documentElement).getPropertyValue('--accent'))}</g>`).join('');
}
function animTrucks(ts){
  const dt=Math.min(0.1,(ts-lastT)/1000||0); lastT=ts;
  const mv=S&&!S.over&&S.speed>0 && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  trucks.forEach(t=>{
    if(!t.to){const c=pick(CITIES);t.to=pt(c[1],c[2]);t.t=0;t.back=false;}
    const dx=t.to[0]-t.from[0],dy=t.to[1]-t.from[1],len=Math.hypot(dx,dy)||1;
    if(mv) t.t+=dt*(25+S.speed*20)/len;
    if(t.t>=1){ if(!t.back){t.back=true;t.t=0;[t.from,t.to]=[t.to,t.from];} else {t.from=t.to;t.to=null;} }
    if(!t.to) return;
    const x=t.from[0]+(t.to[0]-t.from[0])*clamp(t.t,0,1), y=t.from[1]+(t.to[1]-t.from[1])*clamp(t.t,0,1);
    const el=document.getElementById('tk_'+t.id); if(el) el.setAttribute('transform',`translate(${Math.round(x-9)},${Math.round(y-5)})${t.to[0]<t.from[0]?' scale(-1,1) translate(-19,0)':''}`);
  });
  requestAnimationFrame(animTrucks);
}

/* ====================== AVVIO ====================== */
let startSel={ceo:'gino',color:'#ff7a3d',name:''};
const COLORS=[['#ff7a3d','#c8551f','#ffb07a'],['#ff4f9a','#c22b6f','#ff9cc6'],['#3dd6c4','#1f9e8f','#9cefe5'],['#9b6bff','#6f43cf','#c8adff']];
function applyColor(c){const t=COLORS.find(x=>x[0]===c)||COLORS[0];const r=document.documentElement.style;r.setProperty('--accent',t[0]);r.setProperty('--accent-d',t[1]);r.setProperty('--accent-l',t[2]);}
function showStart(){
  setSpeedSafe(0); const sv=load();
  const st=CEOS.map(c=>{const s=SITES[c.site];return `<button class="ceo" data-act="pickceo" data-id="${c.id}" aria-pressed="${startSel.ceo===c.id}">
    <div class="portrait" style="height:150px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden"><img class="px" src="${IMG[c.id]}" alt="Ritratto di ${esc(c.name)}" width="128" height="150"></div>
    <b class="disp" style="font-size:18px">${esc(c.name)}</b><span class="sm">${c.age} anni · ${esc(c.origin)}</span>
    <span class="sm" style="color:var(--ink)">${esc(s.name)} (${s.prov}) · ${n0(s.cap)} posti · ${eur(c.cash)}</span>
    <span>${statChips(c.st,14)}</span>
    ${talentIcons(c.tal,32)}
    <span class="sm" style="display:flex;align-items:center;gap:6px">${logoSvg(c.client.name,24)} Cliente storico: ${esc(c.client.name)} ${rankIcon(c.client,18)}</span></button>`;}).join('');
  const C=CEOS.find(c=>c.id===startSel.ceo);
  $('#start').innerHTML=`<div class="box"><div class="src"><span>FUP</span><span>Nord-Ovest, gennaio 2002</span></div><div class="win-b" style="gap:14px;padding:18px">
   <div><h1>FUP</h1><div class="disp" style="font-size:20px;margin-top:4px">Fino all'ultimo pallet</div></div>
   <p style="margin:0;max-width:65ch">Guida un'azienda di trasporti e logistica nel Nord-Ovest. Vinci gare, assumi le persone giuste, investi in tecnologia e non far scendere la cassa sotto i −50.000 €.</p>
   ${sv&&sv.S&&!sv.S.over?`<div class="card pend"><div class="row"><span><b>${esc(sv.S.company.name)}</b> · ${fmtDate(sv.S.day)}</span><button class="btn pri" data-act="continue">Continua la partita</button></div></div>`:''}
   <div class="lab">1. Scegli il tuo CEO</div><div class="ceos">${st}</div>
   <div class="split"><label style="display:flex;flex-direction:column;gap:4px"><span class="lab">2. Nome dell'azienda</span><input type="text" id="coname-in" maxlength="40" value="${esc(startSel.name||C.company)}" aria-label="Nome dell'azienda"></label>
   <div style="display:flex;flex-direction:column;gap:4px"><span class="lab">3. Colore</span><div style="display:flex;gap:8px">${COLORS.map(c=>`<button class="sw" data-act="pickcolor" data-c="${c[0]}" aria-pressed="${startSel.color===c[0]}" style="background:${c[0]}" aria-label="Colore ${c[0]}"></button>`).join('')}</div></div></div>
   <div class="row"><span class="sm">Comandi: spazio per la pausa, 1–3 per la velocità, trascina e usa la rotellina sulla mappa.</span><button class="btn pri" data-act="startgame" style="font-size:18px;padding:10px 18px">Inizia</button></div>
  </div></div>`;
}
function setSpeedSafe(v){if(S){S.speed=v;renderTop();}}
Object.assign(ACT,{
 pickceo(d){const old=CEOS.find(c=>c.id===startSel.ceo);const inp=$('#coname-in');const typed=inp?inp.value:'';startSel.ceo=d.id;if(!typed||typed===old.company)startSel.name='';else startSel.name=typed;showStart();},
 pickcolor(d){startSel.color=d.c;applyColor(d.c);startSel.name=$('#coname-in').value;showStart();},
 startgame(){const nm=($('#coname-in').value||'').trim();uid=1;newGame(startSel.ceo,nm,startSel.color);boot();},
 continue(){const sv=load();if(!sv)return;S=sv.S;S.managers.forEach(m=>{const d=MANAGERS.find(x=>x.id===m.id);if(d){m.tal=d.tal;m.role=d.role;}});if(S.project===undefined)S.project=null;uid=sv.uid||S.uid||100;boot();}
});
function boot(){
  $('#start').innerHTML=''; applyColor(S.company.color);
  Object.keys(UI.open).forEach(closeWin); UI={open:{},sel:{},tab:{},z:30,pos:{},bid:{}};
  view.init=0; fitMap(); renderMap(); S.warehouses.forEach(w=>w.kpi=computeWH(w)); syncTrucks(); renderAll();
  if(S.day===0){ modalInfo('La Gazzetta del Muletto',`Benvenuto, ${ceo().name}`,`Hai un magazzino a ${S.warehouses[0].name} e un solo cliente, ${S.clients[0].name}. Con il magazzino quasi vuoto perdi soldi ogni mese: tieni d'occhio le Gare d'appalto, assumi in anticipo quando ne vinci una e controlla Puntualità e Accuratezza nel menu Magazzini. Premi spazio per far scorrere il tempo.`); }
}
/* ciclo di gioco */
let acc=0,lastTick=performance.now(); const STEP=[0,1000,420,140];
function loop(now){
  const dt=now-lastTick; lastTick=now;
  if(S&&!S.over&&S.speed>0&&!$('#modal').innerHTML){acc+=dt; let n=0; while(S.speed>0&&acc>=STEP[S.speed]&&n<5){acc-=STEP[S.speed];step();n++; if(S.over)break;} if(n){syncTrucksMaybe();renderAll();}}
  else acc=0;
  requestAnimationFrame(loop);
}
let lastSync=0; function syncTrucksMaybe(){if(S.day-lastSync>=7){lastSync=S.day;syncTrucks();}}
initMapControls();
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({S,uid}));
function start(data){ if(data&&data.S){S=data.S;uid=data.uid||100;boot();} else showStart(); fitMap(); requestAnimationFrame(loop); requestAnimationFrame(animTrucks); }
if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data);
window.__FUP={get S(){return S;},step,newGame:(c)=>{uid=1;newGame(c,'',COLORS[0][0]);},computeWH,bidEstimate,EVENTS,TECH,TREES,techIcon,clientLog,logoSvg,LOGO,STATS,statIcon,weekEnd,ACT,rankOf,rankScore,TENDER_POOL,CEOS};
})();
</script>
