<title>FUP – Fino all'ultimo pallet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: mappa a tutto schermo con pan e zoom, barra risorse in alto, menu a sinistra, finestre fluttuanti trascinabili sopra. Look unico (pixel art chiara su mappa), senza tema scuro alternativo. */
:root{
  --ink:#16202e; --ink2:#0c131d; --ink3:#2a3a50; --ink4:#4a5f7a;
  --panel:#f4f7fa; --panel2:#e6eef3; --line:#c3d0dc; --muted:#4a5768; --hi:#a9b7c8;
  --accent:#ff7a3d; --accent-d:#c8551f; --accent-l:#ffb07a;
  --ok:#2e9e48; --ok-d:#217a36; --ok-t:#23803a; --warn:#e8a317; --warn-d:#b97f0c; --warn-t:#9a6a00; --bad:#e0393e; --bad-d:#a8262a; --bad-t:#c62828;
  --yellow:#ffd23f; --sea:#1b64ad;
  --f-disp:'Pixelify Sans', 'Courier New', monospace;
  --f-body:'IBM Plex Sans Condensed', 'Arial Narrow', Arial, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
.px{image-rendering:pixelated}
.disp{font-family:var(--f-disp)}
.num{font-variant-numeric:tabular-nums}

/* Mappa */
#mapwrap{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#mapwrap.drag{cursor:grabbing}
#map{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0}
#map img{position:absolute;inset:0;width:1280px;height:800px}
#map svg{position:absolute;inset:0;overflow:visible}
.vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%, rgba(8,20,40,0) 55%, rgba(8,20,40,.4) 100%)}
.lbl{font-family:var(--f-disp);font-weight:600;fill:var(--ink);stroke:#f4f7fa;stroke-width:3px;paint-order:stroke}
.mk{cursor:pointer}
.plbl{font-family:var(--f-disp);font-weight:600;fill:#fff;stroke:var(--ink);stroke-width:3px;paint-order:stroke;pointer-events:none;letter-spacing:1px}
.prov{transition:fill-opacity .12s}
.prov:hover{fill-opacity:.62}
#lenses{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:max(16px, env(safe-area-inset-bottom, 0px));z-index:25;display:flex;align-items:center;gap:6px;padding:6px;background:var(--ink);border:3px solid var(--ink2);box-shadow:inset 0 2px 0 var(--ink3), 5px 5px 0 rgba(12,19,29,.55)}
#lenses .lab{color:var(--hi);font-family:var(--f-disp);font-size:14px;padding:0 4px}
#lenses button{width:44px;height:40px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink4);background:var(--ink3);box-shadow:inset 0 -3px 0 #1d2a3b, inset 0 2px 0 #3b4f6a}
#lenses button[aria-pressed="true"]{background:var(--accent);border-color:#fff;box-shadow:inset 0 -3px 0 var(--accent-d), inset 0 2px 0 var(--accent-l)}
.mk:hover .mk-ring{stroke:var(--yellow)}

/* Barra superiore */
#top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));padding-top:calc(6px + env(safe-area-inset-top, 0px));
  background:var(--ink);color:#fff;border-bottom:3px solid var(--accent);box-shadow:inset 0 -3px 0 var(--ink2), 0 4px 0 rgba(12,19,29,.45)}
#top .logo{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:1px;text-shadow:2px 2px 0 var(--ink2);display:flex;align-items:center;gap:8px}
#top .logo small{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--hi);letter-spacing:0;text-shadow:none}
.chip{display:flex;flex-direction:column;justify-content:center;line-height:1.1;padding:2px 10px;background:#1d2a3b;border:2px solid #2f4057;min-width:0}
.chip span:first-child{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--hi)}
.chip b{font-family:var(--f-disp);font-size:18px;font-weight:600}
.date{font-family:var(--f-disp);font-size:17px;padding:3px 10px;background:var(--ink3);border:2px solid var(--ink4);box-shadow:inset 0 -2px 0 #1d2a3b}
.spd{display:flex;gap:4px}
.spd button{width:36px;height:34px;border:2px solid var(--ink4);background:var(--ink3);color:#fff;font-family:var(--f-disp);font-weight:700;box-shadow:inset 0 -3px 0 #1d2a3b, inset 0 2px 0 #3b4f6a}
.spd button[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:#fff;box-shadow:inset 0 -3px 0 var(--accent-d), inset 0 2px 0 var(--accent-l)}
.spacer{flex:1}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.paused{font-family:var(--f-disp);font-size:15px;padding:3px 8px;background:var(--bad);border:2px solid #fff}

/* Menu laterale */
#dock{position:fixed;left:max(12px, env(safe-area-inset-left, 0px));top:88px;z-index:25;display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--ink);border:3px solid var(--ink2);box-shadow:inset 0 2px 0 var(--ink3), 5px 5px 0 rgba(12,19,29,.55)}
#dock button{width:48px;height:44px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink4);background:var(--ink3);box-shadow:inset 0 -3px 0 #1d2a3b, inset 0 2px 0 #3b4f6a;position:relative}
#dock button.on{background:var(--accent);border-color:#fff;box-shadow:inset 0 -3px 0 var(--accent-d), inset 0 2px 0 var(--accent-l)}
#dock .badge{position:absolute;right:-7px;top:-7px;min-width:20px;height:20px;padding:0 4px;background:var(--bad);color:#fff;border:2px solid #fff;font:700 12px/16px var(--f-body)}

/* Finestre */
/* le finestre si ordinano tra loro dentro #wins, senza mai salire sopra barra, modali e tooltip */
#wins{position:relative;z-index:20}
.win{position:fixed;z-index:20;width:440px;max-width:calc(100vw - 32px);max-height:calc(100vh - 110px);display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--ink2);box-shadow:inset 0 0 0 2px #fff, 6px 6px 0 rgba(12,19,29,.55)}
.win.wide{width:640px}
.win.xwide{width:960px}
.stats{display:inline-flex;flex-wrap:wrap;gap:4px}
.stc{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 3px;background:var(--sb);border:2px solid var(--sc);box-shadow:inset 0 -2px 0 rgba(22,32,46,.1);cursor:help;font-size:14px;line-height:1}
.stc b{color:var(--ink);font-variant-numeric:tabular-nums}
.xl{border:2px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column}
.xl-top{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:#2e9e48;color:#fff;font-family:var(--f-disp);font-size:15px}
.xl-top .sm{color:#e6f6e9}
.xl-file{display:inline-flex;align-items:center;gap:6px}
.xl-menu{display:flex;gap:2px;padding:0 6px;background:#eaf6ec;border-bottom:2px solid var(--ink);font-size:13px}
.xl-menu span{padding:4px 9px;color:var(--muted)}
.xl-menu .on{background:#fff;color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 #2e9e48}
.xl-fx{display:flex;align-items:stretch;border-bottom:2px solid var(--ink);font-size:14px}
.xl-ref{width:64px;padding:4px 6px;border-right:2px solid var(--ink);font-family:var(--f-disp);text-align:center}
.xl-fxl{padding:4px 8px;border-right:1px solid #c3d0dc;font-style:italic;color:var(--muted)}
.xl-f{padding:4px 8px;font-family:ui-monospace,monospace;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl-grid{overflow:auto;max-height:420px}
.xl.has-ch .xl-grid{max-height:236px}
.xl-grid table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}
.xl-grid th{background:#dfe7ee;color:var(--muted);font-weight:500;border:1px solid #b5c3d1;padding:2px 6px;font-size:12px;position:sticky;top:0}
.xl-grid tbody th,.xl-h th{width:30px;position:static}
.xl-grid td{border:1px solid #d5dde6;padding:4px 8px;text-align:right;white-space:nowrap;cursor:cell;height:26px}
.xl-h td{background:#f1f5f9;color:var(--ink);font-weight:700;text-align:center;border-bottom:2px solid var(--ink)}
.xl-grid td.ok{background:#e3f4d9;color:#1f6e33}.xl-grid td.warn{background:#fff4c7;color:#7a5a00}.xl-grid td.bad{background:#fde0e0;color:#a32025}
.xl-grid td.sel{outline:3px solid #2e9e48;outline-offset:-2px}
.xl-grid tr.tot td{font-weight:700;border-top:2px solid var(--ink);background:#f7f9fb}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:20px}.spark i{width:6px;display:block}
.xl-tabs{display:flex;gap:2px;padding:0 6px;background:#dfe7ee;border-top:2px solid var(--ink)}
.xl-tabs button{padding:4px 12px;border:0;border-right:1px solid #b5c3d1;background:transparent;font-size:13px;color:var(--muted)}
.xl-tabs button[aria-pressed="true"]{background:#fff;color:#1f6e33;font-weight:700;box-shadow:inset 0 -3px 0 #2e9e48;margin-top:-2px}
.xl-plus{padding:4px 10px;color:var(--muted)}
.xl-charts{padding:12px;background:#f7f9fb;border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:12px}
.lc-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lc{margin:0;background:#fff;border:1px solid #b5c3d1;box-shadow:2px 2px 0 rgba(22,32,46,.18);padding:8px 10px 4px}
.lc figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:14px}
.lc-leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lc-key{display:inline-flex;align-items:center;gap:4px}
.lc-ax{font:12px var(--f-body,sans-serif);fill:#5b6b7f}
.lc-dl{font:600 12px var(--f-body,sans-serif);fill:#16202e}
.lc-empty{display:flex;flex-direction:column;gap:4px;padding:14px}
.lc svg{display:block;cursor:crosshair}
.xl-cli{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border-bottom:2px solid var(--ink);background:#f1f5f9}
.xl-cli button{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:2px solid #b5c3d1;background:#fff;font-size:13px}
.xl-cli button[aria-pressed="true"]{border-color:#2e9e48;box-shadow:inset 0 -3px 0 #2e9e48;font-weight:700}
.treebox{overflow-x:auto;padding:4px 2px 8px}
.tnode{position:absolute;display:flex;align-items:center;gap:7px;padding:4px 6px;text-align:left;border:2px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(22,32,46,.12),2px 2px 0 var(--ink);font-size:13px;line-height:1.2}
.tnode .tn{display:flex;flex-direction:column;gap:2px;min-width:0}
.tnode b{font-size:13.5px;line-height:1.15}
.tnode span{font-size:12px}
.tnode[aria-pressed="true"]{outline:3px solid var(--yellow);outline-offset:1px}
.win-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;background:var(--ink);color:#fff;box-shadow:inset 0 -3px 0 var(--ink2), inset 0 2px 0 var(--ink3);cursor:move;user-select:none;touch-action:none}
.win-h h2{flex:1;margin:0;font-family:var(--f-disp);font-size:19px;font-weight:600}
.grip{width:10px;height:14px;background:radial-gradient(circle, #6b7a8e 1px, transparent 1.5px) 0 0/5px 5px}
.xbtn{width:30px;height:30px;border:2px solid var(--ink4);background:var(--ink3);color:#fff;font-family:var(--f-disp);font-size:13px;line-height:1;box-shadow:inset 0 -2px 0 #1d2a3b}
.win-b{padding:14px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;border-bottom:2px solid var(--ink);background:#dfe7ee;flex-wrap:wrap}
.tabs button{flex:1;padding:7px 9px;border:0;border-right:2px solid var(--ink);background:#dfe7ee;color:var(--muted);font-family:var(--f-disp);font-size:15px;min-width:0}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
.card{padding:8px 10px;background:#fff;border:2px solid var(--ink);box-shadow:inset 0 -3px 0 var(--panel2);display:flex;flex-direction:column;gap:5px;min-width:0}
.card.bad{background:#fff4f4;border-color:var(--bad-t);box-shadow:inset 0 -3px 0 #f6dede}
.card.pend{background:#fff9e3;box-shadow:inset 0 -3px 0 #f3e3a8}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.row > *{min-width:0}
.lab{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.sm{font-size:14px;color:var(--muted)}
.h3{margin:0;font-family:var(--f-disp);font-size:18px;font-weight:600}
.bar{height:10px;background:var(--panel2);border:1px solid var(--ink);flex:1;min-width:40px}
.bar i{display:block;height:100%;max-width:100%}
.btn{padding:7px 12px;border:2px solid var(--ink);background:#fff;font-family:var(--f-disp);font-size:15px;box-shadow:inset 0 -3px 0 #c9d3dd, 2px 2px 0 var(--ink)}
.btn.pri{background:var(--accent);box-shadow:inset 0 -3px 0 var(--accent-d), inset 0 2px 0 var(--accent-l), 2px 2px 0 var(--ink);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm2{padding:4px 9px;font-size:14px;box-shadow:inset 0 -2px 0 #c9d3dd, 1px 1px 0 var(--ink)}
.pill{display:inline-block;padding:0 6px;font-size:13px;font-weight:600;border:1px solid var(--ink)}
.ok{color:var(--ok-t)} .warn{color:var(--warn-t)} .bad{color:var(--bad-t)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:3px 4px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:500}
table.t td.r,table.t th.r{text-align:right}
.staff{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px 10px;align-items:center;font-size:15px}
.mini{width:48px;height:56px;background:#3a6db0;border:2px solid var(--ink)}
.mport{width:96px;height:112px;flex:none;background:repeating-linear-gradient(180deg,#2f5fa0 0 8px,#3a6db0 8px 16px);border:3px solid var(--ink)}
select,input[type=text]{font:inherit;padding:5px 7px;border:2px solid var(--ink);background:#fff;min-width:0;max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chbar i{display:block;height:100%}
.chbar i+i{border-left:1px solid #16202e}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{padding:6px 8px;background:#fff;border:2px solid var(--ink);cursor:help}
.kpi b{font-family:var(--f-disp);font-size:26px}
.portrait{background:repeating-linear-gradient(180deg,#2f5fa0 0 8px,#3a6db0 8px 16px);border:3px solid var(--ink);box-shadow:inset 0 0 0 3px var(--accent), inset 0 0 0 6px var(--ink)}
.tal{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(22,32,46,.12);cursor:help}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.skill{padding:6px 8px;background:#fff;border:2px solid var(--ink);font-size:14px}
.skill b{font-family:var(--f-disp);font-size:20px;float:right}

/* Parole chiave ed enciclopedia */
.kw{border-bottom:2px dotted currentColor;cursor:help;text-transform:inherit}
.kw:hover,.kw:focus-visible{background:#fff3c4;color:var(--ink);outline:none}
.chip[data-act]{cursor:pointer}.chip[data-act]:hover{border-color:var(--yellow)}
.win.wkw{width:860px}
.wk{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;min-height:0}
.wk-side{display:flex;flex-direction:column;gap:6px;min-width:0}
.wk-list{max-height:calc(100vh - 250px);overflow:auto;border:2px solid var(--ink);background:#fff;box-shadow:2px 2px 0 var(--ink)}
.wk-cat{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--ink);color:#fff;font-family:var(--f-disp);font-size:14px}
.wk-it{display:flex;align-items:center;gap:7px;width:100%;padding:4px 8px;border:0;border-bottom:1px dashed var(--line);background:#fff;text-align:left;font-size:14px;line-height:1.2}
.wk-it:hover{background:#fff3c4}
.wk-it[aria-current="true"]{background:var(--accent);font-weight:600;box-shadow:inset 4px 0 0 var(--ink)}
.wk-ic{display:inline-flex;align-items:center;justify-content:center;flex:none}.wk-ic svg{max-width:100%;max-height:100%;width:auto;height:auto}
.wk-art{display:flex;flex-direction:column;gap:10px;min-width:0}
.wk-head{display:flex;gap:12px;align-items:center;padding-bottom:8px;border-bottom:3px solid var(--ink)}
.wk-head .tal{flex:none}
.wk-lead{font-weight:600;font-size:16px;line-height:1.45}
.wk-txt p{margin:0 0 10px;line-height:1.55;font-size:15.5px}
.wk-see{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px}
.wk-home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wk-home .card{gap:4px}.wk-home .card .row{justify-content:flex-start;gap:6px}
.wk-home .kws{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:14px}

/* Tooltip, notifiche, modali */
#tip{position:fixed;z-index:1000;max-width:320px;padding:9px 11px;background:var(--ink);color:#fff;border:2px solid var(--ink2);box-shadow:inset 0 2px 0 var(--ink3), 4px 4px 0 rgba(12,19,29,.5);font-size:14px;line-height:1.45;pointer-events:none}
#tip .tt{font-family:var(--f-disp);font-size:16px;color:var(--yellow)}
#tip .tr{display:flex;justify-content:space-between;gap:12px}
#toasts{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));top:76px;z-index:40;display:flex;flex-direction:column;gap:6px;width:340px;max-width:calc(100vw - 32px);pointer-events:none}
.toast{padding:8px 10px;background:var(--ink);color:#fff;border:2px solid var(--ink2);border-left:6px solid var(--accent);box-shadow:4px 4px 0 rgba(12,19,29,.5);font-size:15px}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
.ovl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(8,16,30,.55);padding:16px}
.modal{width:500px;max-width:100%;max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:3px solid var(--ink2);box-shadow:inset 0 0 0 2px #fff, 8px 8px 0 rgba(12,19,29,.6)}
.modal .win-b{gap:10px}
.src{display:flex;justify-content:space-between;padding:7px 12px;background:var(--ink);color:#fff;font-family:var(--f-disp);font-size:16px}
.opt{text-align:left;padding:9px 12px;border:2px solid var(--ink);background:#fff;box-shadow:inset 0 -3px 0 #c9d3dd, 2px 2px 0 var(--ink);font-size:15px}
.opt small{display:block;color:var(--muted);font-size:14px}

/* Avvio */
#start:empty,#modal:empty{display:none}
#start{position:fixed;inset:0;z-index:70;overflow:auto;background:rgba(8,16,30,.7);padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px))}
#start .box{max-width:1080px;margin:0 auto;background:var(--panel);border:3px solid var(--ink2);box-shadow:inset 0 0 0 2px #fff, 8px 8px 0 rgba(12,19,29,.6)}
#start h1{margin:0;font-family:var(--f-disp);font-size:40px;line-height:1;text-shadow:3px 3px 0 var(--accent)}
.ceos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ceo{display:flex;flex-direction:column;gap:6px;padding:10px;background:#fff;border:3px solid var(--ink);cursor:pointer;text-align:left;box-shadow:inset 0 -3px 0 var(--panel2)}
.ceo[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent), 4px 4px 0 var(--ink)}
.sw{width:30px;height:30px;border:3px solid var(--ink)}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:900px){.ceos{grid-template-columns:repeat(2,minmax(0,1fr))}}

function techIcon(t,sz,dim){
  const F=TFRAME[t.tree], N=16; const cut=r=>{const d=Math.min(r,N-1-r);return F.cut[d]||0;};
  const ins=(x,y)=>y>=0&&y<N&&x>=cut(y)&&x<N-cut(y);
  let r='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ if(!ins(x,y))continue;
    const edge=!ins(x-1,y)||!ins(x+1,y)||!ins(x,y-1)||!ins(x,y+1);
    const ring=!edge&&(!ins(x-2,y)||!ins(x+2,y)||!ins(x,y-2)||!ins(x,y+2)||!ins(x-1,y-1)||!ins(x+1,y-1)||!ins(x-1,y+1)||!ins(x+1,y+1));
    r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${edge?'#16202e':ring?F.c:F.bg}"/>`; }
  (TECH_IC[t.id]||[]).forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')r+=`<rect x="${x+2}" y="${y+2}" width="1" height="1" fill="${TPAL[ch]}"/>`;}));
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 16 16" shape-rendering="crispEdges" style="flex:none;${dim?'filter:grayscale(1) opacity(.55)':''}" aria-hidden="true">${r}</svg>`;
}

const chMix=c=>{const m=cinfo(c).ch,t=Object.values(m).reduce((a,v)=>a+v,0)||1;return CHANNELS.filter(x=>m[x.id]).map(x=>({...x,s:m[x.id]/t}));};
const chAvg=(c,k)=>chMix(c).reduce((a,x)=>a+x.s*x[k],0);
// affinità tra due clienti: quota di pallet sugli stessi canali (0-1)
const chOverlap=(a,b)=>{const ma=cinfo(a).ch,mb=cinfo(b).ch,ta=Object.values(ma).reduce((x,v)=>x+v,0),tb=Object.values(mb).reduce((x,v)=>x+v,0);return CHANNELS.reduce((x,ch)=>x+Math.min((ma[ch.id]||0)/ta,(mb[ch.id]||0)/tb),0);};
function chBar(c,w){const mx=chMix(c);
  const tip=`<div class='tt'>Canali di distribuzione</div>`+mx.map(x=>`<div class='tr'><span><b style='color:${TPAL[x.c]}'>■</b> ${x.n}</span><span>${Math.round(x.s*100)}%</span></div>`).join('')+wikiHint();
  return `<span class="chbar" role="img" aria-label="Canali: ${mx.map(x=>x.n+' '+Math.round(x.s*100)+'%').join(', ')}" data-act="wiki" data-id="canali" data-tip="${tip}" style="display:inline-flex;width:${w||120}px;height:12px;border:2px solid #16202e;cursor:help;vertical-align:middle">${mx.map(x=>`<i style="width:${x.s*100}%;background:${TPAL[x.c]}"></i>`).join('')}</span>`;}
function distKm(lo1,la1,lo2,la2){const r=Math.PI/180,a=Math.sin((la2-la1)*r/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2;return 6371*2*Math.asin(Math.sqrt(a));}
// km di un viaggio di distribuzione (andata e ritorno) e di un viaggio di ritiro
function clientLog(c,w,sm){
  const s=SITES[w.site], z=ZONES[c.zone]||ZONES.nordovest;
  const cs=z.cities.map(n=>CITIES.find(x=>x[0]===n));
  const avg=cs.length?cs.reduce((a,x)=>a+distKm(s.lon,s.lat,x[1],x[2]),0)/cs.length:350;
  sm=sm||(w.kpi&&w.kpi.satM)||SAT0; const mf=(w.kpi&&w.kpi.mixF)||1;
  // ogni canale ha il suo carico: la saturazione del magazzino è la media, i canali si distribuiscono attorno
  const oKm=Math.round(2*avg*1.3+30), chs=chMix(c).map(x=>{const p=c.pal*x.s, ld=Math.min(95,sm*x.sat/mf); return {id:x.id,n:x.n,veh:x.veh,p,ld,trips:p>0?Math.ceil(p/(Math.round(CAPV*ld)/100)):0};});
  const out=chs.reduce((a,x)=>a+x.trips,0), oB=chs.filter(x=>x.veh==='B').reduce((a,x)=>a+x.trips,0);
  const o=ORIGINS[c.src]||ORIGINS.fornitori, iKm=Math.round(2*distKm(s.lon,s.lat,o.lon,o.lat)*1.3+20);
  const inn=c.mode==='ritiro'?Math.ceil(c.pal/33):0, veh=oB===0?'CE':oB===out?'B':'mix';

function lineChart(id,o){
  const L=o.labels, n=L.length;
  if(n<2) return `<div class="lc lc-empty"><b>${esc(o.title)}</b><span class="sm">Il grafico compare dalla seconda settimana di dati.</span></div>`;
  const W=o.w||860,H=o.h||250, ml=46,mr=o.labels2===false?14:(o.mr||136),mt=40,mb=34, pw=W-ml-mr, ph=H-mt-mb;
  const all=o.series.flatMap(s=>s.v.filter(v=>v!=null));
  let lo=Math.floor(Math.min(...all)-0.6), hi=Math.ceil(Math.max(...all)+0.4); if(hi-lo<4){const m=(hi+lo)/2;lo=Math.floor(m-2);hi=Math.ceil(m+2);}
  lo=Math.max(o.min!=null?o.min:0,lo); hi=Math.min(o.max!=null?o.max:100,hi);
  const step=hi-lo>12?4:hi-lo>6?2:1;
  const X=i=>ml+(n===1?pw/2:i*pw/(n-1)), Y=v=>mt+ph-(v-lo)/(hi-lo)*ph;
  let g='';
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step) g+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3e9ef" stroke-width="1"/><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end" class="lc-ax">${v}${o.unit||''}</text>`;
  g+=`<line x1="${ml}" x2="${ml+pw}" y1="${mt+ph}" y2="${mt+ph}" stroke="#8a96a6" stroke-width="1"/>`;
  const every=Math.ceil(n/8); L.forEach((l,i)=>{ if(i%every===0||(i===n-1&&(n-1)%every>=every/2)) g+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" class="lc-ax">${esc(l)}</text>`; });
  // linee: prima le soglie (tratteggiate), poi i dati
  const ends=[];
  [...o.series].sort((a,b)=>(b.dash?1:0)-(a.dash?1:0)).forEach(s=>{
    let d='',pen=false; s.v.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); pen=true; });
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.dash?1.5:2}" ${s.dash?'stroke-dasharray="6 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(!s.dash){ const i=s.v.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop(); if(i!=null&&i>=0){ g+=`<circle cx="${X(i)}" cy="${Y(s.v[i])}" r="4" fill="${s.c}" stroke="#fff" stroke-width="2"/>`; ends.push({y:Y(s.v[i]),t:`${s.short||s.n} ${f1(s.v[i])}${o.unit||''}`,c:s.c}); } }
  });
  // etichette dirette (al massimo 4 serie), distanziate per non sovrapporsi
  if(o.labels2!==false&&ends.length<=4){ ends.sort((a,b)=>a.y-b.y); for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<15) ends[i].y=ends[i-1].y+15;
    ends.forEach(e=>{ g+=`<line x1="${ml+pw+4}" x2="${ml+pw+12}" y1="${e.y}" y2="${e.y}" stroke="${e.c}" stroke-width="2"/><text x="${ml+pw+15}" y="${e.y+4}" class="lc-dl">${esc(e.t)}</text>`; }); }
  const leg=o.series.map(s=>`<span class="lc-key"><svg width="18" height="8" aria-hidden="true"><line x1="0" x2="18" y1="4" y2="4" stroke="${s.c}" stroke-width="${s.dash?1.5:2.5}" ${s.dash?'stroke-dasharray="4 3"':''}/></svg>${esc(s.n)}</span>`).join('');
  CHARTS[id]={L,series:o.series,unit:o.unit||'',ml,pw,n,W,mt,ph};
  return `<figure class="lc"><figcaption><b>${esc(o.title)}</b><span class="lc-leg">${leg}</span></figcaption>
   <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.title)}" data-chart="${id}">${g}
    <line class="lc-x" x1="0" x2="0" y1="${mt}" y2="${mt+ph}" stroke="#16202e" stroke-width="1" visibility="hidden"/>
    <rect class="lc-hit" x="${ml-10}" y="${mt-10}" width="${pw+20}" height="${ph+20}" fill="transparent"/></svg></figure>`;
}

• gli effetti degli [[eventi]].

Si perde molto se gli [[autisti]] non bastano (−20 punti per ogni 100% di lavoro in eccesso), un po' se mancano [[magazzinieri]], e 1,5 punti in tutti i magazzini per ogni [[impiegati|impiegato]] che manca in ufficio. Il valore resta tra 50% e 99,9%.

Passa il mouse sul riquadro Puntualità di un magazzino per vedere il calcolo voce per voce.`);
wk('accuratezza','kpi','Accuratezza',`Percentuale di ordini spediti senza errori (articolo giusto, quantità giusta). Dipende dalla Precisione del manager.`,
`Si parte da 96% e poi si somma:
• +0,3 per ogni punto di [[st_prec|Precisione]] del [[manager]] sopra 10;
• +0,04 per ogni punto di [[morale]] sopra 60;
• le [[tecnologie]] installate (barcode, WMS, pick-to-light…) e la [[tech_iso|certificazione ISO]].

Cala quando il magazzino è troppo pieno (oltre l'85% di [[saturazione]] gli scaffali diventano un labirinto) e quando i [[magazzinieri]] non bastano. Puntualità e accuratezza sono separate apposta: un cliente può chiederne una sola. Vedi [[otif]].`);
wk('soglie','kpi','Soglie KPI',`I livelli minimi di Puntualità e Accuratezza scritti nel contratto di ogni cliente.`,
`Ogni cliente ha la sua soglia di [[puntualita]] e, se gli interessa, di [[accuratezza]] ("non richiesta" vuol dire che non la controlla). La farmaceutica pretende il 99,5% di accuratezza, il pastificio si accontenta di arrivare in tempo.

Nei report i colori dicono come stai: verde sopra la soglia, giallo fino a 2 punti sotto, rosso oltre. In un magazzino con più clienti conta la soglia più severa. A fine mese il confronto decide la [[soddisfazione]].`);
wk('soddisfazione','kpi','Soddisfazione del cliente',`Quanto il cliente è contento di te, da 0 a 100. Sotto 25 disdice il contratto.`,
`Parte da 60. A fine mese si confrontano la puntualità e l'accuratezza medie del mese con le [[soglie]]:
• sopra soglia: +3 (+1 con [[tech_edi|EDI]], +1 con [[tech_kam|Key account]]);
• fino a 2 punti sotto: −4;
• più di 2 punti sotto: −10 e una [[penali|penale]].

Sotto 25 il cliente se ne va e perdi 3 di [[reputazione]]. Alla scadenza del [[contratto]] rinnova solo se la soddisfazione è almeno 50.`);
wk('penali','kpi','Penali',`Multa del 5% del fatturato mensile del cliente quando i KPI sono più di 2 punti sotto la soglia.`,
`Le penali si pagano a fine mese e compaiono nel [[conto|conto economico]]. Arrivano insieme al −10 di [[soddisfazione]]: due mesi così e il cliente è già a rischio.`);
wk('saturazione','kpi','Saturazione',`Quanto è pieno il magazzino: posti pallet occupati diviso posti disponibili.`,
`Un magazzino pieno rende, ma oltre l'85% di saturazione l'[[accuratezza]] cala in fretta: −2,5 punti ogni 10% in più. Le barre diventano gialle dal 70% e rosse dall'85%.

Da non confondere con la [[saturazione_mezzi|saturazione dei mezzi]], che misura quanto sono pieni i camion.

Non puoi fare un'offerta in una [[gare|gara]] se la merce del nuovo cliente non ci sta. Il [[tech_verticale|magazzino verticale]] aggiunge il 20% di posti.`);
wk('saturazione_mezzi','kpi','Saturazione dei mezzi',`Quanto sono pieni in media i camion che escono dal magazzino: pallet caricati diviso capienza (33 pallet).`,
`Si parte dal 48%: ogni cliente ha i suoi camion e spesso partono mezzi vuoti. Il mix dei [[canali]] sposta la base: la GDO riempie i bilici, l'horeca manda in giro furgoni mezzi vuoti. Più alta è la saturazione, meno viaggi servono per gli stessi pallet: meno km, meno gasolio e meno [[autisti]]. Il ricavo invece non cambia, perché il cliente paga a pallet: tutto il risparmio è margine.

Senza sforzo la saturazione sale con il [[tech_gps|GPS]] (+2), la [[tech_rotte|pianificazione rotte]] (+5) e soprattutto con la [[tech_sinergia|sinergia in pianificazione]], che mette sullo stesso camion la merce di clienti diversi: +7 per ogni cliente oltre il primo, fino a +30, moltiplicato per l'**affinità** media tra i clienti (quanta parte dei pallet va sugli stessi [[canali]]). Due fornitori di bar si dividono i giri; un supermercato e un negozio online quasi per niente.

Per andare oltre serve un [[obiettivo_sat|obiettivo minimo]] imposto dalla direzione. Massimo 95%. Per i furgoni la capienza si conta in colli, ma il conto è lo stesso.`);
wk('obiettivo_sat','kpi','Obiettivo minimo di saturazione',`Il livello minimo di saturazione dei mezzi che la direzione impone a un magazzino. Raggiungerlo costa sempre qualcosa.`,
`Lo scegli nella finestra del [[magazzino]], nella parte dei trasporti. Se l'obiettivo è sopra il carico che viene da sé, il personale deve aspettare i carichi completi e incastrare le consegne:

• la [[puntualita]] perde 0,06 punti per ogni punto di saturazione in più (camion che aspettano il carico);
• il personale arriva fin dove glielo permette la **capacità di pianificazione** = saturazione naturale + 1,2·([[st_op|Operazioni]] del [[manager]] − 10) + 0,25·([[morale]] − 60) + 8 per ogni [[impiegati|impiegato]] in più del necessario (fino a 3; tolti 8 per ognuno che manca);
• se la capacità supera l'obiettivo, va anche meglio: si prende il 35% della differenza in più;
• se non basta, la saturazione si ferma alla capacità e il morale obiettivo cala di 0,5 per ogni punto che manca. La finestra ti dice quanti impiegati in più servirebbero.

Un buon manager, un ufficio ben fornito e un morale alto possono portare i camion all'80-90%. Una squadra stanca e sotto organico no, e la direzione lo scopre a fine mese.`);
wk('morale','kpi','Morale',`L'umore del personale di un magazzino, da 0 a 100. Cambia lentamente.`,
`Ogni magazzino ha un morale che si avvicina piano piano a un valore obiettivo. L'obiettivo parte da 58 e sale con la [[st_lead|Leadership]] del [[manager]] (+0,6 per punto sopra 10), il [[welfare]], alcune [[tecnologie]], l'Academy e il [[dir_hr|direttore HR]]. Scende se il personale è sovraccarico e dopo i [[licenziamenti]].

Il morale alto rende i [[magazzinieri]] più produttivi e alza l'[[accuratezza]]. Verde da 60, giallo da 45, rosso sotto.`);
wk('report','kpi','Report KPI settimanale',`Il foglio di calcolo che arriva ogni lunedì con i numeri della settimana appena chiusa.`,
`Una scheda per il riepilogo, una per ogni [[magazzino]] e una per i clienti. Clicca una cella per vedere nella barra della formula come è calcolata; passa sui grafici per leggere i valori di ogni settimana. Le linee tratteggiate sono le [[soglie]] dei clienti.`);
// Abilità
wk('abilita','abil','Abilità',`Sei numeri che descrivono ogni personaggio. 10 è la media, da 15 in su è ottimo.`,
`Ogni persona ha [[st_op|Operazioni]], [[st_prec|Precisione]], [[st_neg|Negoziazione]], [[st_lead|Leadership]], [[st_amm|Amministrazione]] e [[st_inn|Innovazione]], ognuna con il suo colore e la sua icona. Contano in modo diverso a seconda del posto: un [[manager]] di magazzino usa Operazioni, Precisione e Leadership; un [[direzione|direttore]] usa solo l'abilità del suo ruolo; il [[ceo|CEO]] usa Negoziazione e Innovazione per tutta l'azienda.

I [[talenti]] sono già compresi nei numeri che vedi.`);
const STAT_TXT={
 op:`Nel [[manager]] di un magazzino alza la [[puntualita]]: +0,4 per ogni punto sopra 10, e toglie altrettanto sotto. Nel [[dir_op|direttore operativo]] vale +0,15 di puntualità in tutti i magazzini per ogni punto sopra 10.`,
 prec:`Nel [[manager]] di un magazzino alza l'[[accuratezza]]: +0,3 per ogni punto sopra 10. Utile soprattutto con i clienti esigenti come farmaceutica ed elettronica.`,
 neg:`Quella del [[ceo|CEO]] pesa in ogni [[gare|gara]]: +1 al punteggio per ogni punto sopra 10. Il [[dir_comm|direttore commerciale]] aggiunge +0,8 per punto. Negli [[eventi]] con i clienti apre risposte migliori.`,
 lead:`Nel [[manager]] di un magazzino alza il [[morale]] obiettivo: +0,6 per ogni punto sopra 10. Il [[dir_hr|direttore HR]] lo alza in tutti i magazzini e accorcia le [[assunzioni]]. Negli [[eventi]] con il personale apre risposte migliori.`,
 amm:`Il [[dir_fin|direttore finanziario]] taglia i [[costi]] fissi dello 0,5% per ogni punto sopra 10. Negli [[eventi]] con fisco, banche e burocrazia apre risposte migliori.`,
 inn:`Quella del [[ceo|CEO]] accorcia le [[ricerca|ricerche]]: −3% di tempo per ogni punto sopra 10 (fino a −40%). Se il [[dir_tech|direttore tecnologia]] ne ha di più, si usa la sua. Negli [[eventi]] tecnologici apre risposte migliori.`
};
STATS.forEach(s=>wk('st_'+s.k,'abil',s.n,s.d,STAT_TXT[s.k],sz=>statIcon(s.k,sz)));
// Talenti
wk('talenti','tal','Talenti',`Tratti di carattere, mostrati come icone. Cambiano le abilità e a volte aprono scelte speciali.`,
`Ogni personaggio ha uno o più talenti. Il colore del riquadro dice se è positivo (verde), negativo (rosso) o misto (giallo). Passa il mouse su un'icona per leggere l'effetto e la sua piccola storia.

Gli effetti sulle [[abilita|abilità]] sono già sommati nei numeri. Altri effetti valgono solo in certe situazioni: tempi di [[apprendimento]], [[morale]], scelte negli [[eventi]].`);
const TAL_ID={}; Object.keys(TALENTS).forEach((n,i)=>{TAL_ID[n]='tal_'+i; const t=TALENTS[n];
  wk('tal_'+i,'tal',n,t.fx,`${t.fx.split(' · ').join('\n• ').replace(/^/,'• ')}\n\n*${t.fl}*\n\nTipo: ${TTYPE[t.t][0].toLowerCase()}. Vedi [[talenti]].`,sz=>talentSvg(t.ic,sz));});
// Personale
wk('personale','pers','Personale',`Sei mestieri per ogni magazzino (magazzinieri, carrellisti, capiturno, impiegati, autisti B e CE) più i pianificatori del traffico in sede.`,
`Ogni magazzino ha il suo organico, e ogni mestiere fa un lavoro diverso:
• [[magazzinieri]]: preparano gli ordini, pesano sull'[[accuratezza]];
• [[carrellisti]]: muovono i pallet col muletto, pesano sulla [[puntualita]];
• [[capoturno|capiturno]]: uno ogni 10 operai, tengono su morale e accuratezza;
• [[impiegati]]: bolle, inventari e traffico, un po' su entrambi i KPI;
• [[autisti_ce|autisti con patente CE]]: bilici e motrici, tratte lunghe e ritiri;
• [[autisti_b|autisti con patente B]]: furgoni, consegne in città e ultimo miglio.

In sede lavorano i [[pianificatori]] del traffico, che servono a tutti i magazzini. Magazzinieri e carrellisti si possono anche prendere da una [[cooperativa]].

Ogni cliente dice con che mezzo vuole le consegne (vedi [[zona]]), quindi vincere una [[gare|gara]] cambia chi devi [[assunzioni|assumere]]. La finestra Personale mostra l'organico di tutti i magazzini.`);
wk('magazzinieri','pers','Magazzinieri',`Preparano gli ordini: prelevano i colli e compongono i pallet in uscita. Ognuno ne prepara circa 900 al mese.`,
`Un magazziniere prepara circa 900 pallet al mese con un [[morale]] di 70 (meno con i [[canali]] a colli e a pezzo: dettaglio, horeca, e-commerce), di più con le [[tecnologie]] di produttività (radiofrequenza, pick-to-light, robot).

Se non bastano crolla soprattutto l'[[accuratezza]] (−8 punti per ogni 100% di lavoro in eccesso), un po' la [[puntualita]], e il personale si stanca. Costano 18.000 € lordi l'anno, cioè circa 2.130 € al mese di [[costo_azienda|costo aziendale]].`);
wk('carrellisti','pers','Carrellisti',`Guidano il muletto: scaricano i camion, mettono a scaffale e caricano. Ognuno fa circa 1.800 movimenti al mese.`,
`Ogni pallet consegnato fa due [[movimenti]]: entrata e uscita. Col muletto un carrellista ne fa il doppio di un [[magazzinieri|magazziniere]], circa 1.800 al mese con un [[morale]] di 70, di più con le [[tecnologie]] di produttività.

Se non bastano i camion aspettano in banchina: cala la [[puntualita]] (−8 punti per ogni 100% di lavoro in eccesso) e un po' l'[[accuratezza]] (pallet urtati e messi nel posto sbagliato). Serve il patentino del muletto, per questo costano 19.500 € lordi l'anno.`);
wk('impiegati','pers','Impiegati di magazzino',`L'ufficio del magazzino: bolle, inventari, prenotazione delle consegne, traffico. Ne servono di più con più volume.`,
`In ogni magazzino ne serve uno, più uno ogni 1.500 pallet al mese consegnati (2.000 con il [[tech_gestionale|gestionale]]). Ogni impiegato che manca toglie 1,5 punti di [[puntualita]] e 1 di [[accuratezza]] in quel magazzino.

Costano 22.000 € lordi l'anno.`);
wk('capoturno','pers','Capoturno',`Coordina la squadra di magazzino: ne serve uno ogni 10 tra magazzinieri e carrellisti.`,
`Sotto i 10 operai il turno lo organizza il [[manager]]. Poi serve un capoturno ogni 10 tra [[magazzinieri]] e [[carrellisti]]. Ognuno che manca toglie 4 punti al [[morale]] obiettivo e 1 punto di [[accuratezza]].

Costano 25.000 € lordi l'anno: di solito è il magazziniere più anziano, quello che sa dov'è tutto senza guardare il [[wms|WMS]].`);
wk('pianificatori','pers','Pianificatori del traffico',`In sede organizzano i giri dei camion di tutti i magazzini. Ne serve uno ogni 80 viaggi al mese.`,
`Finché l'azienda fa meno di 80 viaggi al mese i giri li organizza il [[ceo|CEO]]. Poi serve un pianificatore ogni 80 viaggi (distribuzione più [[ritiro|ritiri]], tutti i magazzini insieme).

Ognuno che manca toglie 2 punti di [[puntualita]] in tutti i magazzini. Con la squadra al completo i giri sono ottimizzati e i km costano il 4% in meno. Costano 26.000 € lordi l'anno.`);
wk('cooperativa','pers','Cooperativa di facchinaggio',`Magazzinieri e carrellisti forniti da una cooperativa: costano meno e arrivano subito, ma lavorano peggio e portano guai.`,
`Si attiva per ogni magazzino con la casella nella sua finestra. Con la cooperativa:
• [[magazzinieri]] e [[carrellisti]] costano il 20% in meno;
• arrivano in 3 giorni, senza costi di ricerca, e si mandano via gratis, senza buonuscita né calo di [[morale]];
• il morale obiettivo scende di 3 punti e l'[[accuratezza]] di 0,5: la squadra cambia di continuo, e con i clienti più esigenti mezzo punto pesa;
• arrivano [[eventi]] a tema: scioperi, controlli dell'Ispettorato del lavoro, cooperative che spariscono nel nulla.

Passare alla cooperativa abbassa il morale di 5 punti per un mese. Tornare ad assumere direttamente costa 600 € a persona e alza il morale di 5. [[capoturno|Capiturno]], [[impiegati]] e autisti restano sempre dipendenti.`);
wk('autisti','pers','Autisti',`Due patenti, due mestieri: la CE per bilici e tratte lunghe, la B per i furgoni in città.`,
`I km da fare dipendono dalla [[zona]] di distribuzione dei clienti e dai viaggi di [[ritiro]]. Le consegne con i furgoni le fanno gli [[autisti_b|autisti con patente B]]; tutto il resto, ritiri compresi, gli [[autisti_ce|autisti con patente CE]].

Se gli autisti non bastano la [[puntualita]] crolla: −20 punti per ogni 100% di lavoro in eccesso.`);
wk('autisti_ce','pers','Autisti patente CE',`Guidano bilici e motrici: ognuno copre circa 5.200 km al mese. Sono i più difficili da trovare.`,
`Servono la patente CE e la carta di qualificazione (CQC). Fanno le distribuzioni dei clienti che vogliono i bilici e tutti i viaggi di [[ritiro]].

Ognuno guida una [[motrici|motrice]]. Costano 23.000 € lordi l'anno più 1.100 € al mese di spese del mezzo. In Italia ne mancano davvero: un'[[assunzioni|assunzione]] richiede 3-6 settimane, quindi assumi appena vinci una gara.`);
wk('autisti_b','pers','Autisti patente B',`Guidano i furgoni fino a 3,5 tonnellate: consegne in città, negozi, farmacie, e-commerce. Ognuno copre circa 4.000 km al mese.`,
`Servono ai [[canali]] con tante consegne piccole: horeca, dettaglio ed e-commerce. Il traffico e le soste fanno meno km al giorno di un bilico.

Costano 19.000 € lordi l'anno più 900 € al mese di furgone in leasing, e il furgone consuma la metà. Si trovano in fretta (2-3 settimane con l'annuncio), ma cambiano lavoro spesso.`);
wk('manager','pers','Manager di magazzino',`Il capo di un magazzino. Le sue Operazioni, Precisione e Leadership decidono i KPI e il morale.`,
`Il manager usa tre [[abilita|abilità]]: [[st_op|Operazioni]] per la [[puntualita]], [[st_prec|Precisione]] per l'[[accuratezza]] e [[st_lead|Leadership]] per il [[morale]]. Senza manager il magazzino va avanti con valori scarsi (7, 7 e 6).

All'inizio il manager è il [[ceo|CEO]]. Gli altri si assumono dalla finestra Personale e si assegnano dal menu a tendina del magazzino. Un manager senza magazzino può diventare un [[direzione|direttore]].`);
wk('assunzioni','pers','Assunzioni',`Annuncio (economico ma lento) o agenzia interinale (veloce ma cara). Il nuovo arrivato si presenta dopo qualche giorno.`,
`I tempi base con l'annuncio o con l'agenzia: [[magazzinieri]] 20 o 6 giorni, [[carrellisti]] 25 o 8, [[impiegati]] 20 o 7, [[autisti_b|autisti B]] 15 o 6, [[autisti_ce|autisti CE]] 40 o 16, [[capoturno|capiturno]] e [[pianificatori]] 25 o 8. Con la [[cooperativa]] magazzinieri e carrellisti arrivano in 3 giorni, gratis. Si accorciano con il [[welfare]], la [[reputazione]], l'[[tech_hr|ufficio del personale]] e il [[dir_hr|direttore HR]].

Assumi in anticipo: quando vinci una [[gare|gara]] hai 30 giorni prima che il cliente parta.`);
wk('licenziamenti','pers','Licenziamenti',`Costano un mese di stipendio di buonuscita e abbassano il morale del magazzino per 30 giorni.`,
`Il pulsante − toglie una persona subito. Paghi la buonuscita e il [[morale]] del magazzino scende di 4 punti per un mese. Utile quando perdi un cliente e il personale resta senza lavoro. Le persone della [[cooperativa]] si mandano via gratis e senza calo di morale.`);
wk('welfare','pers','Welfare',`Buoni pasto, assicurazione, premio, navetta: costano ogni mese per dipendente ma alzano il morale e accorciano le assunzioni.`,
`Si attiva dalla finestra Azienda e vale per tutti i dipendenti:
• Buoni pasto: 110 € a testa, morale +5;
• Assicurazione sanitaria: 35 €, morale +4;
• Premio di produzione: 80 €, morale +6;
• Navetta dalla stazione: 20 €, morale +2.

Ogni voce rende anche l'azienda più attraente e accorcia le [[assunzioni]]. Con la ricerca [[tech_welfare2|Welfare aziendale]] costa il 30% in meno.`);
wk('motrici','pers','Motrici',`I camion. Quelli di proprietà sono già pagati, ogni autista CE in più guida una motrice in leasing da 2.100 € al mese.`,
`Il numero di motrici di proprietà dipende dal [[ceo|CEO]] scelto. Quando gli [[autisti_ce|autisti con patente CE]] sono più delle motrici, la differenza si prende in leasing e finisce nei costi dei mezzi. I furgoni degli [[autisti_b|autisti B]] sono sempre in leasing (900 € al mese).`);
wk('costo_azienda','pers','Costo aziendale',`Lo stipendio lordo annuo (RAL) moltiplicato per 1,42: contributi, TFR e tredicesima compresi.`,
`Quando vedi una RAL, il costo vero per l'azienda è il 42% in più, diviso per 12 mesi. Vale per tutto il [[personale]], i [[manager]] e i dirigenti.`);
// Clienti e gare
wk('clienti','cli','Clienti',`Le aziende che ti affidano la merce: pagano per i posti occupati, i movimenti e le consegne.`,
`Ogni cliente ha un volume (posti pallet occupati e pallet consegnati al mese), delle [[soglie]] di servizio, una [[zona]] di distribuzione e un modo di farti arrivare la merce ([[ritiro]] o consegna). È servito da un solo [[magazzino]].

Il primo cliente è quello storico del tuo CEO; tutti gli altri arrivano dalle [[gare]].`);
wk('gare','cli','Gare d\'appalto',`Un cliente cerca un fornitore logistico: hai 21 giorni per fare un'offerta. Ne arriva una ogni 4-7 settimane.`,
`Scegli il [[magazzino]] e il [[prezzo]]. Il gioco stima i KPI che avresti e la probabilità di vincere, che dipende da:
• il prezzo: ogni 1% di sconto vale +1,2 punti;
• i KPI previsti rispetto alle [[soglie]] del cliente;
• la [[reputazione]], la [[st_neg|Negoziazione]] del CEO e il [[dir_comm|direttore commerciale]];
• la [[tech_iso|certificazione ISO]];
• la difficoltà del cliente (i grandi sono più contesi).

Ogni cliente ha un [[rank]] da S a F. Alcuni clienti chiedono [[tech_richieste|tecnologie obbligatorie]]. Se vinci il [[contratto]] parte dopo 30 giorni; se non partecipi, il cliente va a un [[concorrenti|concorrente]]. Con l'[[tech_commerciale|ufficio commerciale]] le gare arrivano più spesso.`);
wk('prezzo','cli','Prezzo rispetto al listino',`Lo sconto o il ricarico che offri in gara, da −20% a +20%. Più basso = più probabilità, meno margine.`,
`Il listino è calcolato su stoccaggio, [[movimenti]] e trasporto (vedi [[ricavi]]). Il prezzo scelto resta per tutti i 24 mesi del [[contratto]]: uno sconto troppo aggressivo può farti lavorare in perdita.`);
wk('contratto','cli','Contratto',`Dura 24 mesi e parte 30 giorni dopo la gara vinta. Alla scadenza il cliente rinnova se la soddisfazione è almeno 50.`,
`Nei 30 giorni prima dell'avvio prepara il [[magazzino]]: [[assunzioni|assumi]] il [[personale]] che serve. Alla scadenza il rinnovo è automatico se la [[soddisfazione]] è almeno 50 (40 con il [[tech_kam|Key account management]]); altrimenti il cliente passa alla concorrenza.`);
wk('canali','cli','Canali di distribuzione',`Dove finisce la merce del cliente: supermercati, bar e ristoranti, negozi, case dei clienti online, stabilimenti. Ogni cliente ha il suo mix in percentuale.`,
`Ogni cliente divide i suoi pallet tra cinque canali (la barra colorata nelle gare e nella scheda cliente):

• **GDO**: piattaforme dei supermercati. Bilici pieni (carico ×1,2), appuntamento fisso allo scarico ([[puntualita]] −0,8), tariffa di distribuzione ×0,9, poco [[magazzinieri|picking]] (×0,8).
• **Horeca**: bar, ristoranti e hotel. Furgoni ([[autisti_b|patente B]]) mezzi vuoti (carico ×0,6), consegne all'alba (puntualità −0,4, [[accuratezza]] −0,3), tariffa ×1,3, picking ×1,2.
• **Dettaglio**: negozi, farmacie, ferramenta. Furgoni, carico ×0,8, picking a colli ×1,3, accuratezza −0,6, tariffa ×1,15.
• **E-commerce**: consegne a casa. Furgoni, carico ×0,7, picking a pezzo ×1,6, accuratezza −1, puntualità −0,4, tariffa ×1,25.
• **Industria**: stabilimenti e cantieri. Bilici ([[autisti_ce|patente CE]]), carico ×1,1, orari flessibili (puntualità +0,5, accuratezza +0,3), picking ×0,7, tariffa ×0,9. **Chi lavora per l'industria non ha altri canali.**

Gli effetti si pesano sui pallet di tutti i clienti del magazzino. Il carico dei canali sposta la [[saturazione_mezzi|saturazione dei mezzi]]: la saturazione del magazzino è la media, e ogni canale viaggia più pieno o più vuoto di così. La [[tech_sinergia|sinergia in pianificazione]] rende solo tra clienti che servono gli stessi canali.`);
wk('zona','cli','Zona di distribuzione',`Dove il cliente vuole le consegne: una provincia, una regione, tutto il Nord-Ovest o il Nord Italia.`,

function mgrStats(wh){
  if(wh.mgr==='ceo'){const s=ceo().st;return {op:s.op,prec:s.prec,lead:s.lead,name:ceo().name,ceo:true};}

}

function personById(id){return S.managers.find(m=>m.id===id)||S.execs.find(m=>m.id===id);}
function dirStat(role){ if(!R('direzione')) return null; const p=personById(S.dirs[role]); if(!p) return null; const st=DIR_ROLES.find(r=>r.id===role).stat; return p.st[st]; }

function capOf(w){const t=TECH.find(x=>x.id==='verticale'); return Math.round(w.cap*(1+(w.tech.verticale&&techFactor(w,t)>0?t.cap:0)));}
function techFactor(wh,t){
  const it=wh.tech[t.id]; if(!it) return 0;
  let weeks=t.weeks; const m=mgrStats(wh);
  if(m.ceo && ceo().allergic) weeks*=1.5; if(m.ceo && ceo().robots) weeks*=0.7; if(R('academy')) weeks*=0.7;
  return (S.day-it.day)<weeks*7 ? -0.5 : 1;
}

function planNeed(){return Math.floor(S.clients.filter(c=>c.status==='attivo').reduce((a,c)=>{const w=whById(c.wh),t=clientLog(c,w);return a+t.out+t.in;},0)/80);}
function impNeed(cons){return 1+Math.ceil(cons/(R('gestionale')?2000:1500));}

function modSum(wh,k){return S.mods.filter(m=>m.until>S.day&&(m.scope==='all'||m.scope===wh.id)).reduce((a,m)=>a+(m[k]||0),0);}
// saturazione dei mezzi: quanto sono pieni in media i camion in uscita (% della capienza)
function satMezzi(wh,act,m,needImp,mixF){
  const n=act.length; let nat=SAT0*mixF; const pS=[['Base',SAT0]]; if(Math.abs(mixF-1)>0.005) pS.push(['Mix dei canali',SAT0*(mixF-1)]);
  // affinità media tra le coppie di clienti: la sinergia rende solo se i clienti servono gli stessi canali
  let aff=0,np=0; for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){aff+=chOverlap(act[i],act[j]);np++;} aff=np?aff/np:0;
  TECH.forEach(t=>{ if(t.tree!=='log'||!wh.tech[t.id]) return; const f=techFactor(wh,t);
    if(t.sm){pS.push([t.name,t.sm*f]); nat+=t.sm*f;}
    if(t.smC&&n>1){const v=Math.min(t.smMax,t.smC*(n-1)*aff)*f; pS.push([`Sinergia tra ${n} clienti (affinità ${Math.round(aff*100)}%)`,v]); nat+=v;} });
  // capacità di pianificazione: fin dove il personale riesce a spingere i carichi se la direzione impone un obiettivo
  const obj=wh.satObj||0, extra=clamp((wh.staff.imp||0)-needImp,-3,3);
  const cP=[['Operazioni di '+m.name.split(' ')[0],1.2*(m.op-10)],['Morale',0.25*(wh.morale-60)]];
  if(extra) cP.push([extra>0?'Impiegati in più':'Impiegati mancanti',8*extra]);
  const mS=modSum(wh,'sm'); if(mS) cP.push(['Eventi',mS]);
  const pot=nat+cP.reduce((a,x)=>a+x[1],0);
  let val=nat;
  if(obj>nat){ val=pot>=obj?obj+0.35*(pot-obj):Math.max(nat,pot); pS.push([`Obiettivo ${obj}%: lavoro del personale`,Math.min(95,val)-nat]); }
  val=Math.min(95,val);
  const short=obj>nat?Math.max(0,obj-pot):0, addImp=obj>nat?clamp(Math.ceil((obj-(pot-8*extra))/8),0,3):0;
  return {val,nat,pot,obj,push:Math.max(0,val-nat),short,addImp,pS,cP,aff};
}
function computeWH(wh,extra){
  const act=S.clients.filter(c=>c.wh===wh.id&&c.status==='attivo'); if(extra) act.push(extra);
  const stock=act.reduce((a,c)=>a+c.stock,0), cons=act.reduce((a,c)=>a+c.pal,0), mov=2*cons;
  // mix dei canali del magazzino, pesato sui pallet
  const chW=k=>cons?act.reduce((a,c)=>a+c.pal*chAvg(c,k),0)/cons:(k==='sat'||k==='pick'?1:0);

function step(){

  S.queue.filter(q=>q.days<=0).forEach(q=>{
    if(q.role==='plan'){S.office.plan++; toast('Assunto: 1 pianificatore del traffico in sede','ok'); return;}

    toast(`${isCoop(w,q.role)?'Arrivato dalla cooperativa':'Assunto'}: 1 ${ROLE1[q.role]} a ${w.name}`,'ok');
  });
  S.queue=S.queue.filter(q=>q.days>0);
  // clienti in avvio
  S.clients.filter(c=>c.status==='avvio'&&d>=c.start).forEach(c=>{c.status='attivo';toast(`${c.name} inizia oggi a ${whById(c.wh).name}`,'ok');news('Il Sole 24 Pallet',`${c.name} affida la logistica a ${S.company.name}`,`Il contratto parte oggi: ${n0(c.pal)} pallet al mese, ${n0(c.stock)} posti occupati.`);});

  let dRic=0,dCost=0; const cur=S.cur;

    w.morale+= (k.morT-w.morale)*0.012;
    w.acc.P+=k.P; w.acc.A+=k.A; w.acc.n++;
    const wk=w.wk||(w.wk={n:0,P:0,A:0,sat:0,mor:0,mov:0,trips:0,rev:0,cost:0}); wk.n++; wk.P+=k.P; wk.A+=k.A; wk.sat+=k.sat; wk.satM=(wk.satM||0)+k.satM; wk.mor+=w.morale;
    wk.mov+=k.mov/30; wk.trips+=k.viaggi/30; wk.rev+=k.rev/30; wk.cost+=(k.pers+k.mezzi+k.fissi+k.tCan)/30;
    cur.ric+=k.rev/30; cur.pers+=k.pers/30; cur.mezzi+=k.mezzi/30; cur.fissi+=k.fissi/30; cur.tech+=k.tCan/30;

    if(t.id==='iso'||t.id==='marketing') S.rep=clamp(S.rep+5,0,100);

    if(t.id==='direzione') modalInfo('La Gazzetta del Muletto','Nasce la squadra dei dirigenti','La struttura direzionale è pronta. Dal menu Direzione nomina fino a cinque direttori: ognuno guida un\'area di tutta l\'azienda con la sua abilità principale.');
    else toast(`Ricerca completata: ${t.name}${t.tree==='log'?' · installala nei magazzini':''}`,'ok'); } }
  // gare
  if(d>=S.nextTender){ newTender(); S.nextTender=d+Math.round(R('commerciale')?rnd(20,35):rnd(28,46)); }

function fireEvent(){
  const el=EVENTS.filter(e=>(!e.once||!S.seen[e.id])&&(S.seen[e.id]===undefined||S.day-S.seen[e.id]>240)&&e.cond());
  if(!el.length) return;

// salvataggi con i vecchi ruoli (magazzinieri, autisti, impiegati di sede)
function migrateStaff(s){
  if(!s.warehouses.some(w=>w.staff.mag!==undefined)) return s;
  const oldImp=s.imp||0, n=s.warehouses.length;
  s.warehouses.forEach((w,i)=>{const o=w.staff;
    w.staff={pick:Math.ceil((o.mag||0)/2),car:Math.floor((o.mag||0)/2),autB:0,autCE:o.aut||0,imp:Math.floor(oldImp/n)+(i<oldImp%n?1:0)};});
  const first=s.warehouses[0].id;
  s.queue.forEach(q=>{q.role={mag:'car',aut:'autCE',imp:'imp'}[q.role]||q.role; if(!q.wh) q.wh=first;});
  delete s.imp; s.staffMig=true; return s;
}
// campi aggiunti dopo: capoturno, cooperativa, pianificatori
function fillSave(s){
  if(!s.office) s.office={plan:0};
  s.warehouses.forEach(w=>{if(w.staff.capo===undefined) w.staff.capo=0; if(w.coop===undefined) w.coop=false;});
  return s;
}
// dopo la conversione: gli autisti che servono sui furgoni passano alla patente B
function rebalanceDrivers(){
  if(!S.staffMig) return; delete S.staffMig;
  S.warehouses.forEach(w=>{const k=computeWH(w), mv=Math.min(k.need.autB,Math.max(0,w.staff.autCE-k.need.autCE)); w.staff.autCE-=mv; w.staff.autB+=mv;});
}
// canali di distribuzione (dal 2026): i clienti di prima ora usano anche i furgoni; gli autisti CE in più passano alla patente B e quelli che mancano vengono assunti una volta sola
function chMigrate(){
  if(S.chV) return; S.chV=1;
  S.warehouses.forEach(w=>{const k=computeWH(w), mv=Math.min(k.need.autB,Math.max(0,w.staff.autCE-k.need.autCE)); w.staff.autCE-=mv; w.staff.autB=Math.max(w.staff.autB+mv,k.need.autB);});
}

const view={s:1,x:0,y:0};
function fitMap(){
  const W=innerWidth,H=innerHeight; const s0=Math.max(W/1280,H/800);
  view.min=s0; if(view.s<s0||!view.init){view.s=s0;view.x=(W-1280*s0)/2;view.y=(H-800*s0)/2;view.init=1;}
  clampView(); applyView();
}
function clampView(){const W=innerWidth,H=innerHeight;view.x=clamp(view.x,W-1280*view.s,0);view.y=clamp(view.y,H-800*view.s,0);}
function applyView(){$('#map').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;}
function initMapControls(){
  const mw=$('#mapwrap'); let drag=null;
  mw.addEventListener('pointerdown',e=>{ if(e.target.closest('.mk')) return; drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};mw.classList.add('drag');mw.setPointerCapture(e.pointerId);});
  mw.addEventListener('pointermove',e=>{if(!drag)return;view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;clampView();applyView();});
  const up=()=>{drag=null;mw.classList.remove('drag');}; mw.addEventListener('pointerup',up); mw.addEventListener('pointercancel',up);
  mw.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.15:1/1.15;const ns=clamp(view.s*f,view.min,view.min*3.2);
    const mx=e.clientX,my=e.clientY;view.x=mx-(mx-view.x)*ns/view.s;view.y=my-(my-view.y)*ns/view.s;view.s=ns;clampView();applyView();},{passive:false});
  addEventListener('resize',fitMap);
}

const PROV_CAP={TO:'Torino',VC:'Vercelli',NO:'Novara',CN:'Cuneo',AT:'Asti',AL:'Alessandria',AO:'Aosta',IM:'Imperia',SV:'Savona',GE:'Genova',SP:'La Spezia',VA:'Varese',CO:'Como',SO:'Sondrio',MI:'Milano',BG:'Bergamo',BS:'Brescia',PV:'Pavia',CR:'Cremona',MN:'Mantova',BI:'Biella',LC:'Lecco',LO:'Lodi',VB:'Verbania',MB:'Monza'};
function lensProv(){
  const fill=[],line=[],lab=[];
  PROV.forEach(p=>{
    const d=p.rings.map(r=>'M'+r.map(q=>q.join(' ')).join('L')+'Z').join('');
    const mine=S.warehouses.filter(w=>w.prov===p.id), free=Object.values(SITES).filter(s=>s.prov===p.id&&!S.warehouses.some(w=>SITES[w.site]===s));
    const tip=`<div class='tt'>${esc(p.n)} (${p.id})</div>${esc(p.reg)} · capoluogo ${esc(PROV_CAP[p.id])}`
      +(mine.length?`<br>I tuoi magazzini: <b>${mine.map(w=>esc(w.name)).join(', ')}</b>`:'')
      +(free.length?`<br>Siti in affitto: ${free.map(s=>esc(s.name)).join(', ')}`:'')
      +(p.id==='MB'&&S.day<2737?`<br><i>Sulla carta esiste dal 2004, ma fino al 2009 gli uffici dicono «chieda a Milano».</i>`:'');
    fill.push(`<path class="prov" d="${d}" fill="${TPAL[p.c]}" fill-opacity="${mine.length?.5:.32}" data-tip="${tip}"/>`);
    line.push(`<path d="${d}" fill="none" stroke="#16202e" stroke-width="${mine.length?3:1.5}" stroke-opacity=".75" stroke-linejoin="round"/>`);
    lab.push(`<text class="plbl" x="${p.lp[0]}" y="${p.lp[1]+p.lp[2]*.36}" font-size="${p.lp[2]}" text-anchor="middle">${p.id}</text>`);
  });
  return [`<g aria-label="Province">`,...fill,`<g shape-rendering="auto" pointer-events="none">`,...line,'</g>',...lab,'</g>'];
}

let trucks=[], lastT=0;
const TRUCK=c=>`<rect x="0" y="0" width="13" height="8" fill="#16202e"/><rect x="1" y="1" width="11" height="6" fill="${c}"/><rect x="13" y="2" width="6" height="6" fill="#16202e"/><rect x="14" y="3" width="4" height="2" fill="#bfe6ff"/><rect x="2" y="8" width="3" height="3" fill="#16202e"/><rect x="13" y="8" width="3" height="3" fill="#16202e"/>`;
function syncTrucks(){
  const want=[]; S.warehouses.forEach(w=>{const n=Math.min(w.kpi&&w.kpi.viaggi?w.staff.autB+w.staff.autCE:0,6);for(let i=0;i<n;i++)want.push(w.id+'_'+i);});
  trucks=trucks.filter(t=>want.includes(t.id));
  want.forEach(id=>{ if(trucks.find(t=>t.id===id)) return; const w=whById(id.split('_')[0]); const s=SITES[w.site];
    trucks.push({id,from:pt(s.lon,s.lat),to:null,t:Math.random(),back:false});});
  const g=$('#trucks'); if(!g) return;
  g.innerHTML=trucks.map(t=>`<g id="tk_${t.id}">${TRUCK(getComputedStyle(document.documentElement).getPropertyValue('--accent'))}</g>`).join('');
}
function animTrucks(ts){
  const dt=Math.min(0.1,(ts-lastT)/1000||0); lastT=ts;
  const mv=S&&!S.over&&S.speed>0 && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  trucks.forEach(t=>{
    if(!t.to){const c=pick(CITIES);t.to=pt(c[1],c[2]);t.t=0;t.back=false;}
    const dx=t.to[0]-t.from[0],dy=t.to[1]-t.from[1],len=Math.hypot(dx,dy)||1;
    if(mv) t.t+=dt*(25+S.speed*20)/len;
    if(t.t>=1){ if(!t.back){t.back=true;t.t=0;[t.from,t.to]=[t.to,t.from];} else {t.from=t.to;t.to=null;} }
    if(!t.to) return;
    const x=t.from[0]+(t.to[0]-t.from[0])*clamp(t.t,0,1), y=t.from[1]+(t.to[1]-t.from[1])*clamp(t.t,0,1);
    const el=document.getElementById('tk_'+t.id); if(el) el.setAttribute('transform',`translate(${Math.round(x-9)},${Math.round(y-5)})${t.to[0]<t.from[0]?' scale(-1,1) translate(-19,0)':''}`);
  });
  requestAnimationFrame(animTrucks);
}

const TITLES={azienda:'Azienda e CEO',magazzini:'Magazzini',clienti:'Clienti',gare:'Gare d\'appalto',personale:'Personale e manager',tecnologia:'Tecnologia',report:'Report KPI settimanale',direzione:'Direzione',espansione:'Espansione',giornale:'Il giornale',enciclopedia:'Enciclopedia di FUP'};
function renderDock(){
  const openT=S.tenders.filter(t=>!t.done&&!t.bid).length;
  const short=S.warehouses.filter(w=>w.kpi&&ROLES.some(r=>w.staff[r]<w.kpi.need[r])).length;
  const planS=S.office.plan<planNeed()?1:0;
  const B={gare:openT,magazzini:short,personale:planS};
  $('#dock').innerHTML=DOCK.map(([id,t,ic])=>`<button class="${UI.open[id]?'on':''}" data-act="toggle" data-id="${id}" aria-label="${esc(t)}" data-tip="<div class='tt'>${esc(t)}</div>${id==='magazzini'&&short?'Personale insufficiente in un magazzino':id==='personale'&&planS?'Servono pianificatori del traffico in sede':id==='tecnologia'&&S.project?'Ricerca in corso: '+S.project.left+' giorni':id==='direzione'&&!R('direzione')?'Si sblocca con la ricerca Struttura direzionale':''}">${ic}${B[id]?`<span class="badge">${id==='gare'?B[id]:'!'}</span>`:''}${id==='tecnologia'&&S.project?`<span class="badge" style="background:var(--accent);color:var(--ink)">${S.project.left}</span>`:''}${id==='report'&&S.repNew?'<span class="badge">1</span>':''}${id==='direzione'&&R('direzione')&&Object.values(S.dirs).some(v=>!v)?'<span class="badge">!</span>':''}</button>`).join('');
}
function renderTop(){
  $('#date').textContent=fmtDate(S.day);
  $('#coname').textContent=S.company.name;
  document.querySelectorAll('.spd button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===S.speed)));
  $('#paused').hidden=S.speed!==0;
  const last=S.last?S.last.util:null;
  const mor=S.warehouses.reduce((a,w)=>a+w.morale,0)/S.warehouses.length;
  $('#stats').innerHTML=`
   <div class="chip" data-act="wiki" data-id="cassa" data-tip="${wikiTip('cassa')}"><span>Cassa</span><b class="${S.cash<0?'bad':''}" style="${S.cash<0?'color:#ff8a8d':''}">${eur(S.cash)}</b></div>
   <div class="chip" data-act="wiki" data-id="conto" data-tip="<div class='tt'>Risultato del mese scorso</div>Utile o perdita del conto economico: il dettaglio è nella finestra Azienda.${wikiHint()}"><span>Mese scorso</span><b style="color:${last==null?'#fff':last>=0?'#6fdc8c':'#ff8a8d'}">${last==null?'—':(last>=0?'+':'')+eur(last)}</b></div>
   <div class="chip opt2" data-act="wiki" data-id="gasolio" data-tip="${wikiTip('gasolio')}"><span>Gasolio</span><b>${S.fuel.toFixed(2).replace('.',',')} €/l</b></div>
   <div class="chip opt2" data-act="wiki" data-id="morale" data-tip="<div class='tt'>Morale medio</div>Dipende da manager, carichi di lavoro, welfare ed eventi.${wikiHint()}"><span>Morale</span><b style="color:${mor>=60?'#6fdc8c':mor>=45?'#ffc53d':'#ff8a8d'}">${Math.round(mor)}</b></div>
   <div class="chip" data-act="wiki" data-id="reputazione" data-tip="${wikiTip('reputazione')}"><span>Reputazione</span><b>${Math.round(S.rep)} / 100</b></div>`;
}
function openWin(id,opts){
  UI.open[id]=true; if(opts) Object.assign(UI.sel,opts);
  let el=document.getElementById('win-'+id);
  if(!el){
    el=document.createElement('section'); el.className='win'+(id==='enciclopedia'?' wkw':id==='tecnologia'||id==='report'?' xwide':['magazzini','gare','azienda','direzione'].includes(id)?' wide':''); el.id='win-'+id;
    el.setAttribute('aria-label',TITLES[id]);
    const i=Object.keys(UI.pos).length; const p=UI.pos[id]||{x:Math.min(innerWidth-420,90+((i*36)%240)),y:86+((i*30)%180)};
    if(id==='magazzini'||id==='gare'){p.x=Math.max(90,innerWidth-680);} if(id==='enciclopedia'){p.x=Math.max(90,innerWidth-900);p.y=86;} if(id==='tecnologia'){p.x=90;}
    UI.pos[id]=p; el.style.left=p.x+'px'; el.style.top=p.y+'px';
    el.innerHTML=`<header class="win-h"><span class="grip"></span><h2>${TITLES[id]}</h2><button class="xbtn" data-act="close" data-id="${id}" aria-label="Chiudi">x</button></header><div class="win-b"></div>`;
    $('#wins').appendChild(el); makeDraggable(el,id);
    const mx=Math.max(0,innerWidth-el.offsetWidth-16); if(p.x>mx){p.x=mx;el.style.left=p.x+'px';}
  }
  el.style.zIndex=++UI.z; renderWin(id); renderDock();
}
function closeWin(id){delete UI.open[id];const el=document.getElementById('win-'+id);if(el)el.remove();renderDock();}
function makeDraggable(el,id){
  const h=el.querySelector('.win-h'); let d=null;
  el.addEventListener('pointerdown',()=>{el.style.zIndex=++UI.z;});
  h.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;d={x:e.clientX,y:e.clientY,l:el.offsetLeft,t:el.offsetTop};h.setPointerCapture(e.pointerId);});
  h.addEventListener('pointermove',e=>{if(!d)return;const x=clamp(d.l+e.clientX-d.x,0,innerWidth-80),y=clamp(d.t+e.clientY-d.y,56,innerHeight-40);el.style.left=x+'px';el.style.top=y+'px';UI.pos[id]={x,y};});
  h.addEventListener('pointerup',()=>d=null);
}
function renderWin(id){const el=document.getElementById('win-'+id);if(!el)return;const b=el.querySelector('.win-b');const st=b.scrollTop;b.innerHTML=(VIEWS[id]||(()=>''))();b.scrollTop=st;}
function renderAll(){renderTop();const ae=document.activeElement;Object.keys(UI.open).forEach(id=>{const el=document.getElementById('win-'+id);if(el&&ae&&el.contains(ae)&&ae.matches('select,input'))return;if(id==='enciclopedia')return;if(id!=='gare'||!UI.bidEditing)renderWin(id);});renderDock();}
function satObjTxt(sm){
  if(!sm.obj) return `<div class="sm">Senza obiettivo i camion partono pieni al ${Math.round(sm.nat)}%: è il carico che viene da sé.</div>`;
  const tip=tipParts('Capacità di pianificazione '+Math.round(sm.pot)+'%',[['Base',sm.nat],...sm.cP],'');
  if(sm.obj<=sm.nat) return `<div class="sm ok" data-tip="${tip}">Obiettivo già raggiunto senza sforzo: i camion partono al ${Math.round(sm.val)}%.</div>`;
  if(sm.short>0.5) return `<div class="sm bad" data-tip="${tip}">Il personale non ci sta dietro: arriva al ${Math.round(sm.val)}% e il morale ne risente.${sm.addImp?` Servirebbero ${sm.addImp} ${kw('impiegati',sm.addImp>1?'impiegati':'impiegato')} in più.`:''}</div>`;
  return `<div class="sm ok" data-tip="${tip}">Obiettivo raggiunto: camion pieni al ${Math.round(sm.val)}%${sm.val>sm.obj+1?', il personale fa anche meglio':''}. In cambio la ${kw('puntualita','puntualità')} perde ${f1(0.06*sm.push)}.</div>`;
}
const kpiCls=(v,s)=>s==null?'ok':v>=s?'ok':v>=s-2?'warn':'bad';
const barColor=v=>v>=0.85?'var(--bad)':v>=0.7?'var(--warn)':'var(--ok)';
function tipParts(title,parts,unit){return `<div class='tt'>${esc(title)}</div>`+parts.map(([n,v])=>`<div class='tr'><span>${esc(n)}</span><span>${n==='Base'?f1(v):(v>=0?'+':'')+f1(v)}${unit||''}</span></div>`).join('');}

function innUsed(){const d=dirStat('tech');return Math.max(ceo().st.inn,d==null?0:d);}

function hireDays(base){const att=40+welfarePts('att')+(S.rep-50)*0.5+5;const h=dirStat('hr');return Math.max(3,Math.round(base*clamp(1+(55-att)/40,0.6,1.8)*(R('hr')?0.8:1)*(h!=null?1-0.02*(h-10):1)));}

 research(d){const t=TECH.find(x=>x.id===d.id); if(S.project||S.cash<t.cost||R(t.id))return; S.cash-=t.cost; S.cur.tech+=t.cost;
  const days=techDays(t); S.project={tech:t.id,left:days,total:days,cost:t.cost}; toast(`Ricerca avviata: ${t.name}, pronta tra ${days} giorni`,'ok'); renderAll();},
 install(d){const t=TECH.find(x=>x.id===d.id), w=whById(d.wh); if(!R(t.id)||w.tech[t.id]||S.cash<t.inst)return; S.cash-=t.inst; S.cur.tech+=t.inst; w.tech[t.id]={day:S.day};
  toast(`${t.name} installato a ${w.name}: inizia l'apprendimento`,'ok'); renderAll();},
 canceltech(){ if(!S.project)return; const r=S.project.cost*0.5; S.cash+=r; S.cur.tech-=r; toast(`Ricerca annullata: rimborsati ${eur(r)}`,'warn'); S.project=null; renderAll(); },
 setdir(d,el){const v=el.value||null; Object.keys(S.dirs).forEach(k=>{if(S.dirs[k]===v)S.dirs[k]=null;}); S.dirs[d.role]=v; if(v){const p=personById(v); toast(`${p.name} è il nuovo ${DIR_ROLES.find(r=>r.id===d.role).name.toLowerCase()}`,'ok');} renderAll();},
 hireexec(d){const e=S.execs.find(x=>x.id===d.id); if(S.cash<15000)return; S.cash-=15000; S.cur.altro+=15000; e.hired=true; toast(`${e.name} entra in azienda: nominalo in Direzione`,'ok'); renderAll();},
 fireexec(d){const e=S.execs.find(x=>x.id===d.id); const c=e.ral/12*COEF; S.cash-=c; S.cur.altro+=c; e.hired=false; Object.keys(S.dirs).forEach(k=>{if(S.dirs[k]===e.id)S.dirs[k]=null;}); renderAll();},
 rent(d){
  const s=SITES[d.id]; const cost=2*s.rent+15000; if(S.cash<cost)return;
  S.cash-=cost; S.cur.altro+=cost; const w=addWarehouse(d.id,false,0,0);
  news('Il Sole 24 Pallet',`${S.company.name} apre a ${s.name}`,`Nuovo magazzino da ${n0(s.cap)} posti pallet.`); S.rep+=3;
  toast(`Nuovo magazzino a ${s.name}: assumi personale e un manager`,'ok'); renderMap(); syncTrucks(); openWin('magazzini',{wh:w.id}); renderAll();
 },
 coop(d,el){
  const w=whById(d.wh), n=w.staff.pick+w.staff.car;
  if(el.checked){w.coop=true;mod(w.id,{mor:-5},30);toast(`${w.name}: magazzinieri e carrellisti passano alla cooperativa. I sindacati non sono contenti.`,'warn');}
  else {const c=600*n;w.coop=false;S.cash-=c;S.cur.altro+=c;mod(w.id,{mor:5},60);toast(`${w.name}: ${n} persone assunte direttamente, ${eur(c)} di pratiche`,'ok');}
  renderAll();
 },
 welfare(d,el){S.welfare[d.id]=el.checked;renderAll();},
 bidwh(d,el){UI.bid.wh=el.value;renderWin('gare');},
 bidmult(d,el){UI.bid.mult=(+el.value)/100;const sel=S.tenders.find(t=>t.id===UI.bid.t);$('#bidmv').textContent=(UI.bid.mult>=1?'+':'')+Math.round((UI.bid.mult-1)*100)+'%';$('#bidest').innerHTML=bidEstHtml(sel,bidEstimate(sel,UI.bid.wh,UI.bid.mult));},
 bid(d){const t=S.tenders.find(x=>x.id===d.id);t.bid={wh:UI.bid.wh,mult:UI.bid.mult};toast(`Offerta inviata per ${t.name}`,'ok');renderAll();},
 withdraw(d){const t=S.tenders.find(x=>x.id===d.id);t.bid=null;renderAll();},
 evopt(d){const ev=UI.ev;const o=ev.opts[+d.i];o.f.call(ev);S.rep=clamp(S.rep,0,100);closeModal();news(ev.src,ev.title,`${ev.text} Scelta: ${o.t}.`);renderAll();},
 choice(d){const f=UI.choice[+d.i];closeModal();f();renderAll();},
 closemodal(){closeModal();},
 wiki(d,el){
  // nella schermata iniziale il clic passa al pulsante che contiene la parola chiave (es. la scelta del CEO)
  if(!S||!WIKI_ON){const p=el.parentElement&&el.parentElement.closest('[data-act]'); if(p&&ACT[p.dataset.act]) ACT[p.dataset.act](p.dataset,p); return;}
  if(!WIKI[d.id]) return;
  if(UI.wiki!==d.id){ if(UI.wiki||UI.open.enciclopedia) (UI.wikiBack=UI.wikiBack||[]).push(UI.wiki||null); UI.wiki=d.id; }
  wikiShow();
 },
 wikiback(){ if(!(UI.wikiBack||[]).length) return; UI.wiki=UI.wikiBack.pop(); wikiShow(); },
 wikihome(){ (UI.wikiBack=UI.wikiBack||[]).push(UI.wiki); UI.wiki=null; wikiShow(); },
 save(){save();toast('Partita salvata','ok');},
 restart(){closeModal();showStart();}
};
function wikiShow(){
  const old=document.querySelector('#wiki-list'), ls=old?old.scrollTop:0;
  $('#tip').hidden=true; openWin('enciclopedia');
  const el=document.getElementById('win-enciclopedia'); el.querySelector('.win-b').scrollTop=0;
  const l=el.querySelector('#wiki-list'); l.scrollTop=ls; const c=l.querySelector('[aria-current="true"]');
  if(c&&(c.offsetTop<l.scrollTop||c.offsetTop>l.scrollTop+l.clientHeight-30)) l.scrollTop=c.offsetTop-l.clientHeight/3;
}
function doHire(r,wh,days,cost){S.cash-=cost;S.cur.altro+=cost;S.queue.push({role:r,wh:r==='plan'?null:wh,days});toast(`Ricerca avviata: arriva tra ${days} giorni`,'ok');}
function setSpeed(v){S.speed=v;renderTop();}
function showModal(html){$('#modal').innerHTML=`<div class="ovl"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const b=$('#modal button');if(b)b.focus();}
function closeModal(){$('#modal').innerHTML='';if(UI.evSpeed){setSpeed(UI.evSpeed);UI.evSpeed=0;}}
function showChoice(title,text,opts){UI.choice=opts.map(o=>o.f);UI.evSpeed=S.speed;S.speed=0;renderTop();
 showModal(`<div class="src"><span>${esc(title)}</span><span></span></div><div class="win-b"><p style="margin:0">${esc(text)}</p>${opts.map((o,i)=>`<button class="opt" data-act="choice" data-i="${i}">${esc(o.t)}<small>${esc(o.e)}</small></button>`).join('')}<button class="btn" data-act="closemodal">Annulla</button></div>`);}
function toast(text,kind){
  const el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=text;$('#toasts').prepend(el);
  setTimeout(()=>el.remove(),5200); const all=$('#toasts').children; if(all.length>5) all[all.length-1].remove();
}

/* ====================== EVENTI DOM ====================== */
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.tagName==='INPUT'||a.tagName==='SELECT')return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a.dataset,a);}});
document.addEventListener('change',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f&&(a.tagName==='SELECT'||a.type==='checkbox')){a.blur();f(a.dataset,a);}});
document.addEventListener('input',e=>{if(e.target.id==='wiki-q'){UI.wikiQ=e.target.value;$('#wiki-list').innerHTML=wikiList();return;}const a=e.target.closest('input[type=range][data-act]');if(a)ACT[a.dataset.act](a.dataset,a);});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#win-gare input[type=range]'))UI.bidEditing=true;});
document.addEventListener('pointerup',()=>{UI.bidEditing=false;});
document.addEventListener('keydown',e=>{
  if(!S||$('#start').innerHTML||e.target.matches('input[type=text]'))return;
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.kw')){e.preventDefault();e.target.click();return;}
  if($('#modal').innerHTML) return;
  if(e.code==='KeyE'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ACT.toggle({id:'enciclopedia'});return;}
  if(e.code==='Space'){e.preventDefault();setSpeed(S.speed?0:(UI.prevSpeed||1));if(S.speed)UI.prevSpeed=S.speed;}
  if(['Digit1','Digit2','Digit3'].includes(e.code)){setSpeed(+e.code.slice(5));UI.prevSpeed=S.speed;}
  if(e.code==='KeyL'){const i=LENSES.findIndex(l=>l.id===(UI.lens||'base'));ACT.lens({id:LENSES[(i+1)%LENSES.length].id});}
});
// tooltip
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){if(!e.target.closest('svg[data-chart]'))tip.hidden=true;return;}tip.innerHTML=t.dataset.tip;tip.hidden=false;});
document.addEventListener('mousemove',e=>{if(tip.hidden)return;const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(e.clientX+14,innerWidth-w-8)+'px';tip.style.top=Math.min(e.clientY+16,innerHeight-h-8)+'px';});

/* ====================== AVVIO ====================== */
let startSel={ceo:'gino',color:'#ff7a3d',name:''};
const COLORS=[['#ff7a3d','#c8551f','#ffb07a'],['#ff4f9a','#c22b6f','#ff9cc6'],['#3dd6c4','#1f9e8f','#9cefe5'],['#9b6bff','#6f43cf','#c8adff']];
function applyColor(c){const t=COLORS.find(x=>x[0]===c)||COLORS[0];const r=document.documentElement.style;r.setProperty('--accent',t[0]);r.setProperty('--accent-d',t[1]);r.setProperty('--accent-l',t[2]);}
function showStart(){
  setSpeedSafe(0); WIKI_ON=false; const sv=load();
  const st=CEOS.map(c=>{const s=SITES[c.site];return `<button class="ceo" data-act="pickceo" data-id="${c.id}" aria-pressed="${startSel.ceo===c.id}">
    <div class="portrait" style="height:150px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden"><img class="px" src="${IMG[c.id]}" alt="Ritratto di ${esc(c.name)}" width="128" height="150"></div>
    <b class="disp" style="font-size:18px">${esc(c.name)}</b><span class="sm">${c.age} anni · ${esc(c.origin)}</span>
    <span class="sm" style="color:var(--ink)">${esc(s.name)} (${s.prov}) · ${n0(s.cap)} posti · ${eur(c.cash)}</span>
    <span>${statChips(c.st,14)}</span>
    ${talentIcons(c.tal,32)}
    <span class="sm" style="display:flex;align-items:center;gap:6px">${logoSvg(c.client.name,24)} Cliente storico: ${esc(c.client.name)} ${rankIcon(c.client,18)}</span></button>`;}).join('');
  const C=CEOS.find(c=>c.id===startSel.ceo);
  $('#start').innerHTML=`<div class="box"><div class="src"><span>FUP</span><span>Nord-Ovest, gennaio 2002</span></div><div class="win-b" style="gap:14px;padding:18px">
   <div><h1>FUP</h1><div class="disp" style="font-size:20px;margin-top:4px">Fino all'ultimo pallet</div></div>
   <p style="margin:0;max-width:65ch">Guida un'azienda di trasporti e logistica nel Nord-Ovest. Vinci gare, assumi le persone giuste, investi in tecnologia e non far scendere la cassa sotto i −50.000 €.</p>
   ${sv&&sv.S&&!sv.S.over?`<div class="card pend"><div class="row"><span><b>${esc(sv.S.company.name)}</b> · ${fmtDate(sv.S.day)}</span><button class="btn pri" data-act="continue">Continua la partita</button></div></div>`:''}
   <div class="lab">1. Scegli il tuo CEO</div><div class="ceos">${st}</div>
   <div class="split"><label style="display:flex;flex-direction:column;gap:4px"><span class="lab">2. Nome dell'azienda</span><input type="text" id="coname-in" maxlength="40" value="${esc(startSel.name||C.company)}" aria-label="Nome dell'azienda"></label>
   <div style="display:flex;flex-direction:column;gap:4px"><span class="lab">3. Colore</span><div style="display:flex;gap:8px">${COLORS.map(c=>`<button class="sw" data-act="pickcolor" data-c="${c[0]}" aria-pressed="${startSel.color===c[0]}" style="background:${c[0]}" aria-label="Colore ${c[0]}"></button>`).join('')}</div></div></div>
   <div class="row"><span class="sm">Comandi: spazio per la pausa, 1–3 per la velocità, L per le lenti della mappa, trascina e usa la rotellina sulla mappa.</span><button class="btn pri" data-act="startgame" style="font-size:18px;padding:10px 18px">Inizia</button></div>
  </div></div>`;
}
function setSpeedSafe(v){if(S){S.speed=v;renderTop();}}
Object.assign(ACT,{
 pickceo(d){const old=CEOS.find(c=>c.id===startSel.ceo);const inp=$('#coname-in');const typed=inp?inp.value:'';startSel.ceo=d.id;if(!typed||typed===old.company)startSel.name='';else startSel.name=typed;showStart();},
 pickcolor(d){startSel.color=d.c;applyColor(d.c);startSel.name=$('#coname-in').value;showStart();},
 startgame(){const nm=($('#coname-in').value||'').trim();uid=1;newGame(startSel.ceo,nm,startSel.color);boot();},
 continue(){const sv=load();if(!sv)return;S=fillSave(migrateStaff(renameClients(sv.S)));S.managers.forEach(m=>{const d=MANAGERS.find(x=>x.id===m.id);if(d){m.tal=d.tal;m.role=d.role;}});if(S.project===undefined)S.project=null;uid=sv.uid||S.uid||100;rebalanceDrivers();chMigrate();boot();}
});
function boot(){
  $('#start').innerHTML=''; applyColor(S.company.color); WIKI_ON=true;
  Object.keys(UI.open).forEach(closeWin); UI={open:{},sel:{},tab:{},z:30,pos:{},bid:{},lens:UI.lens};
  view.init=0; fitMap(); renderMap(); S.warehouses.forEach(w=>w.kpi=computeWH(w)); syncTrucks(); renderAll();
  if(S.day===0){ modalInfo('La Gazzetta del Muletto',`Benvenuto, ${ceo().name}`,`Hai un magazzino a ${S.warehouses[0].name} e un solo cliente, ${S.clients[0].name}. Con il magazzino quasi vuoto perdi soldi ogni mese: tieni d'occhio le Gare d'appalto, assumi in anticipo quando ne vinci una e controlla Puntualità e Accuratezza nel menu Magazzini. Premi spazio per far scorrere il tempo. Le parole sottolineate a puntini si spiegano passandoci sopra; cliccale, o premi E, per aprire l'Enciclopedia.`); }
}
/* ciclo di gioco */
let acc=0,lastTick=performance.now(); const STEP=[0,1000,420,140];
function loop(now){
  const dt=now-lastTick; lastTick=now;
  if(S&&!S.over&&S.speed>0&&!$('#modal').innerHTML){acc+=dt; let n=0; while(S.speed>0&&acc>=STEP[S.speed]&&n<5){acc-=STEP[S.speed];step();n++; if(S.over)break;} if(n){syncTrucksMaybe();renderAll();}}
  else acc=0;
  requestAnimationFrame(loop);
}
let lastSync=0; function syncTrucksMaybe(){if(S.day-lastSync>=7){lastSync=S.day;syncTrucks();}}
initMapControls();
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({S,uid}));
function start(data){ if(data&&data.S){S=data.S;uid=data.uid||100;boot();} else showStart(); fitMap(); requestAnimationFrame(loop); requestAnimationFrame(animTrucks); }
if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data);
window.__FUP={get S(){return S;},step,newGame:(c)=>{uid=1;newGame(c,'',COLORS[0][0]);},computeWH,bidEstimate,EVENTS,TECH,TREES,techIcon,clientLog,logoSvg,LOGO,STATS,statIcon,weekEnd,ACT,WIKI,rankOf,rankScore,TENDER_POOL,CEOS,save,KEY,planNeed};
})();
</script>
