# Pubblica il gioco su GitHub Pages a ogni push su main.
# Il sito mostra dist/fup.html come pagina principale, con accanto i file della web app.
name: Pubblica su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp dist/fup.html _site/index.html
          # web app installabile sul telefono: manifest, service worker e icone
          cp dist/manifest.webmanifest dist/sw.js dist/icona_*.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
